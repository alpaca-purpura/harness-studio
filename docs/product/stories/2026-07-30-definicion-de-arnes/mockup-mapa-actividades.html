function actividadesDe(g){return (g.arnes&&g.arnes.actividades)||[];}
function facetaActividades(g,boxId){return actividadesDe(g).filter(a=>(a.pasos||[]).some(p=>p.caja===boxId)).map(a=>a.id);}
function cajasDe(g){return g.nodos.filter(n=>n.caja);}
function cajasSinActividad(g){if(!actividadesDe(g).length)return[];return cajasDe(g).filter(n=>facetaActividades(g,n.id).length===0);}
function fasesDeActividad(g,act){const fs=new Set();(act.pasos||[]).forEach(p=>{const n=g.nodos.find(x=>x.id===p.caja);if(n&&n.fase)fs.add(n.fase);});return fs;}
/* salud del chip = worst-of de los hallazgos FE YA existentes (gate:none crit ·
   no-reconocido warn · paso sin caja warn) — sin dato nuevo */
function saludDe(g,act){
  let s="ok";
  const worst=v=>{if(v==="crit")s="crit";else if(v==="warn"&&s!=="crit")s="warn";};
  (act.pasos||[]).forEach(p=>{
    if(!p.caja){worst("warn");return;}
    const n=g.nodos.find(x=>x.id===p.caja);
    if(!n){worst("warn");return;}
    if(n.clase==="no-reconocido")worst("warn");
    if(n.contract&&n.contract.gate&&n.contract.gate.tipo==="none")worst("crit");
  });
  return s;
}
function saludGrupo(g,cajas){let s="ok";cajas.forEach(n=>{if(n.contract&&n.contract.gate&&n.contract.gate.tipo==="none")s="crit";else if(n.clase==="no-reconocido"&&s!=="crit")s="warn";});return s;}

/* ── ▲ N0: chips de actividad (MA-L1/L5) ── */
function renderActBar(){
  const g=GRAPHS[current],bar=document.getElementById("actbar"),box=document.getElementById("achips");
  const acts=actividadesDe(g);
  if(!acts.length){bar.style.display="none";return;}  /* MA-L5/E8: sin tipos → la fila NO existe */
  bar.style.display="flex";box.innerHTML="";
  acts.forEach(a=>{
    const cajas=(a.pasos||[]).filter(p=>p.caja).length;
    const b=document.createElement("button");
    const sinProc=!(a.pasos||[]).length;
    b.className="achip"+(sinProc?" degradado":"");
    b.setAttribute("aria-pressed",String(actFoco===a.id));
    if(sinProc){
      b.innerHTML=`<span class="nm">${esc(a.id)}</span><span class="n">sin procedimiento aún (E7)</span>`;
      b.title="Actividad declarada en tipos_paquete sin pasos — MA-L5: degradado honesto";
    }else{
      const s=saludDe(g,a);
      b.innerHTML=`<span class="dot" style="--sd:var(--${s})" title="salud ${esc(s)} = worst-of de hallazgos existentes"></span><span class="nm">${esc(a.id)}</span><span class="n">${cajas} caja${cajas===1?"":"s"}</span>`;
      b.title=`estados: ${a.estados.join(" → ")} · cierre: ${a.cierre}`;
    }
    b.addEventListener("click",()=>{if(sinProc)return;actFoco=actFoco===a.id?null:a.id;render();});
    b.addEventListener("mouseenter",()=>{if(actFoco||sinProc)return;preResalta(a);});
    b.addEventListener("mouseleave",()=>{if(actFoco)return;preResalta(null);});
    box.appendChild(b);
  });
  const sa=cajasSinActividad(g);
  if(sa.length){

    b.innerHTML=`<span class="dot" style="--sd:var(--${saludGrupo(g,sa)})"></span><span class="nm">sin-actividad</span><span class="n">${sa.length} cajas (E6 — candidatas a declarar o podar)</span>`;
    b.addEventListener("click",()=>{actFoco=actFoco==="sin-actividad"?null:"sin-actividad";render();});
    box.appendChild(b);
  }
  const hayE7=acts.some(a=>!(a.pasos||[]).length);
  if(hayE7){const c=document.createElement("button");c.className="cta-chat";c.textContent="⌨ forjar el procedimiento conversando";c.title="CTA al chat (E7)";box.appendChild(c);}

function preResalta(a){

    const n=g.nodos.find(x=>x.id===el.dataset.nodeId);

/* ── edges: vigente + ▲ secuencia del procedimiento (N1) ── */
let z=1,ox=24,oy=24;
function drawEdges(){
  const g=GRAPHS[current];
  const content=document.getElementById("content"),svg=document.getElementById("edges");
  [...svg.querySelectorAll("path.edge,g.seq")].forEach(p=>p.remove());
  const base=content.getBoundingClientRect();
  const pt=el=>{const r=el.getBoundingClientRect();return{x1:(r.right-base.left)/z,y1:(r.top+r.height/2-base.top)/z,x0:(r.left-base.left)/z,y0:(r.top+r.height/2-base.top)/z};};
  for(const e of(g.edges||[])){
    const spine=e.tipo==="invoca",touches=focus&&(e.de===focus||e.a===focus);
    if(!spine&&!touches)continue;
    const from=content.querySelector(`[data-node-id="${e.de}"]`),to=content.querySelector(`[data-node-id="${e.a}"]`);
    if(!from||!to)continue;const f=from.getBoundingClientRect(),t=to.getBoundingClientRect();if(!f.width||!t.width)continue;
    const x1=(f.right-base.left)/z,y1=(f.top+f.height/2-base.top)/z,x2=(t.left-base.left)/z,y2=(t.top+t.height/2-base.top)/z,dx=Math.max(30,Math.abs(x2-x1)/2);
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("class","edge");
    p.setAttribute("d",`M ${x1},${y1} C ${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);p.setAttribute("fill","none");
    const s=STROKE[e.tipo]||STROKE.invoca;p.setAttribute("stroke",s.color);if(s.dash)p.setAttribute("stroke-dasharray",s.dash);
    let op=s.opacity,w=1.6;
    if(focus){if(touches){op=.95;w=2.2;}else if(spine)op=.2;}
    if(actFoco&&spine&&!focus)op=.18;  /* MA-L6: el foco atenúa el spine genérico, no lo borra */
    p.setAttribute("opacity",op);p.setAttribute("stroke-width",String(w));if(e.tipo!=="lee")p.setAttribute("marker-end","url(#arr)");
    svg.appendChild(p);
  }
  /* ▲ secuencia numerada del procedimiento — sólido --primary (los dash ya significan otra cosa) */
  const act=actFoco&&actFoco!=="sin-actividad"?actividadesDe(g).find(a=>a.id===actFoco):null;
  if(act){
    const grp=document.createElementNS("http://www.w3.org/2000/svg","g");grp.setAttribute("class","seq");
    const seq=(act.pasos||[]).map(p=>content.querySelector(`[data-node-id="${p.caja||("ghost-"+p.paso)}"]`)).filter(Boolean);
    for(let i=0;i<seq.length;i++){
      const el=seq[i],r=el.getBoundingClientRect();
      if(i<seq.length-1){
        const n=seq[i+1],rn=n.getBoundingClientRect();
        const x1=(r.right-base.left)/z,y1=(r.top+r.height/2-base.top)/z,x2=(rn.left-base.left)/z,y2=(rn.top+rn.height/2-base.top)/z,dx=Math.max(34,Math.abs(x2-x1)/2);
        const p=document.createElementNS("http://www.w3.org/2000/svg","path");
        p.setAttribute("d",`M ${x1},${y1} C ${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);
        p.setAttribute("fill","none");p.setAttribute("stroke","var(--primary)");p.setAttribute("stroke-width","2.6");p.setAttribute("opacity",".95");p.setAttribute("marker-end","url(#arr)");
        grp.appendChild(p);
      }
      const cx=(r.left-base.left)/z-9,cy=(r.top-base.top)/z+9;
      const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r","9");c.setAttribute("fill","var(--primary)");
      const t=document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",cx);t.setAttribute("y",cy+3.5);t.setAttribute("text-anchor","middle");
      t.setAttribute("font-size","10");t.setAttribute("font-weight","700");t.setAttribute("fill","var(--primary-foreground)");
      t.textContent=String(i+1);
      grp.appendChild(c);grp.appendChild(t);
    }
    svg.appendChild(grp);
  }
  /* foco de nodo por hover (vigente) — con actividad focada, el dim lo gobierna el foco de actividad */
  const nodes=content.querySelectorAll(".node");
  if(!actFoco){
    if(focus){const rel=new Set([focus]);for(const e of(g.edges||[])){if(e.de===focus)rel.add(e.a);if(e.a===focus)rel.add(e.de);}nodes.forEach(n=>{if(!n.classList.contains("ghost"))n.classList.toggle("dim",!rel.has(n.dataset.nodeId));});}
    else nodes.forEach(n=>n.classList.remove("dim"));
  }
}

    }
    s+=section("Fuente",field("fuente",n.fuente_path||"— pendiente del reconocedor")+field("origen",n.origen||"estándar"));
    if(n.clase==="rule")s+=section("Activación",field("carga",n.alw?"siempre en contexto · PROPUESTA":"condicional (paths:) · PROPUESTA"));
    if(!c){s+=section("Rol",`<p class="mut">${esc(k.label)} — sin contrato de caja.</p>`);}
    else{
      if(c.why)s+=section("Intención",`<p class="fg">${esc(c.why)}</p>`);
      if(c.capabilities)s+=section("Capabilities",`<ul class="caps">${c.capabilities.map(cap=>`<li><span class="mono mut">${esc(cap.id)}</span> ${esc(cap.what)}<div class="mut">✓ ${esc(cap.success)}</div></li>`).join("")}</ul>`);
      if(c.necesita&&c.necesita.length)s+=section("Necesita",`<div class="chips">${c.necesita.map(inp=>`<button class="chip" ${inp.de.includes(":")?"":"disabled"}>${esc(inp.art)}<span class="org">← ${esc(inp.de)}</span></button>`).join("")}</div>`);
      if(c.entrega&&c.entrega.length)s+=section("Entrega",`<ul class="caps">${c.entrega.map(o=>`<li>${esc(o.art)}${o.escritor_unico?`<span class="mut"> · escritor único</span>`:""}</li>`).join("")}</ul>`);
      if(c.ruta&&c.ruta.length)s+=section("Ruta",`<div class="chips">${c.ruta.map(r=>`<span>→ <button class="chip">${esc(r.a)}</button>${r.si?`<span class="mut"> si ${esc(r.si)}</span>`:""}</span>`).join("")}</div>`);
      if(c.gate)s+=section("Gate",field("tipo",c.gate.tipo)+(c.gate.detalle?`<p class="fg">${esc(c.gate.detalle)}</p>`:""));
      if(c.handoff)s+=section("Handoff",`<p class="fg">${esc(c.handoff.cuando)} <span class="mut">→ ${esc(c.handoff.a)}</span></p>`);
    }
    const gateNone=c&&c.gate&&c.gate.tipo==="none";
    s+=section("Hallazgos",(gateNone?`<p class="hallazgo crit"><b>gate:none</b> — caja sin eval formal (A4): hueco visible, no blanco.</p>`:`<p class="mut">Sin hallazgos abiertos.</p>`));
    s+=`<div class="dw-actions"><button class="act primary" disabled title="Editar conversando — vivo en el producto; acá deshabilitado (mockup)">Editar conversando</button>${acts.length>1?`<p class="act-note">⚠ usada por ${acts.length} actividades (${esc(acts.join(" · "))}) — el chat antepone el radio de impacto (MA-L4 ▲)</p>`:""}<button class="act" disabled>Evaluar A/B contra v anterior</button><button class="act" disabled>Promover a estable</button><button class="act" disabled>Ver en Historia</button></div>`;
    pane=s;
  }else if(insTab==="contenido"){
    pane=section("Fuente del componente",(n.fuente_path?`<p class="mut">fuente real servida por el daemon, confinada al dir del arnés</p>`:`<p class="mut">Sin <span class="mono">fuente_path</span> — pendiente del reconocedor.</p>`))+
      `<div class="dw-actions"><button class="act primary" disabled>Editar fuente</button><button class="act" disabled>Editar conversando (dock)</button></div>`;
  }else if(insTab==="corridas"){
    pane=section("Corridas donde actuó",`<p class="mut">Sin corridas indexadas de este arnés todavía.</p>`)+
      `<div class="dw-actions"><button class="act" disabled>Ver todas las corridas del arnés</button></div>`;
  }else{
    pane=section("Mejora",`<p class="mut">Sin telemetría atribuible a este nodo todavía — la capa Mejora muestra el motivo honesto, no un cero fabricado.</p><p class="mut" style="margin-top:6px">Filtrar costo POR actividad = diferido (E12): el join gana la dimensión cuando la llave de terreno lleve el tipo.</p>`);
  }
  d.innerHTML=`<header class="dw-head"><span class="glyph ${k.shape}" style="--tc:${k.color}">${esc(k.char)}</span><div class="dw-id"><div class="dw-nombre">${esc(n.nombre)}</div><div class="dw-handle">${esc(k.label)} · <span class="mono">${esc(handle(n))}</span></div></div><button class="dw-expand" title="Ampliar">⤢</button><button class="dw-close" id="dw-close" title="Cerrar">✕</button></header><div class="dw-tabs" role="tablist">${tabs}</div><div class="dw-body">${pane}</div>`;
  d.querySelector("#dw-close").onclick=()=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");selected=null;document.querySelectorAll(".node.sel").forEach(e=>e.classList.remove("sel"));if(artMode==="auto")render();};
  d.querySelectorAll(".dw-tab").forEach(b=>b.onclick=()=>{insTab=b.dataset.tab;paintInspector(n);});
  d.querySelectorAll(".chip[data-act]").forEach(b=>b.onclick=()=>{actFoco=b.dataset.act;render();});
}

/* ── barra vigente: meta · artefactos · capas · escenas · tema ── */
function renderMeta(){
  const g=GRAPHS[current];
  document.getElementById("arnes-id").textContent=g.arnes.id;
  document.getElementById("meta").innerHTML=[["empresa",(g.arnes.empresas||[]).join(" · ")],["reporta a",g.arnes.reporta_a||"—"],["⬡",g.arnes.marketplace]].map(([kk,v])=>`<span class="mchip">${esc(kk)} <b>${esc(v)}</b></span>`).join("");
}
document.querySelectorAll(".scenebar button[data-s]").forEach(b=>b.onclick=()=>{
  current=b.dataset.s;selected=null;actFoco=null;focus=null;
  document.querySelectorAll(".scenebar button[data-s]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  document.getElementById("drawer").classList.remove("open");
  render();renderMeta();requestAnimationFrame(fit);
});
document.getElementById("theme-toggle").onclick=()=>{
  const r=document.documentElement,cur=r.getAttribute("data-theme");
  const next=cur==="dark"?"light":"dark";
  r.setAttribute("data-theme",next);
  document.getElementById("theme-toggle").setAttribute("aria-pressed",String(next==="dark"));
};
document.getElementById("seg-art").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;artMode=b.dataset.a;[...document.querySelectorAll("#seg-art button")].forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.a===artMode)));render();});
document.getElementById("seg-capa").addEventListener("click",e=>{const b=e.target.closest("button[data-c]:not([disabled])");if(!b)return;[...document.querySelectorAll("#seg-capa button")].forEach(x=>x.setAttribute("aria-selected",String(x===b)));});

/* ── zoom/pan/hover (vigente, calcado) ── */
function applyT(){document.getElementById("stage").style.transform=`translate(${ox}px,${oy}px) scale(${z})`;drawEdges();}
function fit(){const c=document.getElementById("content"),vp=document.getElementById("viewport");const cw=c.scrollWidth,ch=c.scrollHeight,vw=vp.clientWidth,vh=vp.clientHeight;z=+Math.min((vw-48)/cw,(vh-48)/ch,1).toFixed(3);ox=Math.max(24,(vw-cw*z)/2);oy=24;applyT();}
document.getElementById("zin").onclick=()=>{z=Math.min(2,+(z+0.1).toFixed(2));applyT();};
document.getElementById("zout").onclick=()=>{z=Math.max(0.4,+(z-0.1).toFixed(2));applyT();};
document.getElementById("zfit").onclick=fit;
const vp=document.getElementById("viewport");let drag=null;
vp.addEventListener("mousedown",e=>{if(e.target.closest(".node,.artchip,.zoomctl,.drawer"))return;drag={x:e.clientX,y:e.clientY,ox,oy};vp.classList.add("grabbing");});
window.addEventListener("mousemove",e=>{if(!drag)return;ox=drag.ox+(e.clientX-drag.x);oy=drag.oy+(e.clientY-drag.y);applyT();});
window.addEventListener("mouseup",()=>{drag=null;vp.classList.remove("grabbing");});
vp.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();z=Math.min(2,Math.max(0.4,+(z-Math.sign(e.deltaY)*0.1).toFixed(2)));applyT();},{passive:false});
const contentEl=document.getElementById("content");
contentEl.addEventListener("mouseover",e=>{const n=e.target.closest(".node");if(!n||n.classList.contains("ghost")||n.dataset.nodeId===focus)return;focus=n.dataset.nodeId;drawEdges();});
contentEl.addEventListener("mouseout",e=>{const n=e.target.closest(".node");if(!n)return;const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest(".node"):null;if(to&&to.dataset.nodeId===focus)return;focus=null;drawEdges();});

render();renderMeta();requestAnimationFrame(fit);
new ResizeObserver(()=>drawEdges()).observe(document.getElementById("content"));
</script>
