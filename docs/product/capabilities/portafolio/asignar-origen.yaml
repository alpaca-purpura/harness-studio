# Asignar origen a un arnés huérfano (re-key por home declarado, sin clonar)

Lo que le faltaba al ítem 2 (Agregar) para que el ítem 5 (Reparar) tenga con qué reconciliar
(PENDIENTE-01 §4). Un arnés que se encontró en un proyecto ajeno casi nunca declara su
marketplace; sin origen, el ciclo de mejora continua no cierra.

**Un solo lugar donde se ejecuta, dos puertas para llegar** (AG-D8 decisión 7): la acción vive
in-situ sobre la fila del arnés en el plano Arneses (mismo patrón que «Identificar» del Slice 2);
el plano Marketplaces aporta un contador cruzado que lleva ahí ya filtrado.

**El mecanismo NO es el sello.** Es el hallazgo de diseño de este capability: el precedente
(`Identificar`) escribe `arnes.l0.json` in-situ, pero eso solo funciona para instalaciones cuyo dir
sea escribible y no protegido — y la instalación dominante real de esta máquina vive en el caché de
Claude Code, bajo `~/.claude`, que el propio guardrail del Portafolio prohíbe tocar. El `home`
declarado va al store, con su eslabón de procedencia diciendo que lo declaró el operador.

**Punteros a activar al construir:** ver el bloque comentado del frontmatter.
