# Registro de marketplaces conocidos (collect-all CC + declarado)

El **estante** del modelo de AG-D8: los marketplaces que ArnesIA conoce, con su clase
(`propio` = publicamos ahí · `referencia` = solo resuelve procedencia de un arnés ajeno).

Lo cardinal es que **no se inventa el registro**: Claude Code ya lleva el suyo en
`~/.claude/plugins/known_marketplaces.json`, y ese archivo es un **4º eslabón real** paralelo a
`installed_plugins.json` v2 que el Slice 0 ya consumía. El registro propio agrega solo lo que CC
no modela (la clase) y lo que CC no conoce todavía (lo que el operador declara).

`install_location` cierra un círculo que estaba abierto desde Slice 0: es exactamente la ruta
`home/plugins/<id>/<versión>/` contra la que `EvaluarDeriva` compara por hash.

**Punteros a activar al construir:** ver el bloque comentado del frontmatter. Código y capability
shippean en el MISMO commit (R1 + R2 + R3).
