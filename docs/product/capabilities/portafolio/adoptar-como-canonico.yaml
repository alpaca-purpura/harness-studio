# Adoptar como canónico — el camino a canónico de un plugin forjado local

Cierra la deuda E del dogfood developer-vitalia: el alta de un plugin nuevo no tenía camino
a canónico (círculo RN-IDENT-4 / wizard / B2). Adoptar copia el dir forjado al checkout del
marketplace-home declarado en su sello y sella la entrada; Publicar sigue el camino B2 de
siempre y el publisher agrega la fila nueva al marketplace.json.
