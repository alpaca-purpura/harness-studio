    merge_sha: null

scenarios:
  - id: sella-in-situ-y-rekey
    name: "Identificar sella y re-keya la entrada anónima"
    given: "una entrada persistida SIN manifiesto (identidad anónima por huella de path) cuyo installPath le pertenece"
    when: "POST /api/portafolio/arneses/{clave}/identificar con rol/proceso/empresas (id/nombre vacíos → defaults)"
    then: "se escribe arnes.l0.json in-situ (id sluggeado o basename, rol·proceso·empresas declarados, reporta_a null, SIN version — B-D2); el re-escaneo reconstruye la identidad sellada y la entrada migra a su clave nueva, desvinculando la vieja"
    verifica: "TestIdentificarSellaYRekey"
  - id: no-pisa-sello-existente
    name: "No se re-sella un dir que ya tiene arnes.l0.json"
    given: "un installPath que YA contiene arnes.l0.json"
    when: "se invoca Identificar"
    then: "ErrIdentificarYaSellado (409) — editar un sello ya escrito es otra operación, jamás se sobrescribe en silencio"
    verifica: "TestIdentificarNoPisaSelloExistente"
  - id: sello-incompleto-nada-se-escribe
    name: "Sin rol/proceso/≥1 empresa no se escribe nada"
    given: "una solicitud sin rol, sin proceso o sin empresa (ni en la solicitud ni heredable de la entrada)"
    when: "se invoca Identificar"
    then: "ErrIdentificarSelloIncompleto (400 honesto con motivo) y el disco queda intacto — los campos se PIDEN al operador, jamás se inventan (B-D1)"
    verifica: "TestIdentificarRechazaSelloIncompleto"
  - id: sello-valida-contra-schema-real
    name: "El sello escrito PASA graph.l0.schema.json"
    given: "el SchemaSet real de docs/architecture/contracts/schema cableado como 6° puerto"
    when: "Identificar arma el sello y lo valida envuelto como grafo ({arnes, nodos: []})"
    then: "el sello nuevo valida y se escribe; la forma vieja ({id,nombre,empresas,version} sin rol/proceso) es INVÁLIDA — el bug que B1 cierra; un rechazo del validador ⇒ ErrIdentificarSelloInvalido y nada se escribe"
    verifica: "TestIdentificarSelloValidaContraSchemaReal"
  - id: plugin-json-segun-forma
    name: "plugin.json mínimo según la forma de la instalación"
    given: "un target sellado sin .claude-plugin/plugin.json"
    when: "Identificar termina de escribir el sello"
    then: "fuera de proyecto-instalado se genera {name, version: 0.1.0, description} (SoT de la versión, B-D2); en proyecto-instalado NO (rompería el detector del loader) y la instalación queda con el aviso «sin plugin.json: no publicable en esta forma»"
    verifica: "TestIdentificarNoGeneraPluginJSONEnProyectoInstalado"
  - id: marketplace-puebla-home
    name: "Marketplace declarado ⇒ re-key con home"
    given: "una solicitud con marketplace poblado (home autor-declarado crudo)"
    when: "el re-key relee el sello escrito"
    then: "la entrada re-keyed sale con identidad.home canonicalizado — deja de ser provisional"
    verifica: "TestIdentificarConMarketplacePueblaHome"
business_rules:
  - "El sello se escribe IN-SITU en el dir del proyecto (S1-D27 decisión 2): sin clon, git del proyecto es la red de seguridad — cero duplicidad de información para el usuario."
  - "Guarda de path protegido (validarRootPortafolio): un sello jamás se escribe bajo ~/.claude, ~/.ssh, ~/.arnesia, etc."
  - "B-D1: rol/proceso/≥1 empresa se piden al operador — el schema graph.l0 NO se relaja; sin ellos, 400 honesto y disco intacto."
  - "B-D2: el sello NO lleva version — la SoT es plugin.json.version (conventions/versionado-arnes.md); Identificar genera el plugin.json mínimo solo donde no rompe el detector del loader."
