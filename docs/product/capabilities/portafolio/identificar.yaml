    summary: "T3 (S1-D28) — Identificar: escribe el sello arnes.l0.json IN-SITU (scaffold mínimo id·nombre·empresas·version) sobre una presencia sin manifiesto y re-keya la entrada por la misma tubería que AgregarProyecto. Guardas: entrada+installPath autoritativos, path no protegido, no pisa un sello existente. Sellar un dir sin identidad CREA la identidad — no viola la ley anti-drift."
