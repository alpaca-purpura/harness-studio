# Situación de una fila del catálogo (6 ramas, precedencia, acción por clase)

El **espejo** del modelo de AG-D8: dice si lo que el cliente tiene coincide con lo que
publicamos. Es lo que desbloquea los ítems 3-5 del outcome sin superficie nueva — y lo único de
esos tres que este paquete construye.

Dos cosas que hay que leer juntas:

1. **La precedencia es el orden de la tabla, no una preferencia estética.** `al-hilo` es la última
   fila a propósito: se llega ahí solo cuando ningún insumo falta y ninguna instalación tiene
   señal. Eso es «no sé» ≠ «sano» hecho estructura de control.
2. **El cruce de identidad tiene tres vías porque el dato real las necesita.** La instalación
   dominante en esta máquina (`harness@prenter-marketplace` en el caché de Claude Code) **no
   tiene `arnes.l0.json`**: su identidad es provisional. Un cruce estricto por `identidad.home`
   habría dado `no-lo-tengo` en la columna entera — un pass fabricado al revés. La vía
   `faceta-registry` lo resuelve **y se declara como cruce débil**, que es justo lo que la
   reconciliación (S7) existe para convertir en `home-declarado`.

**Punteros a activar al construir:** ver el bloque comentado del frontmatter.
