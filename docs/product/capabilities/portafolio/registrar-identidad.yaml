# Registrar identidad de arnés (home,id)

Clave del Portafolio (BR-1): `(home, id)` canonicalizado, con fallback a identidad
provisional `(⟂sin-home, id, scope)` cuando no hay marketplace resoluble (RN-IDENT-2).
