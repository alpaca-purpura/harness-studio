# Sincronizar el checkout de un marketplace propio al Refrescar

Cierra la deuda E-bis del dogfood developer-vitalia: «↻ Refrescar» no hacía fetch — el
`LectorLocal` releía el clone stale que administra CC y sincronizar era `git pull` manual.
El pull vive en un actor separado del lector (boundary intacto) y solo toca marketplaces
propios en refresco explícito.
