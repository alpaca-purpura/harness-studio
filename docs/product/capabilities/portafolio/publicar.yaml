    enforcement: ["docs/architecture/boundaries/marketplace-referencia-es-solo-procedencia.md"]
    severity: critical
  - id: sello-aditivo-jamas-en-semver
    rule: "El sello de extracción AAMMDDHHMM se estampa como campo ADITIVO `sello` en la fila de catalogo.json — nunca dentro del string semver (Claude Code compara versiones como strings)."
    enforcement: ["docs/architecture/conventions/versionado-arnes.md"]
    severity: high
  - id: indices-ajenos-intactos
    rule: "El read-modify-write de marketplace.json/catalogo.json usa `map[string]any` sobre el archivo real — jamás los structs lossy de parse.go: las claves de las filas ajenas y los `canales` quedan intactos (B-D6)."
    enforcement: ["docs/architecture/boundaries/marketplace-referencia-es-solo-procedencia.md"]
    severity: high
  - id: exclusion-coincide-con-el-hash
    rule: "La copia publicada excluye exactamente el set de `HashFormaPlugin` (.git/, .in_use, .orphaned_at): así la instalación del cliente hashea al-hilo contra su referencia; los symlinks no viajan y su omisión es un aviso visible."
    enforcement: ["docs/architecture/boundaries/portafolio-identidad-y-deriva-honesta.md"]
    severity: high
  - id: tag-tras-push-sin-rollback
    rule: "El tag `<id>/vX.Y.Z` se pushea DESPUÉS del branch; su fallo es éxito parcial con aviso «publicado sin tag: …», nunca un rollback (el branch ya viajó — deshacerlo fabricaría historia)."
    enforcement: ["docs/architecture/conventions/versionado-arnes.md"]
    severity: medium

