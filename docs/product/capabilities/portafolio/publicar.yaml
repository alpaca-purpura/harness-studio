# Publicar (write-side prenter-marketplace)

Cierra el ciclo que `↧ Traer canónico` abrió: traer materializa el arnés del estante para
mejorarlo; **Publicar devuelve la mejora al estante** — versionada, gateada y sin pisar a nadie.
Con esto el prenter-marketplace deja de editarse a mano: la fábrica escribe su propio índice.

La secuencia completa y sus innegociables (gate de conformance · idempotencia · push sin force)
viven en el frontmatter. Dos decisiones de diseño cargan el peso:

- **El workdir es `~/.arnesia/publicaciones/<slug>/`** — nunca `checkouts/` (B-D5): un clone del
  marketplace no es un canónico de arnés y mezclarlos rompería la clasificación RN-IDENT-4.
- **La versión no se pregunta**: es la del `plugin.json` del canónico (SoT,
  `conventions/versionado-arnes.md`). Bump interactivo quedó FUERA del MVP (B-D6) — subir la
  versión es editar el canónico (mejorar-conversando), no un diálogo del publish.
