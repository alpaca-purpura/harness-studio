      `marketplace.json` (source re-apuntado, filas ajenas intactas) y `catalogo.json`
      (fila nueva con `sello` AAMMDDHHMM ADITIVO, jamás dentro del semver; canales
      intactos) → commit → push SIN force (rechazo ⇒ 409 «reintentá») → tag `<id>/vX.Y.Z`
