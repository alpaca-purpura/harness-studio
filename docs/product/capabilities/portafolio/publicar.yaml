      guardas ANTES del mecanismo: canónico → home → clase `propio` (BR-1 lado write) →
      semver (SoT plugin.json.version) → gate `conf.RunGraph` VERDE — rojo ⇒ 409 con el
      reporte ADJUNTO (`{error, conformance}`). `AccionPublicar` pasa a habilitada SOLO en
      `mi-copia-adelantada`. FE: botón `▲ Publicar` vivo en el drawer (patrón exacto de
      Traer: spinner/error inline con los checks FAIL listados); la celda del catálogo
      pinta lo que el dominio manda, sin onClick propio (recorte B-D6). Auth calcada de
      traer (gh credential-helper / PAT por GIT_ASKPASS; el token jamás en argv) —
      duplicación documentada: go-arch-lint prohíbe publish→traer. `parcial` y no `vivo`:
      el gate humano 🧑‍⚖️ de PARIDAD sigue pendiente.
    merge_sha: null

