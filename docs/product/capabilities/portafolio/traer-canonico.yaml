    severity: critical
  - id: sha-es-la-autoridad
    rule: "El pin del camino externo es el `sha` declarado (presente en 220/220 formas objeto), no el `ref` (77/220 y puede apuntar a otro commit); si el contenido traído no lo iguala, se aborta."
    enforcement: ["docs/architecture/boundaries/portafolio-identidad-y-deriva-honesta.md"]
    severity: critical
  - id: exclusion-coincide-con-el-hash
    rule: "La copia excluye exactamente el set que `HashFormaPlugin` excluye (`.git/`, `.in_use`, `.orphaned_at`): excluir menos hace que el canónico herede el remote del marketplace; excluir más rompe la comparación de deriva."
    enforcement: ["docs/architecture/boundaries/portafolio-identidad-y-deriva-honesta.md"]
    severity: high
  - id: identidad-canonica-vs-path
    rule: "La identidad se registra con `Home = CanonicalizarRepo(repo)` (RN-IDENT-1) aunque el PATH use el nombre legible del marketplace: colapsarlos haría que el canónico recién traído no cruzara con la fila del catálogo de la que vino."
    enforcement: ["docs/architecture/boundaries/portafolio-identidad-y-deriva-honesta.md"]
    severity: critical
  - id: traer-referencia-prohibido
    rule: "Un marketplace de clase `referencia` no admite Traer, y el rechazo vive en el dominio: el botón deshabilitado es render, no control de acceso."
    enforcement: ["docs/architecture/boundaries/marketplace-referencia-es-solo-procedencia.md"]
    severity: critical

