    enforcement: ["docs/architecture/boundaries/portafolio-identidad-y-deriva-honesta.md"]
    severity: critical
  - id: no-se-pisa-el-canonico
    rule: "El canónico es la única copia editable: un destino con contenido aborta la operación sin tocarlo."
