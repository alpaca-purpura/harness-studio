      El diseño se hizo verificando contra GitHub EN VIVO y eso corrigió la letra del spec en tres
      puntos: (a) el pin de camino B es el **`sha`**, no el `ref` — en una entrada sana
      (`42Crunch-AI/claude-plugins`) el `ref v1.5.5` resuelve a `faf53053…` y el `sha` declarado es
      `30287f5e…`, **commits distintos**: clonar por `ref` y verificar `sha` abortaría siempre, y
      además `ref` está en 77/220 entradas contra `sha` en 220/220; (b) `source: "github"` trae DOS
      hashes válidos (`commit` y `sha`) sin semántica documentada ⇒ gana `sha` (el único universal) y
      la divergencia se muestra como aviso, no se silencia; (c) la identidad se registra con
      `Home = CanonicalizarRepo(repo)` (RN-IDENT-1) mientras el PATH usa el nombre legible del
      marketplace — colapsar los dos haría que el canónico recién traído **no cruzara con la fila del
      catálogo de la que vino**. Mecanismo probado en vivo: `git init` + `sparse-checkout --cone` +
      `fetch --depth 1 --filter=blob:none origin <sha>` + `checkout FETCH_HEAD` ⇒ `HEAD == sha` exacto,
      solo el subdir pedido, 664 KB. Atomicidad (BR-15): staging **bajo `~/.arnesia/`** (no `/tmp`:
      `os.Rename` cross-device falla con EXDEV) → un solo `os.Rename` → registro → deriva. El set de
      exclusión de la copia es EXACTAMENTE el de `HashFormaPlugin` (`.git/`, `.in_use`,
      `.orphaned_at`), que es lo que garantiza que BR-17 dé `al-hilo` y que el canónico no herede el
      remote del marketplace.
    merge_sha: null

