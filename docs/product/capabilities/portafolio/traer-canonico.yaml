# Traer canónico (materializar el arnés del estante: local o clone externo, atómico)

Superficie S8. Cierra el circuito del ciclo de vida: el plano dice **qué** hay en el estante y en
qué situación está; `Traer` es lo que permite **agarrarlo para mejorarlo**. Sin esto, el plano era
un espejo sin manos.

**No instala para usar: materializa para modificar.** La distinción es de visión
(`vision.md` §Ecosistema: ArnesIA es dueña única del observar y el modificar; las apps de rol solo
ejecutan). Lo que se materializa es el **canónico**, la única copia editable de una identidad.

Dos caminos, elegidos por la forma del `source` (AG-D13), no por una preferencia:

- **A · local** — `installLocation` en disco + `source` ruta relativa ⇒ copia de subcarpeta. Sin red,
  sin auth, sin `git`. **Es el caso de lo que vendemos** (`prenter-marketplace`).
- **B · externo** — `source` objeto ⇒ `git init` + `sparse-checkout --cone` + `fetch --depth 1
  --filter=blob:none origin <sha>` + `checkout FETCH_HEAD`, con verificación de que `HEAD` iguale el
  `sha` declarado. Probado en vivo: 664 KB para un plugin de un repo con 78.

Lo más fácil de implementar mal es la **atomicidad** (BR-15) y lo más fácil de implementar *de más*
es la **confianza**: BR-13 no se cumple «con cuidado», se cumple con una función pura que no puede
producir un escape y con un test que asserta bytes y rutas. Detalle completo en `design.md` §13.

**Punteros a activar al construir:** ver el bloque comentado del frontmatter.
