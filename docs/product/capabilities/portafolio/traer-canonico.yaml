    summary: >-
      Alta en el diseño (etapa 3, sin código todavía). AG-D17 FIRMADA 🧑‍⚖️: `Traer` entra COMPLETO,
      los dos caminos. La asimetría que lo separa de Publicar/Actualizar/Reparar (que siguen fuera de
