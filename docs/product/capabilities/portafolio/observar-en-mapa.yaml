# Observar en Mapa (presencia read-only del Portafolio)

Cierra GAP-1 (`decisiones.md` Slice 1): la única vía previa de indexar un arnés al Mapa,
`PUT /api/arneses/{id}`, registra cwd Y `checkProtected` rechaza todo path bajo
`~/.claude` — exactamente donde vive el cache CC (`referenciada-cc`, la forma de
instalación MÁS COMÚN real, S0-D1). `PortafolioService` gana un 5° puerto
`ports.IndexPort`; `ObservarEnMapa` valida clave+install_path contra el store persistido
y publica el grafo cargado al índice, sin tocar el registro de sesión. **GAP-2 cerrado
(2026-07-23):** el índice ya no indexa por `g.Arnes.ID` a secas — `Upsert` recibe la clave
calificada explícita, así que dos identidades del Portafolio con el mismo `id` pelado ya
no se pisan. El endpoint devuelve esa clave como `id` de vuelta al FE.
