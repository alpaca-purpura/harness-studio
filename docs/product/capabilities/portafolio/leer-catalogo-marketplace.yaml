# Leer el catálogo de un marketplace (local primero, remoto por gh, caché fechado)

Traduce el `marketplace.json` **ajeno** a tipos propios y lo deja utilizable sin red. Es la capa
anti-corrupción del paquete: el formato de Claude Code tiene 4 formas de `source`, 13 claves
opcionales por fila y dos lugares posibles para la descripción — nada de eso entra crudo al
dominio (ver `docs/architecture/boundaries/marketplace-referencia-es-solo-procedencia.md`).

**Mecanismo remoto = `gh api`, no clone shallow.** Un clone del catálogo oficial arrastraría un
árbol con cientos de directorios de plugin para leer 159 KB, y duplicaría lo que Claude Code ya
clona en `installLocation`. `gh api` son 1-2 requests, cero escrituras en disco, y —lo cardinal—
la credencial nunca la tiene ArnesIA: es el CLI del operador el que ya está autenticado
(auth-terms firmado; precedente en el árbol: `selfupdate/updater.go` y `publish/publisher.go` ya
hacen shell-out a `git`). El fallback PAT existe y su **selector de credencial es una función
pura**, testeable sin ningún login real.

**Punteros a activar al construir:** ver el bloque comentado del frontmatter.
