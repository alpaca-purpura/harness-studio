      relativa» valía para prenter y no para el 80 % del oficial (AG-D13); (c) `version` SÍ es
      campo estándar (259 `null` + 14 semver reales, y hay `$schema` oficial), de modo que BR-2
      pasa de derivación exclusiva a PRECEDENCIA con procedencia anotada: campo > último
      segmento semver de la ruta > ausente (AG-D14); (d) el catálogo oficial son 273 filas /
      159 KB, no 41 (AG-D16) — lo que hace del caché un requisito de O(1) por fila del plano, no
      un confort offline. Política: local primero (checkout que CC ya mantiene: cero red,
      offline), remoto por `gh api` como fallback (la app es CONDUCTOR: invoca el CLI ya
