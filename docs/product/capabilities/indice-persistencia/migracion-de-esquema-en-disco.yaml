# El archivo durable declara su esquema y sabe migrarse

Hasta este paquete, `~/.arnesia/sessions.json` era un array de sesiones y nada más. Cuando la forma
cambiaba, el archivo viejo y el nuevo eran indistinguibles salvo por lo que el código de turno
esperara encontrar — y un campo que se dejaba de leer se perdía sin que nadie se enterara.

Ahora el registro viaja en un **sobre**: `schema_version`, qué build lo escribió y cuándo. El
arranque mira el primer byte, decide qué versión es —`[` es la forma vieja, `{` es un sobre— y si
hace falta corre la cadena de migradores hasta la versión de hoy. **Un objeto sin `schema_version`
no se asume viejo: se rechaza**, porque asumir es exactamente lo que el sobre existe para eliminar.

**La copia previa no es opcional.** Antes de la primera escritura se respalda el original con el
sello del binario en el nombre. Y el archivo de la versión anterior **no se toca**: se escribe al
lado, así que volver a la versión anterior del daemon no necesita restaurar nada. Ese truco es el
bootstrap y sólo vale esta vez — de la v2 en adelante el sobre hace innecesario el archivo aparte.

**Dos decisiones que se ven en el código y conviene decir en voz alta:**

- **El migrador congela la forma vieja en su propia struct.** Decodificar con el tipo del dominio de
  hoy convertiría al migrador en un lector optimista: la próxima vez que el dominio cambie, leería
  el archivo viejo con la forma nueva y tiraría lo que ya no existe.
- **El migrador no lee el reloj: recibe el instante.** Es lo que lo hace determinista y testeable.
  Y la única fecha que inventa es la de creación, porque no existe en el archivo viejo. La de
  **última interacción sale vacía aunque la conversación tenga noventa turnos** — esa fecha nunca se
  guardó, y ponerle la de hoy sería decirle al operador que habló hoy con algo que abandonó en mayo.

El fixture del test es el registro **real** del operador, 17 202 bytes, copiado tal cual. La
comparación es campo por campo: contar sesiones no detecta un campo que el migrador olvidó llevar.
