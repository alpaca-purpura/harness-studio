# Persistencia (sesiones + arnés→path, JSON atómico)

El registro de sesiones y el mapa arnés→directorio viven en archivos JSON bajo `~/.arnesia/`. Es
deliberadamente trivial: el registro es chico y cambia poco, y el índice SQLite descartable es otra
cosa y otro archivo.

Lo que hace que sea confiable y no sólo simple: **la escritura es temporal + rename**, un swap
atómico en el mismo filesystem. Un corte de luz o un disco lleno a mitad del guardado dejan el
registro anterior entero. Hasta el paquete `2026-07-26-conversaciones-del-panel` eso era una
afirmación del comentario de cabecera y nada más: `internal/adapters/store` no tenía un solo test.
Ahora lo tiene, y el que prueba esto **fuerza el fallo de verdad** —un directorio sin permiso de
escritura— en vez de confiar en la lectura del código.

Lo que se escribe lleva su sobre versionado y lo que se lee entiende las dos formas: la nueva y la
que se escribía antes. El detalle vive en CAP-141.
