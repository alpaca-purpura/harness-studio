# Observar cambios del corpus (watcher)

Capability derivada del código real (barrido 7-subagentes, CAPABILITIES.md HS-18).

**Fase 5 (2026-07-24, RF-210):** el watcher dejó de ser un stub de 27 líneas cuyo channel jamás
emitía — ahora es `fsnotify` real, observando (recursivamente) el working-dir de cada entrada de
`ports.ArnesRegistry` conocida al arrancar `Watch(ctx)`. Un evento dispara reindex incremental de
SOLO el arnés dueño del path (reusa `usecase.NewTurnReindexer`), nunca un `Rebuild()` completo por
evento. `status` sube de `stub` a `parcial`, no `vivo`: queda un gap honesto — un arnés registrado
DESPUÉS de que el daemon ya arrancó no se suma al watch-set en caliente (documentado explícito en
`PARIDAD.md` del paquete, no silenciado).
