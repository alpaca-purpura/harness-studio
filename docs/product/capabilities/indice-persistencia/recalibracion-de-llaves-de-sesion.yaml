# Las sesiones con llave pelada se recalibran, y nada se borra

El registro guardaba el arnés de cada sesión como un id pelado (`vitalia`) en vez de su clave
calificada (`sin-home~vitalia~vitalia`). Consecuencia medida contra el daemon vivo: cuatro de las
cinco sesiones del operador tenían la llave vieja, y **tres quedaban invisibles** cuando la interfaz
preguntaba por la clave completa.

La recalibración vive **dentro** del paso que estrena el esquema versionado, no en una tarea aparte
que alguien tiene que acordarse de correr. Y va **después** del migrador de forma, en un paso propio:
cambiar la estructura de un archivo es determinista y se prueba con un fixture; recalibrar un valor
contra el Portafolio hace consultas y **puede no poder decidir**. Fusionarlos haría intestable la
parte determinista y ataría el arranque del daemon a que el Portafolio responda.

**Las dos vías, y por qué hay dos.** La fuerte es el directorio de trabajo: la entrada que realmente
vive ahí. Pero de las cuatro sesiones a recalibrar del operador, **tres nunca arrancaron su
conductor** y por lo tanto no tienen directorio. Sin el fallback por id se quedaban peladas para
siempre. Y cuando ninguna de las dos vías deja exactamente una candidata, **la llave no se toca**:
elegir una de dos fusionaría dos identidades por coincidencia, que es justo lo que la identidad
calificada existe para impedir.

**Se ve antes de que pase.** El comando es dry-run por default e imprime una fila por sesión —
incluidas las que no se mueven, con su motivo. Eso es lo que convierte «nada se borra» en algo
observable. Corrido contra el registro real del operador: 3 se mueven, 1 ya estaba calificada, y 1
sale `sin-candidata` porque su arnés no está en el Portafolio. **La arquitectura no puede prometer
que las cuatro se resuelvan** — depende de qué tenga el Portafolio. Lo que sí promete es que ninguna
se pierde, ninguna se fusiona, y que el resultado se ve antes de aplicarse.

**Deshacer no cuesta el día de trabajo.** Como el re-key toca un solo campo por sesión, revertirlo
puede reescribir sólo ese campo y dejar intactas las conversaciones, los turnos y las sesiones que
nacieron después. Sin eso, «reversible» sería un eufemismo de «restaurá el backup y perdé lo que
hiciste desde entonces».
