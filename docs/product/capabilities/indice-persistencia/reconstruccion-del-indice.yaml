# Reconstrucción del índice (ArnesRegistry)

Capability derivada del código real (barrido 7-subagentes, CAPABILITIES.md HS-18).

**Fase 5 (2026-07-24, RF-207/208):** `Rebuild()` dejó de ser un alias de `seed()` (dato demo
hardcodeado) — ahora reconstruye de verdad iterando `ports.ArnesRegistry.List()` →
`loader.LoadArnes(path)` → `Upsert`, dentro de una única transacción que primero vacía la tabla
(ningún dato demo/seed sobrevive a un `Rebuild()`). Un árbol roto se indexa `Degradado:true`, nunca
desaparece en silencio. `New()` además detecta un `schema_meta.version` que no coincide y borra el
`.db` entero antes de recrearlo (nunca migra una fila) — ver
`docs/architecture/boundaries/indice-desechable-jsonl-es-verdad.md` v1.3. `status` sube de `parcial`
a `vivo`: ya no hay gap entre lo que el nombre de la capability promete y lo que el código hace. La
entrada `~/.claude` de `valida:` (placeholder heredado, no un nombre de test Go) se retira.
