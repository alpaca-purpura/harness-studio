# Conversación legible: actividad visible · burbuja por paso · markdown

El turno del chat se ve como es: cada mensaje assistant cierra SU burbuja (CH-D3, frames
`message`), la actividad (thinking/tool_use — antes descartada en el conductor) aflora como
pasos `RolAct` que el dock agrupa en una tarjeta desplegable estilo Cursor (CH-D2, frames
`act`: viva muestra la herramienta en curso, cerrada resume «N pasos»), y el texto se
renderiza como markdown (CH-D4/D4b: GFM, chips de archivo clickeables que copian la ruta,
bloques de código con rótulo + copiar y sintaxis coloreada con los tokens vigentes).
Persistido en Conv → el historial rehidrata idéntico. Verificado E2E vivo contra vitalia.
