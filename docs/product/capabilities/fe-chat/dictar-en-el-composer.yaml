# Dictar en el composer

El operador habla en vez de escribir. El botón de micrófono entra en el composer **como un botón
más**, a la izquierda del enviar — sin barra nueva, sin modo aparte, sin tocar el layout de la fila.
Todo lo vigente (textarea con auto-grow, botón ↑, botón ■ de interrupción, los tres placeholders)
queda idéntico.

Dibujo: [`mockups/arnesia-voz-dictado.html`](../../../../mockups/arnesia-voz-dictado.html).

## Lo que la superficie tiene que dejar ver

**Las etapas tienen nombre.** «Escuchando…» → «Transcribiendo…» → «Ordenando lo dictado…». No hay
spinner anónimo, porque el peor modo de falla que encontró el spike fue una promesa que nunca
resuelve, y un spinner sin nombre es exactamente lo que la haría invisible. La limpieza vale 13-17 s
contra 2.2 s del STT: se gana su propio escalón visible en vez de esconderse en «procesando».

**El nivel de entrada se mueve.** Un micrófono mudo se ve igual que uno vivo si lo único que hay es
un punto rojo. El medidor es la señal de que realmente está entrando audio.

**El crudo se distingue del limpio.** Borde `warn` + motivo escrito. Y el escape a crudo está
disponible **en vivo** durante la limpieza («usar el crudo»): a los 15 s el operador ya sabe si
quiere seguir esperando.

**Cuatro motivos distintos de no-disponible**, cada uno con su texto: permiso denegado · sin
dispositivo · sin motor de STT en `$PATH` (con qué instalar) · formato no soportado. Se arreglan de
maneras distintas, así que decir lo mismo en los cuatro casos sería inútil.
