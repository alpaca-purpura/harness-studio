# Chat CC (turno/interrupt)

Capability derivada del código real (barrido 7-subagentes, CAPABILITIES.md HS-18).

## Baseline de la superficie (T2, paquete 2026-07-26-conversaciones-del-panel)

`chat-dock.stories.tsx` es el **baseline** del widget: se escribió **antes** del primer cambio
del paquete, que reescribe el widget entero. Sin él, «el superset no rompió nada» sería una
afirmación sin evidencia (H-1). Sus tres stories originales sobreviven **ajustadas al
superset**: ya no miden las cuatro filas de cromo —el tramo 3 las bajó a dos— sino lo que no se
podía tocar: el composer con sus tres marcadores, las burbujas, la tarjeta de actividad
agrupada y la tarjeta de permiso.

**El hallazgo del baseline, cerrado en el mismo paquete:** `SessionLine` pintaba el
`◍ <cc-id>` con `text-primary` sobre `bg-secondary` — **2,21:1** medido por axe, contra el
mínimo 4,5 de texto. Era una violación **preexistente** del dock que se enviaba, invisible
porque el widget no tenía story. Al mudarse el cuerpo de esa fila a `IdentidadDetalle`
(RF-328), el texto pasó a `--foreground` y las tres stories **dejaron de apagar la regla
`color-contrast`**: el gate a11y corre entero sobre todo el dock.

## El cromo de dos filas (tramo 3)

`ChatDock` compone hoy: header (intacto, salvo el glifo `»`), `ConversacionRow`, `ScopeRow`
**sólo con nodo**, y el transcript o la lista de conversaciones — nunca los dos. Las piezas
nuevas viven en `arnesia.fe-chat.panel-de-conversaciones` (CAP-146); acá queda el turno, el
interrupt y la composición.
