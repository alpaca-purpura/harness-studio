# Panel de conversaciones

El operador pidió dos cosas —ver el historial de una conversación y crear una nueva— y no
encontró ninguna de las dos en el panel de conversación. Estaban escondidas en el picker del
rail, colgadas del **arnés** en vez de la **sesión**, y ahí mostraban 0 por un defecto de llave.
Esta capability es la superficie que las trae adonde el operador las buscó.

## Lo que se ve

El cromo del dock **baja de cuatro filas a dos**. La fila nueva lleva `▶ título · ✎ · chip de
contexto · 🔍 · ＋`. La `SessionLine` que ocupaba una fila fija **se muda** al detalle del chip:
sus cuatro datos siguen ahí —y ganan el directorio de trabajo, que hasta acá no se veía en
ninguna superficie— pero dejan de costar una fila permanente. La fila de alcance **deja de
existir cuando no hay nodo elegido**: su estado vacío gastaba una fila entera en una
instrucción.

La lista se abre **en sitio**, sobre el área del transcript, con el mismo gesto que el picker
del rail: cero diálogo, cero fondo oscurecido, cero portal. El header y el composer siguen
visibles — nunca se pierde de vista en qué sesión se está.

## Lo que se corrigió de paso, y se declara

El chip de contexto **caliente** pinta la barra en el color de aviso y **el número no**: ese
color como texto mide 3,76:1 sobre el fondo del dock, bajo el mínimo de 4,5. Mismo criterio en
el rótulo `activa` de la fila, en el glifo `＋` y en el motivo de un error de lectura.

Y cierra una violación **preexistente**: la `SessionLine` pintaba el `◍ <cc-id>` en el color de
acento sobre el fondo secundario — **2,21:1** medido por axe. Era invisible porque el widget no
tenía story hasta el baseline de este paquete. Al mudarse al detalle, el texto pasó al color de
primer plano y **ninguna story del dock apaga ya ninguna regla del gate**.
