# Superficie HTTP de telemetría

Las ocho rutas que la pantalla consume, con un contrato que atraviesa todas: **«no se pudo medir» y
«midió cero» viajan distinto**. Los montos son opcionales y las ausencias viajan explícitas — una
caja sin dato llega con su motivo, no se omite, porque omitirla obligaría a la pantalla a inventar
por qué falta y ponerle cero diría que corrió gratis.

Un rango con formato equivocado **se rechaza en vez de ignorarse**: ignorarlo devolvería un período
distinto del pedido, y el usuario leería cifras de otro rango creyendo que son del suyo.

El receptor del protocolo entra **inyectado como manejador**, igual que el canal de eventos: este
paquete no conoce el formato y no tiene por qué.
