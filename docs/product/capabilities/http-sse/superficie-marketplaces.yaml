# Superficie REST de marketplaces (7 endpoints, 400 ≠ 503 ≠ 409, `entradas: null`)

La superficie observable del plano Marketplaces. Lo único que hay que memorizar de este capability
son las **tres distinciones que parecen detalles de transporte y son reglas de honestidad**:

| distinción | qué evita |
|---|---|
| `entradas: null` vs `[]` | que «no pude leer» se lea como «este marketplace no tiene arneses» |
| 400 vs 503 en validar | que un problema nuestro (sin `gh`) se le facture al operador como url inválida |
| 200 degradado vs 5xx en catálogo | que el FE, sin nada que renderizar, termine pintando una lista vacía |

El contrato completo (shapes JSON, tabla de status por endpoint) vive en
`docs/product/stories/2026-07-23-portafolio-agregar-marketplace/design.md §7` y se refleja en
`docs/architecture/contracts/api/openapi.yaml` (bump a `0.7.0-marketplaces`), donde
`entradas` se documenta `nullable: true` **con su razón** — sin esa nota, el próximo implementador
«prolijo» lo normaliza a `[]` y rompe BR-4 sin darse cuenta.

**Punteros a activar al construir:** ver el bloque comentado del frontmatter.
