# Diagnóstico de fallos del FE

La app instalada corre en un WebView **sin devtools**: su `console.error` no va a ningún lado. El
daemon es el único proceso de la app que escribe a disco, así que es el único que puede dejar
rastro de un fallo del navegador.

## El incidente que lo trajo

`MediaRecorder` de WebKitGTK 2.52.3 dice soportar `audio/mp4`, arranca, y entrega **0 bytes sin
emitir `error`**. Vivió así toda la v0.2.20. Lo único que quedaba del incidente era la frase que el
operador leyó en pantalla («No se grabó nada»); reconstruirlo costó levantar un WebView aparte con
`GST_DEBUG` para leer el log de GStreamer que la app se tragaba.

Con este endpoint, el mismo fallo llega al log con las variables que lo explican —bloques, muestras,
pico, hz, mime, bytes— y se arregla leyendo un archivo.

## Lo que NO es

No es telemetría de producto. No sale de la máquina, no mide uso, no tiene backend. Es el log de la
casa: loopback → archivo local del usuario.
