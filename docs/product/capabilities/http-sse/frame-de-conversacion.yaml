# El panel de conversaciones se entera en vivo

El dock arma su copia del diálogo a partir de los avisos que llegan por el stream. Todo lo que no
llega por ahí, sencillamente no existe para el operador hasta que recarga la aplicación.

La rotación de contexto vivía exactamente en ese punto ciego: se guardaba en disco, encadenaba el
id del proceso anterior, escribía su checkpoint y dejaba su marca en el diálogo… y no avisaba a
nadie. No era un olvido: la rotación corre con el candado del servicio tomado, y en este servicio
**nada se publica bajo el candado**. El lugar donde la función vive no podía publicar.

La corrección respeta la regla en vez de romperla: la rotación **devuelve** su aviso y quien la
llamó lo publica al soltar el candado, junto con el aviso de estado del turno — y en ese orden,
porque la marca se guardó antes del mensaje del operador y tiene que verse antes.

**La repetición no se resuelve con un identificador de corrida**, y vale explicar por qué no: este
aviso no pertenece a ningún turno. Los de creación, retoma y renombrado traen el estado final del
hilo, así que aplicarlos dos veces da el mismo resultado. El de rotación trae la posición exacta
que la marca ocupa en el diálogo, y sólo se aplica si esa posición está libre — una reconexión que
lo repita llega cuando ya está ocupada y se descarta sola.
