# Superficie HTTP del dictado

Dos rutas, montadas sobre los mismos gates de auth que el resto de la superficie local
(`confinamiento-de-superficie-local`):

- **`POST /api/sesiones/{id}/dictado`** — recibe el audio grabado y devuelve el texto para el
  composer. La respuesta **siempre dice si el texto está `limpio` o `crudo`**: pasar un crudo por
  limpio sería exactamente el pass fabricado que la doctrina de la casa prohíbe.
- **`GET /api/dictado/disponibilidad`** — sonda que el FE consulta al montar el composer. Devuelve
  `disponible: false` **con motivo legible** cuando no hay motor de STT en `$PATH`, para que el botón
  se deshabilite con la razón a la vista en vez de aceptar un dictado que después no se va a poder
  transcribir.

El cuerpo va **acotado antes de leerse**. La cota funcional la fija RF-218 (3 min de grabación); la
de transporte existe aparte porque el endpoint no puede confiar en que el cliente respetó la primera.
