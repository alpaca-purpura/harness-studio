# Dictado: transcribir y ordenar con contexto de dominio

El hallazgo central del spike: **lo que desenreda un dictado no es más transcripción, es contexto de
dominio compacto** — y ese contexto además **corrige los errores del STT**. Corrida la cadena completa
con los errores reales del motor (`lógica`→"locita", `daemon`→"demon", `la app sola`→"la absola"), la
limpieza con contexto los corrigió todos. Por eso el modelo chico alcanza: subir de tamaño compra
gramática, no vocabulario de dominio.

**Dos pasos, dos costos muy distintos** (medido, §1.8, sobre 47 s de voz española real):

| paso | costo | quién lo hace |
|---|---|---|
| transcribir | **2.2 s** con `base` | `TranscriptionPort` → adaptador local |
| ordenar | **13-17 s** | spawn headless endurecido de `claude` |

La limpieza es el **87 %** del gasto. Optimizar el STT sería pelear por el 13 %.

## El motor vive detrás de un puerto

V-D1 se firmó como **A2 local, modelo `base`**, pero la sub-decisión `whisper.cpp` vs
`faster-whisper` se resolvió como **adaptador por PATH**: se detecta qué motor hay instalado y se usa
el primero que aparezca. Elegir el binario hoy habría sido decidir sobre evidencia que no existe — se
midió `faster-whisper` sobre WAV con voz sintética, no `whisper.cpp` y no el `audio/mp4` real de la
app. La deuda **T7** (qué se empaqueta en los instaladores) queda registrada con su criterio de
cierre, no perdida.

Consecuencia: el **transcodificado** `audio/mp4` → WAV 16 kHz mono es responsabilidad del adaptador,
porque depende de qué motor se encontró. `ffmpeg` ausente es un motivo de degradación visible, no un
panic.

## El cerrojo

El dictado es **entrada no confiable**. La limpieza es texto→texto y se spawnea como tal: 1 turno,
todas las herramientas denegadas, `--setting-sources project,local`. Los flags SON la superficie de
enforcement, así que van cableados a un test de fitness — un enforcement sin test es una promesa.
