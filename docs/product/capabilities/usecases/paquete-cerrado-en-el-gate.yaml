# Paquete cerrado: el gate deniega el árbol propio de arnesia

Los arneses de arnesia (kit embebido materializado en `~/.arnesia`) son paquete CERRADO: el
composition root registra ese árbol (`ProtegerPaqueteCerrado(injector.BaseDir())`) y el gate de
permisos (`onControlRequest`) deniega en el acto cualquier `control_request` cuyo input lo
mencione — sin tarjeta al operador, por encima de grants vigentes y del click humano. El FE solo
ve el rastro `permission_result` deny. Los tools read-only nunca pasan por el gate (van
pre-aprobados), así que LEER el kit sigue posible; escribirlo, jamás. Origen: incidente
2026-07-22 (el chat confundió arneses del operador con los propios).
