# Buscar por lo que se dijo, no por cómo se llama

Una conversación de trabajo son noventa turnos de los que el operador recuerda una frase, no un
título. Buscar sólo por el nombre servía para encontrar lo que ya se sabía dónde estaba.

**Dónde corre, y por qué ahí.** En el daemon. La lista del panel no manda los turnos por el cable
—son doce kilobytes por conversación, y cien conversaciones son más de un megabyte— así que
mandarlos únicamente para que el navegador filtre sería pagar el costo que la lista existe para no
pagar. El daemon ya los tiene cargados: un barrido lineal sobre lo que ya está en memoria.

**Sin índice de texto, y esta vez el motivo se re-funda.** La decisión original decía «sin tocar el
índice» cuando el índice era un archivo suelto; hoy es una base de datos real. La decisión no
cambia, pero el argumento sí: no es que el índice no exista, es que el volumen no lo justifica.
Doce kilobytes por cien conversaciones es un barrido de milisegundos, y un índice de texto sobre el
contenido de las conversaciones del operador sería, además, exactamente el tipo de ingesta que el
repo acota a propósito.

**El plegado de acentos es runa a runa, y no es un atajo.** El pedazo que se devuelve se recorta del
texto **original**: si la normalización cambiara la cantidad de caracteres, las posiciones dejarían
de corresponderse y el recorte saldría movido. Un plegado uno a uno preserva las posiciones. La
alternativa —la descomposición canónica de Unicode— no está en la biblioteca estándar y traerla
sumaría tablas al binario del daemon por un caso que no ocurre: el texto que llega del conductor y
del operador viene precompuesto. Lo que **no** cubre queda dicho en el código, para que nadie lo
descubra a los golpes: un texto ya descompuesto, con la marca de acento suelta, no se pliega.

**El pedazo viaja en texto plano.** El resaltado del término lo hace la interfaz. Que el daemon
mandara marcado sería que el daemon manda algo que el navegador interpreta, y eso no se hace ni
para una palabra.
