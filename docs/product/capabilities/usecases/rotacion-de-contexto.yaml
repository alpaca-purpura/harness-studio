# Rotación de contexto invisible (conversación infinita)

`ctxPct` real por turno (usage del último API call, no el acumulado) se historiza; al cruzar el
umbral (default 40 %, flag `-rotacion-umbral`) la sesión queda `rotacion-pendiente` y el PRÓXIMO
turno arranca un proceso `claude` fresco: checkpoint mecánico (últimos turnos, espíritu Franja
Artefactos) inyectado por el system-prompt por sesión, `ClaudeSessionID` viejo encadenado en
`CadenaCC`, breadcrumb `RolSys` en el `Conv`. `Session.ID` no cambia; el usuario ve UNA
conversación continua.
