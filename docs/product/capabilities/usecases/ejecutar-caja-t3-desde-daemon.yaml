    summary: >-
      Async: `RunBox` (síncrono, bloqueaba la respuesta HTTP hasta el desenlace) se
      reemplaza por `StartRun` (valida síncrono — 404/422/409 siguen inmediatos — y
      devuelve run_id de un `202`) + `runAsync` (goroutine, el loop lento) + `GetRun`
      (poll del desenlace). Bug real cazado y cerrado en el mismo cierre: `awaitResult`
      descartaba `EventControlRequest` en silencio — cualquier rol con permiso de
      escritura habría colgado el subproceso para siempre (nadie respondía el
      control_request; `--permission-prompt-tool stdio` rutea TODO write tool ahí sin
      excepción). Fix: auto-resuelve contra el `PermissionSet` del rol (Allow→allow,
      Deny/Ask→deny — sin humano en el loop, T3 es autónomo por diseño). Gate post-run
      (CAP-70/71, mismo patrón que el chat corre conformance tras un turno con
      escrituras): si el run auto-permitió ≥1 escritura, corre `ConformancePort.RunGraph`
      y adjunta el veredicto a `RunResult.Conformance`. Nuevo endpoint `GET
      /api/harnesses/{id}/boxes/{boxId}/runs/{runId}`. Tests: `TestConductorAutoResuelveControlRequest`
      (3 casos) + `TestRunAsync*` (3), race-clean.
