# Crear, retomar y renombrar conversaciones de una sesión

El operador pidió dos cosas que el producto no tenía: ver el historial de una conversación y abrir
una nueva sin perder la que estaba. Esta capability es la mitad de servidor de las dos.

**Por qué crear y retomar comparten un cuerpo.** Son la misma transición: dejar de tener conductor
en un hilo y pasar a tenerlo en otro. Escribirlas por separado sería tener dos copias de la misma
invariante, y una de las dos se iba a quedar atrás — el defecto clásico de las reglas duplicadas.
El cuerpo compartido (`transicionLocked`) corre ocho pasos en un orden que no se improvisa: guard →
foto de rollback → operación pura del dominio → denegar los permisos pendientes → resetear el
estado del turno → mover el puntero del conductor → persistir → armar los eventos.

**Lo que se hace fuera del candado, y por qué.** El servicio tiene una regla vieja y sin
excepciones: bajo el candado sólo hay mutación pura y persistencia; todo lo que hace entrada/salida
—cerrar el proceso anterior, publicar los eventos— ocurre después de soltarlo. Por eso
`transicionLocked` no publica: **devuelve** lo que hay que publicar. Y el proceso anterior se cierra
**después** de que el disco confirmó, así que un fallo de persistencia nunca deja al operador sin
conductor.

**El contador de turnos no baja a la conversación.** Es deliberado y cuesta explicarlo, así que
queda escrito: el identificador de cada corrida se genera con un contador monótono **por sesión**.
Uno por conversación reiniciaría al retomar un hilo viejo y produciría un identificador que la
interfaz ya tiene marcado como terminado — con el resultado de que descartaría eventos legítimos.

**Lo que deliberadamente no se agregó:** ni un mapa por conversación en el estado del turno (hay una
sola activa, así que no hay dos hilos en vuelo que separar), ni un canal nuevo para el evento del
panel (viaja por el mismo stream que todo lo demás), ni una búsqueda global por id de conversación
(una conversación cuelga de su sesión; buscarla fuera sería inventar una relación que no existe).
