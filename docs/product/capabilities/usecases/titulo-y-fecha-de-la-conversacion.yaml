# El título y la fecha de la conversación

Las dos mitades de lo que la fila de la lista tenía que mostrar, y las dos estaban **firmadas y
sin construir**. La auditoría del paquete las encontró juntas y con razón: por separado son dos
campos; juntos son la lista entera.

## Qué pasaba

`DerivarTitulo` existía en el dominio, con sus tests verdes, y **no la llamaba nadie en
producción**. `UltimaInteraccion` se declaraba, se proyectaba al DTO y se leía para desempatar,
pero su única asignación de producción era la que la deja **vacía** (la migración, que hace bien
en no inventar fechas). El resultado en pantalla: después de media jornada el operador abría el
panel y veía N filas idénticas, todas `nueva conversación`, todas `sin fecha`. La función que la
lista existe para cumplir —«¿cuál era aquella conversación?»— no se podía cumplir.

## Por qué se escapó a tres capas verdes

Los tests de dominio prueban la **ley** (quién gana cuando el operador y la derivación escriben
el mismo campo), no el **cableado**. Las stories del panel **hardcodean** títulos y fechas
plausibles. Y el E2E midió una **migración** —donde «sin fecha» es la verdad— en vez de una
conversación nacida en la app. Tres verificaciones verdes sobre una función que nadie llamaba.

Por eso los tests de esta capability corren contra el `SessionService` **real**, el mismo camino
que usa el daemon, y se verificó por mutación que cada uno se pone **rojo** cuando se quita la
línea que prueba: la llamada a la derivación, la guarda del primer mensaje, el estampado en el
turno del usuario y el estampado al cerrar el del assistant.

## El efecto de borde que se corrigió de paso

`TestRotacionNoCreaConversacionNueva` tomaba su línea base del título **antes** del primer turno,
así que en realidad afirmaba «el título no cambia nunca» — verdad sólo mientras RF-303 estuviera
sin construir. Ahora toma la línea base inmediatamente **antes de rotar**, que es su sujeto real,
y se verificó por mutación que sigue cazando una rotación que pise el título.
