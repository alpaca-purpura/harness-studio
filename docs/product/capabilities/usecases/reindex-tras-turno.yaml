# Reindex del Mapa tras cada turno del chat

Después de cada `EventResult` del conductor, el usecase re-corre el loader sobre el cwd real de
la sesión y upsertea el grafo al índice del Mapa — con degradación honesta (sin sello → síntesis
HuellaPath; árbol roto → grafo vacío Degradado), jamás la foto vieja. Vive en el usecase, no en
el conductor (boundary adaptadores-de-agente-intercambiables).
