# Historial de conversaciones archivadas

`Close()` archiva la **sesión entera con sus conversaciones completas** en
`~/.arnesia/sesiones-archivadas.json`: por cada conversación, su cadena de `ClaudeSessionID`s, su
transcript y su checkpoint; por la sesión, su arnés, su `cwd` y la fecha de archivado.

**Esto era al revés hasta el paquete `2026-07-26-conversaciones-del-panel`**, y el cambio es de LEY,
no de implementación. Antes se archivaba metadata y se tiraba el contenido, con el argumento de que
«la JSONL nativa es la verdad». Sigue siéndolo **del contenido**, y nadie la escribe ni la mueve
(boundary `conductor-no-parsea-jsonl`). Pero `Conv` es **nuestra copia de presentación** — capturada
del stream a nuestro propio registro, que es lo que el mismo boundary manda en su L1 — y es:

- lo único que **sobrevive a un GC del corpus** de Claude Code, que no controlamos;
- lo único sobre lo que se puede **buscar** (CV-D8: el buscador del panel busca el texto que el
  operador vio, no la JSONL cruda);
- lo que se **repinta al retomar** una conversación, antes de que el stream vivo se reenganche.

Tirarlo era perder lo que el operador vio para conservar un puntero a un archivo ajeno.

Lo mismo vale para el **checkpoint**, y esa mitad no la cubría ninguna decisión previa (enmienda
F-3): retomar una conversación que ya había rotado sin su digest de rotación la deja arrancando
exactamente en el estado que el digest existe para no perder.

El lector `history.Reader` se conserva como **fallback** para las sesiones archivadas antes de la
migración, cuyo transcript no se guardó: camina `~/.claude/projects/<dir-del-cwd>/` y cose la cadena;
las JSONL ausentes viajan en `faltantes`, y jamás se inventa contenido.
