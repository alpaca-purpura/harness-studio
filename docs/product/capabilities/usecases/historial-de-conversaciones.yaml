# Historial de conversaciones por arnés (B2)

`Close()` archiva la metadata liviana (cadena de `ClaudeSessionID`s, cwd, fechas, cantidad de
turnos — sin `Conv`: la JSONL nativa es la verdad) en `~/.arnesia/sesiones-cerradas.json`. El
lector `history.Reader` camina `~/.claude/projects/<dir-del-cwd>/` y reconstruye los turnos de
una cerrada cosiendo su cadena (rotación ⇒ N JSONLs); las JSONL ausentes viajan en `faltantes`.
Endpoints: `GET /api/sessions?arnes=&cerradas=1` + `GET /api/sessions/cerradas/{id}/historial`.
FE: sección «Conversaciones» del picker (vivas + cerradas, con expand del transcript).
