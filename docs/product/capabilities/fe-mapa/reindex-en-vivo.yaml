# Mapa en vivo: refetch al reindexarse el arnés por chat

El daemon publica `event: map` (canal SSE ya reservado) tras el reindex de cada turno; el FE
bumpea la revisión del arnés en `useMapLive` y la vista Mapa que lo está mirando refetchea su
grafo sin recargar la página ni resetear la selección.
