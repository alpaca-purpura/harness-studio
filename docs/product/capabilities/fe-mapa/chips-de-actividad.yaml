# Chips de actividad (N0) — panorama multi-actividad del Mapa

La lente de agrupación nueva del esquema v3 (DEF-D1/D2: actividades = pipelines internos):
un chip por tipo de paquete de trabajo declarado, con salud agregada honesta y el grupo
`sin-actividad` siempre visible. El-todo-primero (MA-L1): la fila agrega, jamás filtra;
sin tipos declarados no existe (MA-L5).
