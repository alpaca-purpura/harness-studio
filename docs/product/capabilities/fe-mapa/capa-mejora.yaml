# Capa «Mejora» del Mapa

La capa que responde *«este arnés, en este puesto, quema $X — y el 60 % se va en la caja Y, que
falla el gate 3 de cada 4 veces»* (D12.2). **T29 construye su vocabulario visual**: las cuatro
piezas que el Mapa, el inspector y el Portafolio comparten, en `entities/telemetria/ui/` y con
stories de su contrato completo, para que la próxima superficie las reuse en vez de
reinventarlas (D23).

Las tres reglas que gobiernan cada pieza y que sus stories asertan:

1. **`null` ≠ `0`.** Una ausencia se dice con su motivo; un cero es un dato medido.
2. **Cada cifra viaja con su confianza**, y los cuatro casos se distinguen por texto.
3. **Ningún estado depende solo del color** (RF-280): el color es refuerzo, el texto es el canal.
