change_log:
  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: new
    summary: >-
      T29 — nace la entidad `telemetria` con el VOCABULARIO VISUAL de la plataforma (D23): un
      formateador de dinero (`CifraUsd`, RF-281 — el único), una marca de confianza
      (`MarcaConfianza`, RF-242 — cuatro casos, `exacta` no renderiza nada porque la ausencia de
      marca ES la señal), una barra de cobertura (`BarraCobertura`, RF-237 — una categoría en
      cero no se dibuja ni se nombra) y un sparkline (`Sparkline`, RF-266 — con menos de dos
      puntos lo DICE, no dibuja una línea plana). Viven en `entities/telemetria/ui/` y no dentro
      de `widgets/map-canvas` justamente por D23: son vocabulario de la plataforma y el
      Portafolio consume las MISMAS piezas. `model/selectors.ts` es la ÚNICA fuente del copy de
      confianza (candado 2 de D18) y del formato de dinero. Fixtures en dos bloques rotulados
      MEDIDO/ILUSTRATIVO (plan-storybook §3). 18 stories con `play()` + 22 tests de tabla
      (proyecto `unit`), gate a11y en `error`. Wire: las 8 rutas de `/api/telemetria/*` en
      `shared/api/client.ts`, genéricas y domain-free.
      **Desviación declarada:** la hoja se crea en T29 y no en T33 como decía el plan — R2
      cazaría 7 archivos huérfanos en este commit y R1 cazaría un puntero colgante si se creara
      con `punto-mejora-card.tsx#PuntoMejoraCard` antes de que ese símbolo exista. La regla 1
      del plan (§0) obliga a crearla con el ÚLTIMO símbolo de cada tanda, así que la hoja crece
      ticket a ticket.
    merge_sha: null

  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: extend
    summary: >-
      T30 — el slot del conmutador se enciende: `Capa` pasa de `"tokens"` a `"mejora"` (rename de
      literal de unión, lo agarra `tsc` — cero consumidores huérfanos) y `LayerDef` gana
      `motivo?`. El `title` fijo «Necesita telemetría (indexer JSONL)» SALE: ya no es verdad para
      ninguno de los dos slots apagados — la señal de duración por request y por herramienta
      llega hoy (V1), lo que falta es el diseño. Un motivo que miente manda a construir lo que ya
      está construido. Los motivos nuevos viven en `layers.ts` (dato, no literal en el JSX) y
      viajan a `title` **y** a un `<span class="sr-only">` referenciado por `aria-describedby`
      (RF-276): el `sr-only` va FUERA del `tablist` para no contaminar el nombre accesible de la
      tab ni romper `aria-required-children`. 4 stories nuevas; la firmada `Default` no se toca.
      🔴 Desviación declarada de un baseline firmado (mockups/INDEX.md regla 3 · D17.1).
    merge_sha: null

  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: extend
    summary: >-
      T31 — las marcas dentro del nodo y el total del carril. `ArnesNode` gana SIETE props
      PRIMITIVAS (`cifraUsd` · `participacionPct` · `confianza` · `etiquetaConfianza` ·
      `tituloConfianza` · `marcaFuga` · `marcaFugaGrave` · `motivoSinDato`): **cero import de
      `entities/telemetria`** (D18), el widget compone `CifraCaja → props`. Las tres marcas van
      al FINAL DEL FLUJO, ninguna en `position:absolute` — la esquina superior derecha ya está
      ocupada dos veces y un tercer badge se superpondría con «propuesto» (J-9) — y son `<span>`
      porque el nodo ES un `<button>` y anidar un botón en un botón es DOM inválido.
      Nodos sin dato: opacidad + borde punteado **y la línea de motivo**, porque la opacidad sola
      no alcanza (RF-280) — son CINCO motivos, no seis: D19 borró el de «conocimiento» (en este
      árbol es una BANDA y un token, no una clase; `Clase` no tiene `knowledge`).
      `lane-hd` pasa a tres hijos y el `.count` SE CONSERVA (J-8); un carril sin cajas con dato
      dice `sin dato`, nunca `USD 0,00`.
      D21: la marca de fuga grave va `--crit` sobre `--card` (4,75:1 claro / 5,33:1 oscuro), no
      sobre `--crit-soft` (4,04:1 en claro, falla). Como este archivo hereda `a11y: "todo"` y ahí
      axe no corre, la story lleva un assert COMPUTADO del `backgroundColor`.
      **Desviación declarada:** las props son `cifraUsd`/`totalUsd`, no `cifraUSD`/`totalUSD`
      como fijaba D18 — `biome useNamingConvention` con `strictCase` rechaza dos mayúsculas
      consecutivas también en camelCase. 13 + 2 stories nuevas; las 12 + 2 firmadas no se tocan.
    merge_sha: null

  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: extend
    summary: >-
      T32 — `FranjaMejora`: ningún número aparece sin su ventana, su denominador, su disclaimer y
      su cobertura, y **nunca hay un tablero en cero**. El orden de izquierda a derecha ES el
      orden de lectura del dato (el disclaimer va PEGADO al total: al pie se leería después de
      haber creído el número). Los siete estados honestos + los dos de transporte:
      1 «nunca corrió» ≠ 1b «no corrió en estos 7 días» (H-9, dos acciones distintas) ·
      2 cobertura parcial · 3 s2-degradado ≠ 3b s2-instrumentado (J-10, rótulos que la story
      asserta DISTINTOS) · 4 otro runtime (el número SÍ se muestra, rotulado como calculado) ·
      5 catálogo viejo (avisado en la superficie, no en un `title`) · 7 «qué guardamos».
      `Cargando` deja el `select` usable; `Error` NO hace desaparecer la franja (desaparecer se
      leería como «no hay capa»); `DaemonCaido` conserva las cifras previas marcadas como
      posiblemente viejas. Espaciado por token, no los `10px 14px` del mockup.
      **Dos fixes de contraste, uno medido al construir:** el disclaimer va `--foreground` sobre
      `--warn-soft` (D21) y el enlace «qué guardamos» **no puede usar `--primary` como color de
      texto** — axe midió 2,41:1 sobre el fondo de la franja. La afordancia la carga el
      subrayado. 22 stories (20 del plan + `ReenvioApagadoNoSeDibuja`, que separa el assert
      espejo que una sola story no puede hacer, + `CoberturaCompletaEnLaFranja`), gate a11y en
      `error`, con `ReposoDark` obligatoria: `preview.ts` renderiza en claro por default.
    merge_sha: null

  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: extend
    summary: >-
      T33 — el corazón del entregable. `PuntoMejoraCard`: una tarjeta = una caja × un detector,
      con la anatomía en orden ESTRICTO porque **el orden es el argumento** (qué pasa → cuánto →
      cuánto se ahorra → por qué lo creemos → contra qué → qué hacer). Las cinco cosas de A4 son
      obligatorias; `Umbral` NO se pinta cuando el detector no se decide por uno (P1 usa
      `Patrón`) y la fila `Sesgo` **nunca se omite** — si no se identificó ninguno, lo dice.
      «ver el cálculo» es un despliegue EN LÍNEA con `aria-expanded`/`aria-controls`, no un modal
      (H-4). La severidad es TEXTO (`atención`/`crítico`), el ⚠ es `aria-hidden` y el borde de
      color es refuerzo (RF-257 · RF-280). 🔴 `Proponerlo en el chat` **no escribe archivos**: no
      existe ninguna prop de escritura y la story lo asserta por ausencia (D17.3 · BR-M12).
      `PuntosMejoraList` resuelve H-1 (la lista vive debajo del canvas, ordenada por ahorro
      descendente; no puede ser un botón dentro del nodo porque el nodo YA es un `<button>`) y
      H-2 (el vacío honesto lista los seis detectores que corrieron: «no encontramos nada» y «no
      buscamos» son conclusiones opuestas). **Una tarjeta sin contrafactual no existe** (A4): la
      lista la filtra, no la pinta degradada. 15 + 7 stories, gate a11y en `error`, con
      `CompletaB1AtencionDark` obligatoria (D21 ítem 3).
    merge_sha: null

  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: extend
    summary: >-
      T34 — `InspectorMejora` + la cuarta tab. El número se puede AUDITAR: bucket por bucket
      (con la suma cerrando contra el total, assert aritmético), contra el catálogo, contra el
      proceso y contra los detectores que no corrieron. Orden de secciones de lo auditable a lo
      accionable. Las tres tabs vigentes no se tocan; la cuarta reusa `<Section>` y hereda el
      mismo contrato ARIA (`hidden` en los paneles inactivos, no `display:none`).
      **«No aplica» ocupa las dos columnas numéricas con `colspan=2`**, no un guion en cada celda
      —que se leería como cero— y **`0` es un dato válido** cuando el runtime tiene el concepto:
      las dos filas se distinguen por ESTRUCTURA, no solo por texto. La paridad muestra los dos
      números y NO elige; el veredicto es texto. Detector `off` = `--border`, nunca `--ok`: «no
      sé» ≠ «sano». Los 7 de fuera del MVP dicen `no medido todavía`, jamás `sin hallazgos`.
      El ancho es el REAL del drawer (340 px), no los 380 del mockup.
      🔴 **Única modificación permitida a una story firmada en este paquete**: `Tabs`
      (`inspector.stories.tsx`) pasa de `toHaveLength(3)` a `4` en este mismo commit. Declarada
      en `PARIDAD.md`.
      Fixture nuevo `BUCKETS_ILUSTRATIVOS`: la FORMA sale del bloque MEDIDO (el 0 real de
      `ephemeral_5m`, la ausencia real de `razonamiento`) y los montos suman exactamente los
      1,92 del copy. Los dos fixtures no se pueden fundir — a dos decimales, los 18 473 micros
      reales no suman nada, y bajar la precisión del formateador para que el assert cierre sería
      arreglar el termómetro.
    merge_sha: null

  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: extend
    summary: >-
      T35 — `PoliticaDatosDialog`, detrás del enlace «qué guardamos» de la franja (H-5). Existe
      para que la promesa «nada de tu cuenta, nada de la conversación» sea **contrastable**, no
      una frase: **la lista de campos viene POR PROP** (`camposPersistidos`), es la misma
      allowlist que aplica la ingesta (`ANEXO-hooks.md` H4, importada del bloque MEDIDO), y el
      DOM refleja exactamente ese array. Si la UI la inventara, la promesa dejaría de ser
      verificable — que es el único valor que tiene un diálogo de privacidad. H-14: el copy dice
      qué pasa con lo que SÍ llega por el canal de hooks y que se descarta antes de escribirse.
      El `{N}` de retención sale de la config y va rotulado como PROPUESTO (J-6): hardcodear el
      90 lo convertiría en decisión por omisión. El botón destructivo nace `disabled` hasta que
      el operador confirma el alcance, y **mientras borra el diálogo no se puede cerrar**
      (S1-D19): cerrarlo dejaría una operación en vuelo sin dónde reportar su resultado.
      Focus trap con `trapTabKeyDown`, sin portal (el contenido vive inline para que la story lo
      vea, patrón sancionado en `shared/lib/focus-trap.ts`). 8 stories, gate a11y en `error`.
    merge_sha: null

  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: extend
    summary: >-
      T37 — transporte y composición. `workspace-stage.tsx` es el dueño del estado de la capa y
      de la ventana, y **el único que hace transporte** (`fe-transporte-independiente`): los
      widgets reciben props puras. Las tres consultas corren SOLO con la capa encendida — con
      `estructura` activa no se le pide nada al daemon, que es lo que hace que la capa apagada no
      cueste nada. `corridas === 0` se pasa como `null`, no como un tablero en cero (RF-269).
      `map-canvas.tsx` gana `capa`, `mejora`, `totalesPorFase` y `motivosSinDato`, y es acá donde
      vive la composición `CifraCaja → props primitivas` (D18) — es el único widget que puede
      importar las DOS entities. **Cero rama de layout**: la geografía es la misma en las cuatro
      capas, y `CapaMejoraSupersetGeografia` lo asserta repitiendo los 6 asserts de `Dogfood` más
      el conteo de nodos, carriles y edges. La ventana viaja como `desde`/`hasta` RFC3339, que es
      lo que `ventanaDeQuery` lee.
      🔒 **`CopyConfianzaEsUnaSola` es el candado de D18**: el chip del nodo (que recibe el copy
      por prop) y `<MarcaConfianza>` tienen que decir exactamente lo mismo, texto y `title`. Si
      alguien edita un literal y no el otro, CI se rompe. Vive acá porque es el único lugar que
      puede importar las dos entities.
      §6.2 — **no se agrega ningún contenedor con `overflow` dentro del canvas**: uno solo
      rompería `useEdgePaths`, que mide posiciones absolutas. Con la capa activa los nodos son
      ~26 px más altos y `fitView` elige un zoom menor: es el overview-first ya firmado (RF-50).
    merge_sha: null

  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: fix
    summary: >-
      **D24 — defecto de COMPOSICIÓN cazado en la app instalada, contra datos reales del
      operador** (`evidencia/instalada-v0222-capa-mejora.png`). Sobre `vitalia`, que nunca corrió:
      la franja decía «Este arnés nunca corrió con telemetría» y la lista, doce centímetros más
      abajo, decía «Hay datos y ningún punto de mejora que pase el corte. Los seis detectores
      corrieron sobre 0 corridas». Dos afirmaciones falsas que contradecían al bloque de arriba —
      correr sobre cero corridas no es correr, que es la formulación que RF-263 prohíbe.
      **131 stories verdes no lo vieron**: cada una renderiza un componente aislado y la mentira
      no estaba en ninguno, estaba en la composición.
      Corregido: `hayDatos` pasa a prop OBLIGATORIA de `PuntosMejoraList` (un default que asume
      datos miente cuando no los hay) y sin medición atribuible la sección **no se dibuja** —
      que es lo que `design.md` §7.4 ya decía. La condición vive en `model/capa-mejora.ts` y la
      usan la página **y** las stories: duplicarla en el composition-root es cómo nació el
      defecto. ⚠️ **No** se usa `confianza === "sin-dato"`: la confianza del agregado es
      `PeorConfianza`, así que una sola corrida sin atribuir habría escondido la lista en el
      estado 2, que sí tiene datos — el mismo defecto mudado de vecino.
      Barrido del mismo patrón: el vacío ya no afirma que corrieron los seis cuando alguno no
      pudo (s2-degradado); el ✓ del Portafolio sale de `puntos_de_mejora === 0` como DATO y no de
      la ausencia de `punto`; la sección «Detectores» vacía lo dice; y el umbral del estado 2
      deja de ser un `corridas <= 5` escondido para ser `coberturaEsParcial()`, declarado y
      testeado por los dos bordes.
      **El candado**: `capa-mejora-coherencia.stories.tsx`, los dos bloques en la misma story
      desde un solo `resumen` (patrón de `CopyConfianzaEsUnaSola`). Verificado como test:
      revirtiendo el fix las 3 stories de ausencia se ponen rojas y reproducen el texto del
      screenshot palabra por palabra, y el control positivo queda verde.
    merge_sha: null

scenarios:
  - id: mejora-cifra-un-solo-formateador
    name: "El dinero se formatea en un solo lugar, y 0,004 no se redondea a 0,00 (RF-281)"
    given: "un monto en micros de dólar, presente o ausente"
    when: "se renderiza <CifraUsd>"
    then: >-
      coma decimal, dos decimales y separador de millar de espacio fino (jamás el formato EN);
      un monto menor al centavo sube decimales en vez de renderizarse en cero; sin monto se
      dice «sin dato», nunca «0,00» ni «—» a secas
    verifica: "Estandar · SeparadorDosDecimales · MenorAlCentavo · Ausente (cifra-usd.stories.tsx) · usd (selectors.test.ts)"
  - id: mejora-confianza-cuatro-casos-por-texto
    name: "Los cuatro casos de atribución se distinguen por TEXTO, no por tono (RF-242 · RF-280)"
    given: "atribucion_confianza en exacta | por-hash | por-proceso | sin-dato"
    when: "se renderiza <MarcaConfianza>"
    then: >-
      `exacta` no emite DOM (la ausencia de marca ES la señal); los otros tres llevan etiqueta y
      `title` PROPIOS y distintos entre sí; **ninguno** se pinta como «atribución aproximada»,
      que taparía tres cosas distintas bajo una
    verifica: "Exacta · PorHash · PorProceso · SinDato · LosCuatroJuntos (marca-confianza.stories.tsx) · copy de confianza (selectors.test.ts)"
  - id: mejora-cobertura-no-nombra-el-cero
    name: "Una categoría de cobertura en cero no se dibuja ni se nombra (RF-237 · RF-279)"
    given: "una Cobertura con 0 en alguna de sus cuatro categorías"
    when: "se renderiza <BarraCobertura>"
