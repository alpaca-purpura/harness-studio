# Foco de actividad (N1) — secuencia del procedimiento, atenuación y radio de impacto

El drill-down por actividad del Mapa multi-actividad (spec §3): reusa la maquinaria de
atenuación vigente cambiando solo el origen del set, dibuja el procedimiento como secuencia
sólida `--primary` numerada en la capa de edges (estilo nuevo sin colisión con los dash) y
hace visibles los degradados E5/E13 y el radio de impacto de las cajas compartidas (MA-L4).
