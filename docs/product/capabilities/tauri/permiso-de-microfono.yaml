# El shell concede el permiso de micrófono del WebView

`wry 0.55.1` implementa `permission-request` en macOS y Android, **no en el backend `webkitgtk`**.
El síntoma no es un rechazo: `getUserMedia` **queda pendiente para siempre**, así que la UI se
quedaría "escuchando" sin micrófono y sin error — el peor modo de falla que encontró el spike
(`spike-spec.md` §1.6 b/d).

El shell engancha la señal `permission-request` del `WebView` de WebKitGTK vía `with_webview` y
concede **solo** las `WebKitUserMediaPermissionRequest` que piden audio. Cualquier otra request
sigue su curso por defecto.

**Esta capability va PRIMERO** (V-D6, firmada): sin ella, todo el resto del dictado funciona en
`pnpm dev` — donde el navegador concede por su cuenta — y muere mudo en la app instalada.

Si una versión futura de `wry` maneja `permission-request` en `webkitgtk`, esta capability se
retira; re-chequear con `webkit_captura_test.py` del paquete.
