# Deep-link arnesia:// enfoca la app instalada

Registro OS del scheme `arnesia://` (`tauri-plugin-deep-link`, `plugins.deep-link.desktop.schemes`
en `tauri.conf.json` — deb/rpm/AppImage lo registran solos vía el `.desktop` generado; `tauri dev`
en Linux necesita `register_all()` en runtime, ya cableado en `setup()`). Al recibir un link, si la
app ya está corriendo, el callback de `tauri-plugin-single-instance` reenfoca la ventana `main`
(mismo mecanismo que CAP-79); si no está corriendo, el lanzamiento normal abre la ventana. No hay
ruteo a una página específica del FE — decisión de alcance 2026-07-23 (no existe router que enganchar).
