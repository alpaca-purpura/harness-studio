# Publicar al marketplace (`publish`)

Fachada CLI de [`arnesia.portafolio.publicar`](../portafolio/publicar.yaml) (CAP-148, B2 del
paquete `2026-07-30-volverlo-de-arnesia-y-publicar`): `arnesia publish <clave>` publica el
canónico de una entrada del Portafolio en su marketplace-home por el mismo usecase que el
endpoint HTTP — guardas, gate de conformance e idempotencia incluidos.
