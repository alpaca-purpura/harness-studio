# Log del daemon

`~/.arnesia/logs/arnesia.log` — JSON por línea, rota a los 8 MB conservando `arnesia.log.1`.
Se apaga con `arnesia serve --log -`, se muda con `--log <ruta>` o `$ARNESIA_LOG`.

## Por qué no existía y por qué ahora sí

El daemon logueaba a stderr. En desarrollo eso alcanza —hay una terminal—; en la app instalada el
sidecar lo lanza el `.desktop` del `.deb` y **ese stderr no lo lee nadie**. La consecuencia se midió
sola: un bug del dictado vivió una versión entera y lo único que quedó del incidente fue la frase
que el operador leyó en pantalla.

Con el archivo, el daemon deja además la línea de cada dictado —formato, bytes, milisegundos,
estado, motor— así que la próxima vez el número está antes de que alguien pregunte.
