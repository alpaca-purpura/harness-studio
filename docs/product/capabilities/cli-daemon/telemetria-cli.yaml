# CLI de telemetría

Todo lo que el módulo mide se puede ver **sin abrir la aplicación**: el total con su cobertura, el
desglose por caja, los puntos de mejora con los que no aplican y los que todavía no medimos, el
estado del módulo y la procedencia del catálogo de precios.

**Reusa el mismo caso de uso que la API, con cero lógica propia.** Dos implementaciones de la misma
consulta divergen el día que alguien arregla una sola.

Existe por dos razones, y las dos importan: mientras el diseño de la pantalla espera su firma, esto
es lo que demuestra que el backend entrega valor de verdad; y después sigue siendo la vía por la que
se verifica el módulo de punta a punta contra una instalación real.
