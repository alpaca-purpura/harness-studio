# La prosa del punto de mejora

Un punto de mejora es cinco cosas: un número, su contrafactual, su umbral citado, su sesgo
declarado en contra y **un** arreglo. Cuatro de las cinco ya se escribían donde se calculan. La
quinta —el contrafactual— viajaba como dos enteros en micros, y la pantalla los tipaba como una
frase que nadie producía.

**La frase se escribe donde viven los números.** Necesita el monto alternativo, la diferencia, su
unidad y el denominador de corridas: los cuatro salen del mismo cálculo que produjo el punto.
Armarla en la pantalla sería calcular en la UI, y sería armarla en un lugar donde el umbral y el
sesgo que la sostienen ya no están.

De eso sale una consecuencia que no es cosmética: **cuando el mundo alternativo no sale más
barato, no hay frase**. Y sin frase no hay tarjeta — porque una tarjeta que dice «esto está mal» y
no propone nada es un reproche, no una recomendación. El detector no desaparece por eso: viaja
declarado, con su motivo y con cuántos hallazgos tuvo. «No lo mostramos» y «no hay nada» son
cosas distintas y se leen distinto.

El dinero, además, se escribe de **una** manera. La frase la arma el dominio y la cifra suelta la
pinta la pantalla, así que hay dos formateadores; lo que no puede haber son dos formatos. Los ata
una sola tabla de casos, en el árbol, que los dos lados asertan.
