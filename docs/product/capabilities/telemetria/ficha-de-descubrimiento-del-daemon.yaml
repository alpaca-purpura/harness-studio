# Ficha de descubrimiento del daemon

Un hook que viaja dentro de un arnés no conoce nuestras convenciones ni sabe en qué puerto quedó el
daemon. La ficha se lo dice, y vive en la ruta que **el sistema operativo** reserva para eso —no en
nuestro directorio propio— precisamente porque el que la lee es un proceso ajeno, en cualquiera de
las tres plataformas.

**Se publica después de que el daemon acepta conexiones, nunca antes.** Una ficha que nombra un
puerto donde no escucha nadie es una mentira que el hook paga en esperas, y el hook tiene un cuarto
de segundo de presupuesto total. El test no se conforma con que el archivo exista: comprueba que el
endpoint que nombra **responde**.

**Se relee en cada invocación.** El daemon puede haberse reiniciado en otro puerto entre dos turnos;
una ficha cacheada apuntaría al viejo para siempre.

Y una ficha huérfana —daemon muerto sin cerrar— **no se detecta mirando el proceso**: el hook
simplemente falla dentro de su presupuesto y sale sin hacer nada. Es más simple y más robusto que
comprobar si el proceso vive, que además daría un falso positivo si el identificador se reusó.
