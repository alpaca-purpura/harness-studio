# Forward externo filtrado

La salida hacia un destino externo **existe y va apagada**. Sin una decisión explícita del operador
—flag o variable de entorno del daemon— no se abre ni una conexión saliente. Ni la API ni un arnés
pueden alcanzarla: el destino se fija al arrancar y no hay forma de cambiarlo en caliente.

**Lo que sale es la medición ya filtrada, nunca el cuerpo crudo.** Reenviar crudo exportaría el
correo y los identificadores de cuenta de quien corra el arnés, que llegan en cada punto del
original. Y mientras esté encendida, la pantalla lo dice: un egreso silencioso es exactamente lo que
este módulo existe para no hacer.
