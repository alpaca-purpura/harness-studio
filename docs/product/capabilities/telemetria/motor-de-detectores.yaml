# Motor de detectores

El contrato: **primero se pregunta si el detector puede correr, después se lo corre.** Un detector
que no puede correr no devuelve cero — devuelve por qué no puede, y eso llega hasta la pantalla.

La pregunta se contesta con el **dato real de la ventana**, no con una configuración ni con el
escenario. Es lo que hace que el día que aparezca la señal que a un detector le faltaba, se encienda
solo, sin que nadie toque código.

Y el «no aplica» **viaja hasta la pantalla**, con su motivo, en su propia lista. Junto a otra lista
con los detectores que todavía no medimos. Omitir cualquiera de las dos obligaría a la pantalla a
elegir entre no mostrar nada —un hueco escondido— o mostrar cero, que es una mentira.
