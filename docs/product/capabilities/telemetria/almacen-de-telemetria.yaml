# Almacén de telemetría

**Base propia, no una tabla más del índice.** El índice del Mapa es desechable por doctrina: cuando
cambia de forma se borra entero y se reconstruye del árbol de arneses. La telemetría no se puede
reconstruir de ningún lado — si se pierde, se perdió. Compartir archivo significaría que un cambio
de forma del índice borra la historia.

**El esquema crece sumando.** Y cuando una ruptura no se puede expresar sumando, el archivo viejo
**se archiva**: queda en disco renombrado, la base nueva arranca vacía, y el reporte de salud dice
cuál es el archivo. Cuesta un renombre y conserva la posibilidad de recuperar la historia a mano.
Lo mismo con una base corrupta: se archiva, no se borra.

**Dos relojes.** El del daemon manda para ventanas y agregados; el del emisor se guarda al lado y,
si es absurdo, la fila queda marcada. Así, una ventana rara se puede explicar después en vez de
adivinar.

**La instrumentación nunca degrada lo instrumentado.** La cola es acotada; el exceso se descarta y
se cuenta. Un almacén roto pierde telemetría, no la sesión del usuario.
