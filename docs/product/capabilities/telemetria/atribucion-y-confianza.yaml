# Atribución y confianza

Cada número dice **cómo** se supo a quién pertenece, y se resuelve en orden: primero las etiquetas
que inyectamos nosotros al lanzar el proceso; si no están, la huella del paquete instalado —que se
**aprende** observando nuestras propias instalaciones, no se adivina—; si tampoco, el lugar donde
corrió; y si nada resolvió, se dice que no se pudo.

**Lo que no se pudo atribuir se guarda y no suma.** Aparece en la cobertura y en el detalle. Sumarlo
al gasto de un arnés sería atribuir por adivinanza, que es exactamente lo que la confianza existe
para impedir.

**El nivel de instrumentación se deriva de la señal.** No hay campo donde un arnés pueda declararlo:
se calcula de lo que llegó. Un arnés no puede decir que está mejor medido de lo que está.
