# Costeo de doble fuente

Se guardan **los dos** costos: el que reportó el runtime y el que calcula nuestro catálogo. Si
divergen, la prueba de paridad está corriendo en producción y gratis; y si uno falta, el otro sigue
estando, en vez de quedarse sin ninguno.

La forma del resultado tiene una regla que parece un detalle y no lo es: un bucket con tokens y sin
tarifa **no se cobra a cero**. Sale nombrado y el total se marca parcial. Cobrar a cero lo que no se
sabe cotizar es la manera más barata de mentir sobre dinero.

**Estado `stub` a propósito:** hoy existen los tipos y no la función de cálculo. Sin check, no hay
`valida:` — un estado `vivo` acá sería fabricado.
