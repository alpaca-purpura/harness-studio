# Token de ingesta acotado

Escribir mediciones y dirigir un agente con acceso a los archivos **no son el mismo permiso**, así
que no comparten llave. El segundo permiso abre exactamente tres puntos de entrada y ninguno más:
filtrarlo concede «podés mandarme mediciones basura» —que la atribución y el límite de tasa ya
acotan— y nada más.

**El canal del runtime va sin permiso, y es una decisión, no un descuido.** Se midió: el runtime no
interpola valores dentro de su bloque de configuración, así que el permiso no puede llegarle por
indirección; y ponerlo literal metería un secreto vivo en un archivo que se versiona, se publica con
el paquete y no se puede rotar. Cambiar «un proceso local puede mandarme ruido contable» por «el
secreto de esta máquina viaja en un release» es un mal negocio.

**Lo que queda en pie:** la barrera de host local, el tope de cuerpo y el límite de tasa. Y el ruido
que alguien pudiera inyectar **no contamina ningún número**: entra sin atribución, no suma a ningún
total y aparece contado. La inyección sería visible, no silenciosa.

Para el operador que prefiera lo contrario hay una escotilla — con su consecuencia dicha en voz
alta: el arnés que corre fuera deja de reportar.
