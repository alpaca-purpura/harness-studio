# Los seis detectores del MVP

Ninguno dice *«gastaste X»*. Cada uno dice **qué habría costado el mismo trabajo con un cambio
concreto**, cita el umbral que usó —que es álgebra, no un número salido de esta corrida—, **declara
su sesgo empujando contra su propia recomendación** y propone **un solo** arreglo.

El sesgo en contra no es escrúpulo: si el sesgo empujara a favor, la recomendación se estaría
auto-justificando, y no habría forma de distinguir un hallazgo real de un artefacto del método.

Y los que todavía no existen **se declaran**. Ocho detectores más figuran como «no medidos todavía»
en cada respuesta. Callarlos obligaría a la pantalla a elegir entre no mostrar nada —un hueco
escondido— o mostrar cero, que es una mentira.
