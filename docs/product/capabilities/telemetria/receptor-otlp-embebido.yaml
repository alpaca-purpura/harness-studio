# Receptor OTLP embebido

El daemon recibe la telemetría **en el puerto que ya tiene**. Nada externo que instalar, ningún
contenedor que operar, un solo diálogo de firewall, un solo confinamiento y un solo apagado.

**Nunca hace esperar a quien emite.** La cola es acotada; cuando se llena, descarta, **lo cuenta** y
se lo dice al emisor en la propia respuesta. Un receptor que bloquea degrada el trabajo que está
midiendo — y un error de servidor haría reintentar al emisor, multiplicando el daño en vez de
contenerlo.

**Nunca finge haber guardado.** Un formato que no entendemos se rechaza nombrando la causa **y el
ajuste que lo arregla**. Responder éxito sin guardar es la forma más limpia de perder telemetría sin
que nadie se entere nunca.
