# Catálogo de precios embebido

El binario sabe cuánto cuesta un modelo **sin pedirle nada a internet**, y **dice con qué catálogo lo
supo**: fecha, revisión de origen y huella del archivo. Un precio sin procedencia no se puede
auditar el día que alguien discute la cifra.

Tres cosas que no son detalles:

- **Un modelo desconocido no vale cero.** Vale «no sé». Una tarifa en ceros cotizaría todo gratis y
  el número saldría bonito.
- **Los tramos de precio no se aplanan.** La herramienta más popular del rubro colapsa los tramos de
  escritura de cache y pierde justo el dato que permite detectar el desperdicio por vencimiento —
  acá viaja entero.
- **El refresco va apagado.** Es tráfico saliente del daemon, y eso lo decide el operador. Si se
  enciende y falla, no pasa nada: se sigue con el embebido y la pantalla dice desde cuándo no se
  refresca.
