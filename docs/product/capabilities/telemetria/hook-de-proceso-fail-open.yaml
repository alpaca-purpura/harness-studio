# Hook de proceso que nunca rompe un turno

El hook que viaja dentro de un arnés **es el propio binario de ArnesIA**. No hay intérprete que
asumir —no se puede contar con Python en Windows, ni con Node— ni runtime nuevo que shipear, ni un
segundo lugar donde la lista de campos permitidos se pueda olvidar de uno: es **el mismo código** que
el daemon usa y prueba.

**Termina bien siempre.** Sin excepciones, en todas sus ramas. Un hook que termina mal al empezar un
turno bloquea el turno del usuario, y la instrumentación no puede degradar el trabajo que mide. La
salida estándar queda vacía por la misma razón: lo que un hook imprime se le inyecta al agente.

**Proyecta antes de mirar si hay a quién mandarle.** El contenido de la conversación no existe en
memoria más allá de esa línea.

Y cuando no puede reportar —no hay daemon, la ficha quedó colgada, el destino responde error— **no
reintenta, no escribe a disco y no avisa**. Silencioso hacia el usuario, no invisible: el hueco
aparece después en la cobertura. Nunca como un cero.
