# Conciliación de cobertura

Lo que llegó dice cuánto **medimos**, no cuánto **hubo**. La diferencia es el punto de esta
capability: el daemon anota cada turno que ocurrió —lo sepa medir o no— y después compara. Así, un
agujero de red deja de ser un cero que parece un dato y pasa a ser *«dos de siete turnos no
reportaron telemetría»*: visible y explicable.

Y donde no hay forma independiente de contar los turnos —porque el proceso no fue nuestro— el
denominador **viaja vacío** y la pantalla lo dice. Poner un cero ahí sería afirmar que no hubo
turnos, que es otra cosa.

**El join es la igualdad de dos identificadores.** Las dos mitades del mismo turno pueden llegar con
horas de diferencia y por canales distintos; correlacionarlas por tiempo daría uniones falsas.
