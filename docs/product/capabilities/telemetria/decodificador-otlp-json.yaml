# Decodificador OTLP/JSON

El daemon entiende el formato de telemetría **con la biblioteca estándar**: medio megabyte de
binario, contra los once que costaría la biblioteca del ecosistema para el mismo subconjunto. Está
medido, no estimado.

**Dos desviaciones del runtime real, encontradas midiendo y no leyendo documentación:**

1. Los enteros de los atributos llegan como número JSON, cuando la especificación manda texto. Un
   decodificador escrito según la spec revienta con el payload real; uno escrito según el payload
   real reventaría con un runtime que cumple. Este acepta los dos.
2. Los **conteos de tokens llegan como decimales**, no como enteros. Convertirlos a ciegas a entero
   perdería el costo, que sí es decimal de verdad.

Y tres reglas de honestidad: lo que no conocemos se descarta sin error (así una versión nueva del
runtime no tumba el receptor), un lote malo se rechaza **entero** (nunca a medias), y un valor que no
se puede leer **no vale cero** — vale «sin dato».
