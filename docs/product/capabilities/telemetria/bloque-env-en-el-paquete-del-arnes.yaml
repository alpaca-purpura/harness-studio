# El arnés lleva su propia instrumentación

Un arnés se puede correr de dos maneras: lanzado por ArnesIA, o a mano sobre su propio árbol. La
primera está medida desde siempre —ArnesIA arma el entorno del subproceso—. La segunda no lo
estaba, y es la que ocurre cada vez que alguien trabaja *en* el arnés.

Ahora el arnés **viaja con su instrumentación adentro**. Es un archivo del paquete, nuestro, que
no toca nada de nadie.

La alternativa era escribir ese archivo en el proyecto del usuario, lo que daría cobertura
completa. **No se hace.** Escribir en el árbol de un tercero se pide —con el cambio a la vista,
con copia de resguardo y con un botón que lo deshaga—, y hasta que alguien lo pida, la cobertura
parcial y declarada es preferible a la escritura silenciosa. Lo que queda afuera no se disimula:
sin el bloque, se ve el proceso y **se dice por qué no se ve el dinero**.

Dos cosas que se midieron y cerraron el diseño, en vez de razonarse:

- **Un plugin no puede aportar el bloque.** Se armó uno que lo declaraba completo, se instaló y
  no llegó nada; el control positivo de la misma corrida sí llegó. No existe la
  auto-instrumentación al instalar, y por eso hay que elegir dónde vive el archivo.
- **La indirección no funciona.** El runtime no expande variables dentro de ese bloque, así que
  meter una credencial ahí solo se podría con el valor literal — un secreto versionado. La
  salida es que el receptor no pida credencial: solo escucha a la máquina local.

Y los dos caminos salen de **una sola lista de variables**. Si se separan, uno de los dos manda
una señal que el receptor no entiende y no hay ningún error: simplemente no llega nada. Eso ya se
midió una vez; el candado existe para que no vuelva a pasar por descuido.
