# Retención y borrado

La telemetría **caduca sola** y el usuario puede borrar la de un arnés cuando quiera.

Lo que hace a este capability y no a un `DELETE`: **el borrado alcanza al agregado**. Borrar solo el
detalle dejaría una cifra en el tablero alimentándose de filas que ya no existen — y esa cifra
sobreviviría justo a la operación que el usuario pidió para hacerla desaparecer. Por eso el detalle,
el agregado y los turnos declarados se van en la misma transacción, y las horas afectadas se rehacen
después.

⚠️ **El plazo por default no está firmado.** El operador todavía no fijó el número, así que viaja
por configuración y **rotulado como propuesto** en el estado del módulo. La pantalla lo lee; nunca
lo escribe. Presentarlo como política sería fabricar una decisión que nadie tomó.
