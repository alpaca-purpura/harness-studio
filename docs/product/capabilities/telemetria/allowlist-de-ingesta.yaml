# Allowlist de ingesta

La telemetría del runtime llega con el email de la cuenta y cuatro identificadores más **en cada
punto y cada registro**; el payload del hook llega con el prompt del usuario, la respuesta del
asistente y la salida de las herramientas **en claro**. Nada de eso hace falta: para unir dinero y
proceso alcanzan los dos identificadores del turno y las etiquetas que nosotros mismos inyectamos.

El evento se arma **campo por campo** desde las claves declaradas. No existe una ruta de código que
copie un mapa entero del emisor al evento — y hay un enforcer que lo impide, porque esa es la única
forma de que la lista sea una garantía y no una intención.

**La ruta del usuario se usa y se tira.** Sirve para reconocer de qué instalación viene la corrida;
después queda un identificador conocido o una huella que no vuelve a la ruta. Un hook que postea su
entrada entera a la máquina local cumple «no egresa» y aun así filtra la conversación al almacén —
por eso hay dos checks de conformance y no uno.
