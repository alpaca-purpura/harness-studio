# Evento canónico de telemetría

El módulo entero habla un solo idioma. El receptor OTLP, el adaptador del agente, el hook del arnés
y el propio daemon producen **el mismo tipo**, y el almacén tiene **una sola puerta de escritura**.
Dos formas de entrar serían dos formas de olvidarse de filtrar.

Tres invariantes que no son estilo:

1. **La llave del join es un par.** El mismo turno lleva el mismo identificador en el canal de
   telemetría y en el canal de hooks. El join es una igualdad de dos campos, no una correlación por
   tiempo — que es lo que permite decir *«el 60 % se va en esta caja»* en vez de *«esta sesión costó
   tanto»*.
2. **Ausencia no es cero.** Los buckets de tokens son punteros. Un runtime que no tiene el concepto
   de «razonamiento» no reporta 0 razonamientos: no reporta nada, y eso viaja como nada.
3. **El evento no tiene dónde poner identidad.** No es una convención: no existe el campo. Si
   existiera, tarde o temprano alguien lo llenaría.
