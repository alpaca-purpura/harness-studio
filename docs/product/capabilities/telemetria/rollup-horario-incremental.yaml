# Rollup horario incremental

El tablero no puede recorrer la tabla cruda cada vez que alguien mira una cifra. La proyección por
hora la reemplaza, y es **incremental y reanudable**: un cursor guarda hasta dónde se agregó, así que
una caída a mitad no obliga a recalcular todo ni cuenta nada dos veces.

**La regla que define este código: el vacío sobrevive a la suma.** Sumar un grupo donde nadie reportó
cierto bucket da vacío, no cero — y al acumular con el grupo siguiente, si los dos siguen vacíos,
sigue vacío. Un `cero` apurado en esa línea convertiría cada ausencia en una medición y la diferencia
ya no se podría recuperar aguas abajo.

⚠️ **Estado `parcial`, y la razón importa.** El agregado se **mantiene** (cursor, debounce, tope
de cardinalidad, recomputo tras borrado) y está probado, pero **ninguna consulta de lectura lo usa
todavía**: el tablero sigue leyendo el detalle. Mientras eso sea así, el agregado no puede afirmar
que conserva historia que ninguna pantalla puede devolver — por eso la purga por plazo se lo lleva
junto con el detalle. El día que entre al camino de lectura, esa línea se revierte y la promesa de
«detalle purgado, resumen conservado» pasa a ser verdad. Deuda registrada en el BACKLOG.

**El sesgo va declarado y en contra.** Un turno que cruza la frontera de la hora se cuenta en las
dos. Eso infla el denominador, o sea **baja** el costo por turno que mostramos — el sesgo empuja
contra recomendar un cambio, que es la única dirección aceptable para un sesgo que no se puede
eliminar.
