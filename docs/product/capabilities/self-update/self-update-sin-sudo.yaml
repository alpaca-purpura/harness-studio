business_rules:
  - "RF-108/109 (bugfix fix-repo-self-update, 2026-07-13): configurar el repo es una acción SEPARADA de dispararlo — POST /api/self-update sigue ignorando el body por completo (RF-106 intacto)"
  - "RF-231 (2026-07-26): el sello de build se inyecta en scripts/bundle.sh y NO en el Makefile, porque el self-update corre ese mismo script — inyectarlo en el Makefile haría que la app, al actualizarse a sí misma, se reportara como «dev» y perdiera su identidad en el acto"
