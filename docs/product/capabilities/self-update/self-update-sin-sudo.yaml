  - "RF-231: si en disco hay un binario compilado DESPUÉS que el que corre (el propio ejecutable tras un dev-sync, o bin/arnesia del repo), la respuesta lo avisa en una línea accionable; si el que corre es el último, no avisa nada"
  - "RF-231: un binario sin identidad inyectada (CI, go run) reporta «dev» — jamás un número inventado"
