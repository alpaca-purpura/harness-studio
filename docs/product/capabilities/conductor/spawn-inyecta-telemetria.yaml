# El spawn nace instrumentado

Cada sesión que ArnesIA lanza **sale midiendo**, y con las etiquetas que dicen a qué arnés, a qué
instalación y a qué paso pertenece — lo que después permite atribuir el gasto sin ninguna heurística.

Encenderlo fue un cambio de **código**, no de configuración: hasta acá el subproceso heredaba el
entorno del daemon tal cual y no había forma de agregarle nada.

**Una de esas variables está en la lista porque se midió, no porque el manual la mencione.** Sin
ella llegan **cero** registros contra dos del control positivo, en la misma corrida y contra el
mismo receptor. Y como es el canal por donde viaja el dinero, omitirla **apaga la señal entera sin
un solo error visible** — el peor modo de falla posible de un módulo de medición. El test la asserta
por nombre y por valor para que nadie la saque «porque parece redundante».
