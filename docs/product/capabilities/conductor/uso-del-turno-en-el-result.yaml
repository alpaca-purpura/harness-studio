# El uso del turno que ya venía y se tiraba

El cierre de turno del subproceso **ya traía** el detalle del consumo: los cuatro buckets, el costo
que el runtime calculó, el modelo canónico, el proveedor y —lo que más importa— **el desglose del
cache por vencimiento**. Hasta hoy se leía solo para estimar el llenado de la ventana de contexto y
el resto se descartaba.

Ese desglose **no viaja por ningún otro canal**. El de telemetría manda un solo número agregado sin
decir a qué vencimiento se escribió, y asumirlo subestima el costo un tercio. Por eso solo se puede
cotizar bien lo que ArnesIA lanzó: es la diferencia real entre los niveles de instrumentación, y la
razón por la que uno de los detectores solo puede existir ahí.

**No se construyó un segundo decodificador.** El adaptador del agente es el dueño del formato, y dos
decodificadores del mismo dato driftan por separado. Se extrajo la función que ya existía embebida y
se le puso nombre.
