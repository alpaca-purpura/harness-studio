# Derivar actividades (arnes.yaml → catálogo + faceta por caja)

El catálogo de tipos de paquete de trabajo del arnés (DEF-D1/D2 v3: actividades =
pipelines internos, jamás plugins) y la faceta por caja que alimenta los chips N0 y el
foco N1 del Mapa multi-actividad.
