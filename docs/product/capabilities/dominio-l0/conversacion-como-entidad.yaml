# La conversación es una entidad, y la sesión la contiene

Hasta este paquete, «la sesión» y «la conversación» eran la misma cosa: el id de Claude Code, el uso
de contexto, el checkpoint y los turnos vivían todos en `Session`. Eso hacía imposible lo que el
operador pidió — ver el historial de una conversación y abrir otra sin perder la primera.

`Conversacion` es ahora una entidad con identidad propia (`cv…`), título editable, marca de activa,
fecha de creación y fecha de última interacción. La sesión sigue siendo el **frente de trabajo**
—el arnés, la empresa, el puesto, el `cwd`— y **contiene** N conversaciones.

**Dónde vive la invariante, y dónde no.** «N ≥ 1 y exactamente una activa» se enforza en tres
lugares, en orden de defensa: las operaciones puras del dominio (que no pueden expresar un estado
inválido), la carga desde disco (que **repara y lo dice**, nunca en silencio) y la escritura (que se
niega a persistir un registro que la viole). No se enforza en el handler, no se enforza en el FE:
ahí sólo se podría esconder.

**Lo que deliberadamente NO se agregó:** ni un campo `Turnos` persistido —se deriva de los turnos, y
así es imposible de mentir— ni un campo por turno en `Turn`, que es el tipo que roza el wire del
turno del usuario y cuyo último campo nuevo rompió la API con un 400.
