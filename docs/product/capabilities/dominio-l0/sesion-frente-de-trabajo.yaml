# Sesión = frente de trabajo

La sesión es lo que vive en el rail: **un arnés, una empresa, un puesto, un directorio de trabajo,
una vista donde quedaste**. Es la unidad que la app corre en paralelo — la tesis de fábrica es que
haya muchas abiertas a la vez.

Hasta el paquete `2026-07-26-conversaciones-del-panel`, la sesión **era también** la conversación:
llevaba el id de Claude Code, el uso de contexto, el checkpoint de la última rotación y el
transcript. Eso hacía que abrir un hilo nuevo sobre el mismo frente de trabajo obligara a abrir otra
sesión — y que el historial de un hilo muriera con él.

Ahora la sesión **contiene** N conversaciones (CAP-140) y se queda sólo con lo suyo. Dos
consecuencias que valen la pena decir en voz alta:

- **El `cwd` se queda en la sesión, no baja.** Lo resuelve el arnés, así que dos conversaciones de
  una misma sesión corren en el mismo directorio por construcción. Es el join hacia el corpus JSONL
  nativo, y es de la sesión porque el confinamiento es del frente, no del hilo.
- **`CerradaEn` cambió de sujeto.** Antes decía «esta conversación terminó»; ahora dice «esta SESIÓN
  se archivó». Las conversaciones no se cierran: se desactivan, y se pueden retomar.

**Lo que la sesión ya no tiene, y por qué importa:** el campo `Turnos`. Existía sólo para sobrevivir
a que el transcript se tirara al archivar. Con el transcript viviendo en la conversación, un entero
que duplica un largo es un drift esperando ocurrir — la cuenta se deriva.

**Y una que apareció al partir el agregado:** mientras la sesión fue plana, el valor que el servicio
devolvía era una copia de verdad — todos sus campos vivos eran escalares. Al bajarlos a un slice de
conversaciones, ese mismo valor pasó a compartir memoria con el registro vivo, y el conductor
escribía sobre lo que el lector ya tenía. Por eso toda sesión que cruza el candado sale como
**instantánea**.
