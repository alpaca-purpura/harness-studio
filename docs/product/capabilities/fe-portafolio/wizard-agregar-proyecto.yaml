# Wizard agregar proyecto (escanear carpeta local → candidatos honestos → elegir)

Superficie 2 del Portafolio (spec §10, G3/G5/G8). T2 construye el contrato; T6 construye el
widget `portafolio-wizard.tsx` (paso fuente → escaneando → candidatos honestos `v?`/«origen
desconocido»/«ya en el portafolio» S1-D10 → agregar) — construido, con 7 stories `play()` +
1 story extra de cobertura del picker Tauri; T7 cableó el transporte real (AbortController,
POST real). Ramas GitHub/Marketplace quedan disabled+tooltip «próximo · S2», sin validación
fingida (G3, verificado en `Paso1Fuente`/`A11yModal`). **T8 gradúa a `vivo`** (R4): `paridad.md`
cierra el slice con la evidencia E2E viva. **S1-D23 (2026-07-15, amendment pre-firma):** el paso
Fuente pasa a modo explícito Escribir/Elegir carpeta con look ButtonGroup — ver scenario
`wizard-fuente-modo-escribir-o-elegir`.
