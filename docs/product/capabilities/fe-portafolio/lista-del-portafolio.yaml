  - story_id: 2026-07-24-telemetria-embebida-otel
    date: 2026-07-26
    type: extend
    summary: >-
      T36 (Tramo B) — las tres columnas de la capa «Mejora» (`USD/corrida` · `tendencia` ·
      `punto de mejora`). **No es hoja nueva: es una columna nueva de un capability que ya
      existe.** Se insertan ENTRE chips y dot de salud, para que el dot siga CERRANDO la fila —
      el ancla visual que la PARIDAD del Slice 1 firmó — y son OPCIONALES, así que las 13 stories
