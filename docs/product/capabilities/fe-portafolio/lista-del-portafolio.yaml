# Lista del Portafolio (lente empresa/plano, buscar, corruptas visibles)

Superficie 1 del Portafolio (spec §10, `revision-adversaria.md` G1/G2/G4/G5/G6/G8/G9). T2
construye el contrato (tipos + selectores + fixtures + cliente HTTP); T4 construye el widget
`portafolio-list.tsx` con sus stories `Vacia`/`Cargando`/`ErrorDeCarga`/`ConDatos`/`LentePlano`/
`CorruptasVisibles`/`FiltroSinResultados` — ese ticket gradúa este capability a `vivo` (`valida:`
poblado con los nombres reales de esas stories).
