scenarios:
  - id: lista-lente-empresa-agrupa-nm
    name: "Lente empresa agrupa N:M con «sin empresa» al final (G4)"
    given: "entradas reales con 0 o más empresas declaradas"
    when: "se renderiza PortafolioList con lente empresa"
    then: "cada entrada aparece en TODOS sus grupos de empresa; el grupo «sin empresa» queda SIEMPRE al final si aplica — la empresa NUNCA se infiere del path"
    verifica: "ConDatos (portafolio-list.stories.tsx) · agruparPorEmpresa (selectors.test.ts)"
  - id: lista-sin-flag-update-fabricado
    name: "La fila jamás pinta un flag de update (G2)"
    given: "entradas reales sin ningún dato de update-check (Slice 4 no construido)"
    when: "se renderiza la fila"
    then: "ausencia total de cualquier «⬆» en el DOM"
    verifica: "ConDatos (assert queryByText(/⬆/) === null)"
  - id: lista-estados-honestos
    name: "Los estados de la lista son reales, nunca fabricados (G5)"
    given: "vacío / cargando / error / corruptas / búsqueda sin match"
    when: "se renderiza PortafolioList en cada estado"
    then: "cada uno pinta su copy honesto — 0 filas fantasma en cargando, motivo textual real en error, banner de corruptas visible sin ocultar el resto (BR-11)"
    verifica: "Vacia · Cargando · ErrorDeCarga · CorruptasVisibles · FiltroSinResultados"
  - id: lista-dot-salud-regla-testeada
    name: "El dot de salud sigue la regla S1-D4 testeada (G9)"
    given: "instalaciones en-deriva/aviso/discrepancias (atención) · todas al-hilo (ok) · deriva-no-evaluable o 0 instalaciones (sin-señal)"
    when: "se computa saludDe(entrada)"
    then: "cada rama devuelve su color/aria-label propio — sin-señal NUNCA comparte clase con ok"
    verifica: "saludDe (selectors.test.ts, 6 ramas) · DotSaludTresRamas (chips.stories.tsx) · ConDatos"
  - id: lista-fila-accesible-por-teclado
    name: "La fila abre el drawer por click o Enter, keyeada por clave (G6/G8)"
    given: "una fila keyeada por `clave` (no id desnudo)"
    when: "click o foco+Enter sobre la fila"
    then: "onAbrir(clave) se dispara con la clave EXACTA — misma superficie por mouse y teclado"
    verifica: "ConDatos (assert onAbrir con clave y Enter)"
  - id: lista-lente-proyecto-marketplace-agrupan-nm
    name: "Lentes proyecto/marketplace agrupan N:M, mismo patrón que empresa (BACKLOG S1-D8)"
    given: "entradas con 0 o más instalaciones/registries"
    when: "se renderiza PortafolioList con lente proyecto o marketplace"
    then: "cada entrada aparece en TODOS sus grupos (por proyecto_path o por registriesDe); «sin proyecto instalado»/«origen desconocido» quedan SIEMPRE al final si aplica"
    verifica: "LenteProyecto · LenteMarketplace (portafolio-list.stories.tsx) · agruparPorProyecto · agruparPorMarketplace (selectors.test.ts)"
  - id: lista-filtros-estado-marketplace-acotan-sin-reagrupar
    name: "Filtros Estado/Marketplace acotan la lista, nunca la reagrupan (distinta afordancia que la lente)"
    given: "entradas reales con distinta saludDe()/registriesDe(); 0+ valores elegidos en cada filtro"
    when: "se aplica filtrarPorSalud y/o filtrarPorMarketplace antes de la lente"
    then: "set vacío = sin filtro (todas); con valores, SOLO sobreviven las entradas que matchean — ninguna fila se reagrupa por el filtro, eso sigue siendo trabajo exclusivo de la lente"
    verifica: "FiltroEstadoAcota · FiltroMarketplaceAcota · ConDatos (interacción del disclosure) · filtrarPorSalud · filtrarPorMarketplace · marketplacesDisponibles (selectors.test.ts)"

