# Lista del Portafolio (lente empresa/plano, buscar, corruptas visibles)

Superficie 1 del Portafolio (spec §10, `revision-adversaria.md` G1/G2/G4/G5/G6/G8/G9). T2
construyó el contrato (tipos + selectores + fixtures + cliente HTTP); T3 los chips/dot de
dominio; T4 construyó el widget `portafolio-list.tsx` con sus 7 stories obligatorias
(`Vacia`/`Cargando`/`ErrorDeCarga`/`ConDatos`/`LentePlano`/`CorruptasVisibles`/
`FiltroSinResultados`, cada una con `play()`). Sigue `status: stub` a propósito (R4, sin
`valida:`): la graduación a `vivo` es T8, cuando `paridad.md` cierre el slice completo con el
gate humano — este ticket NO se adelanta a firmarla.
