      `rol`). La fila se agrupa por `(identidad, instalación)`: dos instalaciones dan dos filas.
      **Al ordenar por costo, los «sin dato» van al final con separador rotulado** — nunca
      intercalados como si valieran 0: un arnés que nunca corrió no es el más barato.
      D21: el chip de fuga grave usa `--crit` sobre `--card`. **Acá el gate axe corre en `error`,
      así que es donde el fix es load-bearing**: sobre `--crit-soft` daría 4,04:1 en claro y
