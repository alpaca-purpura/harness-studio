# Wizard rama Marketplace (registrar: validar real → clase → aterrizar en el catálogo)

Superficie S6. La tab que hoy está `disabled` con tooltip «próximo · S2» pasa a funcionar, con
backend detrás — que es exactamente la condición que el criterio G3 del Slice 1 puso para
habilitarla.

Lo cardinal del diseño: **BR-5 no es un `disabled`, es la topología de la máquina de estados.** El
botón de registrar no existe hasta que hubo una lectura real; no hay un camino en el que un ✓ pueda
aparecer sin archivo leído. Ese es el patrón que conviene copiar cada vez que aparezca un «no
prometas lo que no verificaste».

**Punteros a activar al construir:** ver el bloque comentado del frontmatter. Este capability
comparte archivo con `arnesia.fe-portafolio.wizard-agregar-proyecto` (`portafolio-wizard.tsx`): el
mismo componente sirve las dos ramas y el commit de implementación tiene que EXTENDER esa hoja
también (`design.md §11.1`).
