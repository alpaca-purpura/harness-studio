change_log:
  - story_id: 2026-07-23-portafolio-agregar-marketplace
    date: 2026-07-25
    type: new
    summary: >-
      Alta en el diseño (etapa 3, sin código todavía). AG-D8 reencuadró el plano leyendo la visión:
      NO es una tienda para navegar (`vision.md` §Qué mutó mata «operar arneses de terceros»;
      `CLAUDE.md` dice «solo arneses propios») — es EL ESTANTE DE LO QUE VENDEMOS y el espejo de si
      lo que el cliente tiene coincide. De ahí la partición `propio`/`referencia`, que el borrador
      previo no tenía y sin la cual el plano degeneraba en gestor universal de plugins. Vive DENTRO
      de Portafolio (dos planos hermanos conmutables), no como entrada nueva del rail: mismo
      dominio, comparten el `＋ Agregar`, y el rail ya lleva 4 entradas. Cuatro estados explícitos
      por fila (`leído hace <t>` · `no leído aún` · `sin acceso` · `url no resuelve`) y ninguno
      produce un catálogo vacío navegable: una fila no legible NO navega, muestra el motivo y
      ofrece `Reintentar`/`Leer catálogo`. La fila también trae el contador cruzado «N arneses sin
      origen resuelto», que es la segunda puerta a la reconciliación (AG-D8 decisión 7). Nota de
      token: `no leído aún` usa la clase `sin-senal` (transparente + dashed), NUNCA el color de
      `ok` — «no sé» ≠ «sano»; y `sin acceso` es `--warn` (recuperable: autenticar), no `--crit`.
    merge_sha: null

  - story_id: 2026-07-23-portafolio-agregar-marketplace
    date: 2026-07-25
    type: extend
    summary: >-
      T9/T10/T13 construidos: `entities/marketplace` (tipos espejo del wire de design.md §3.1 + PRESENTADORES puros — la situación la calcula el dominio Go, C1 — + fixtures con shape REAL de esta máquina) y `widgets/marketplace/ui/marketplace-list.tsx` (S2). La fila NO navega si la lectura degradó (`sin-acceso`/`url-no-resuelve`/`no-leido`): muestra el motivo textual y su botón (`Reintentar`/`Leer catálogo`) — jamás un catálogo vacío que se lea como «no tiene arneses» (BR-4). `no-leido` usa la clase `sin-senal` (transparente + dashed), NUNCA el color de `ok`; `sin-acceso` es `--warn`, jamás `--crit`. El contador cruzado «N sin origen resuelto» es la segunda puerta a la reconciliación (conmuta al plano Arneses con `filtrarSinOrigen` prendido). Corruptas + `aviso_detector` en banner VISIBLE sin tapar la lista (BR-11). El transporte (`GET /api/marketplaces`, `POST …/lecturas`) vive SOLO en `portafolio-view.tsx`. `status: parcial` a propósito: los endpoints Go los construye el tramo backend del mismo paquete, y el E2E vivo + la firma de PARIDAD son lo que gradúa a `vivo`. Deuda honesta: el wire de `GET /api/marketplaces` no trae la agregación «N con cambios sin publicar» que dibuja el mockup, así que la celda de pendientes muestra las discrepancias reales (BR-8) y el estado de lectura — tecleársela habría sido la cifra fabricada que este paquete mata.
    merge_sha: null

