# Plano Marketplaces (plano hermano de Arneses, filas honestas, contador cruzado)

Superficie S2 del paquete. Dos planos hermanos conmutables arriba de la lista: **Arneses**
(default, la superficie firmada del Slice 1, sin cambios de fondo) y **Marketplaces** (nuevo).

Lo que hace que este plano no sea decorativo: **es el único lugar donde caben las conversaciones
contra el marketplace `home`** — publicar, update-check y reparar (ítems 3-5 del outcome) son todas
eso, y hasta ahora no había dónde ponerlas. Este paquete construye la superficie y el cálculo
honesto de la situación; la ejecución de las tres es su propio paquete con su propio gate.

**Punteros a activar al construir:** ver el bloque comentado del frontmatter. Ojo con el riesgo #1
del diseño: las moléculas de `shared/ui/` NO pueden importar `entities/*` (`shared-no-upward`, en
`error`) — son genéricas y el vocabulario de dominio entra por prop.
