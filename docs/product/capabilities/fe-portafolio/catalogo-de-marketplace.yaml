# Catálogo de un marketplace (situación por fila, buscador+filtro+lazy, referencia read-only)

Superficies S3/S4. Es la superficie donde el paquete rinde su entregable: **la columna de
situación**. Todo lo demás (buscar, filtrar, lazy) existe para que esa columna sea usable con 273
filas.

Tres cosas que el implementador va a querer «simplificar» y no debe:

1. **La situación no se calcula acá.** Viene del wire. Recalcularla en el FE es imposible sin un
   cross-import que `steiger` rompe, y sería una segunda fuente de verdad para la misma pregunta.
2. **`Habilitada: false` en todas las acciones no es un placeholder.** Es el alcance del paquete
   hecho contrato. El día que llegue el paquete del ítem 3 cambia UNA función pura del dominio y su
   tabla de test; este widget no se toca.
3. **`entradas: null` y `entradas: []` son estados distintos de la UI.** Colapsarlos en «lista
   vacía» es exactamente el pass fabricado que el criterio G3 mató en el Slice 1.

**Punteros a activar al construir:** ver el bloque comentado del frontmatter.
