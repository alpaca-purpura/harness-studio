# Drawer de detalle READ (identidad, facetas, origen de la copia, instalaciones)

Superficie 3 del Portafolio (spec §10/§4, G1/G2/G4/G5/G6/G7/G8). T2 construye el contrato; T5
construye el widget `portafolio-drawer.tsx` (identidad resuelta/provisional, update
no-verificado, trazabilidad de eslabones, confirm de Desvincular con a11y) — ese ticket gradúa
este capability a `vivo`.
