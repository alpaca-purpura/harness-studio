# Drawer de detalle READ (identidad, facetas, origen de la copia, instalaciones)

Superficie 3 del Portafolio (spec §10/§4, G1/G2/G4/G5/G6/G7/G8). T2 construyó el contrato; T5
construyó el widget `portafolio-drawer.tsx` (identidad resuelta/provisional, update
no-verificado, trazabilidad de eslabones, confirm de Desvincular con a11y — `role="dialog"`
propio sobre `shared/lib/focus-trap.ts`, S1-D18) con sus 10 stories obligatorias. Sigue
`status: stub` a propósito (R4, sin `valida:`): la graduación a `vivo` es T8, cuando
`paridad.md` cierre el slice completo con el gate humano.
