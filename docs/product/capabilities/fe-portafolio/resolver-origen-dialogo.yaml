# Diálogo Resolver origen (in-situ sobre la fila, nada premarcado, «ninguno» explícito)

Superficie S7 — la mitad B de PENDIENTE-01 en el FE. «El arnés siempre debe poder decir de dónde
proviene», y cuando no puede, el operador le asigna un origen **explícitamente**.

El detalle de modelado que hace que esto funcione sin traicionar el anti-drift: la elección tiene
**tres** estados, no dos. `undefined` = nada elegido (Confirmar deshabilitado) · `null` = «ninguno,
dejarlo sin origen» (elección válida, Confirmar habilitado) · `"<repo>"` = un destino. Con solo dos
estados habría que premarcar algo o esconder la opción honesta; con tres, «no tiene origen y lo sé»
es una respuesta que el sistema puede registrar sin inventar nada.

**Punteros a activar al construir:** ver el bloque comentado del frontmatter.
