# Abrir en Mapa desde el Portafolio (peek al stage de sesión)

Contraparte FE de `arnesia.portafolio.observar-en-mapa` (CAP-88, T1). T2 construye el contrato
(cliente HTTP); T7 cablea el flujo completo en `pages/shell/ui/portafolio-view.tsx`
(`observarEnMapa` → `setMapaPeek` → `parkView("Mapa")` → `WorkspaceStage` consume el peek). Sin
sesión activa, el botón queda disabled+tooltip (S1-D13): el Mapa vive en el stage de sesión,
crear una sesión de la nada es un efecto demasiado grande para un click. **T8 gradúa a `vivo`**
(R4): el E2E vivo reprodujo GAP-1 (instalación `referenciada-cc` real) con evidencia fresca.
**2026-07-23:** el gate de confirmación por colisión de bare-id (S1-D2) se retiró — el índice
del Mapa re-key (GAP-2) lo volvió innecesario, observar es directo ahora.
