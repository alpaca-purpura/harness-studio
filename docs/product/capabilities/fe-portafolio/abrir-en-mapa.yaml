# Abrir en Mapa desde el Portafolio (peek al stage de sesión, colisión visible)

Contraparte FE de `arnesia.portafolio.observar-en-mapa` (CAP-88, T1). T2 construye el contrato
(cliente HTTP + selector de colisión de bare-id); T7 cablea el flujo completo en
`pages/shell/ui/portafolio-view.tsx` (confirmar-si-colisión → `observarEnMapa` →
`setMapaPeek` → `parkView("Mapa")` → `WorkspaceStage` consume el peek) — ese ticket gradúa este
capability a `vivo`. Sin sesión activa, el botón queda disabled+tooltip (S1-D13): el Mapa vive
en el stage de sesión, crear una sesión de la nada es un efecto demasiado grande para un click.
