    date: 2026-07-30
    type: new
    summary: "A-T4 (A-D4) — doctor v0 de la semilla: juzga por PRESENCIA de las 19 piezas del árbol del contrato §2 (la lista se deriva de la MISMA semilla embebida que siembra — una sola fuente), SIN hashes (la deriva de semilla contra el lock es gap declarado Fase 2). Estados visibles sana|ausente|incompleta + faltantes LISTADOS; lock presente pero ilegible = malformado con motivo. `arnesia init --check` y el propio `init` post-siembra hacen exit≠0 si insana («no avanzamos si no está sana»); el HTTP devuelve 200 con el veredicto tal cual — la salud es un veredicto, no un error."
