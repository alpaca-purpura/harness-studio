business_rules:
  - "Doctor v0 = presencia, sin hashes (§4): el lock se escribe pero NO se evalúa — la evaluación de deriva de semilla es gap declarado Fase 2 (§3)."
  - "El veredicto LISTA los faltantes, jamás los resume en un adjetivo; un lock ilegible es malformado VISIBLE."
  - "HTTP devuelve 200 con estado insano: la salud es un veredicto del dominio, no un error de la operación."
