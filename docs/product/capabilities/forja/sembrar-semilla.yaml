business_rules:
  - "Determinismo D12: el sembrador RELLENA plantillas embebidas (text/template, missingkey=error), jamás improvisa; misma fuente + mismos inputs ⇒ mismo árbol."
  - "Idempotencia §4.1: archivo existente JAMÁS se pisa — se reporta `ya-existia`; re-run sano ⇒ cero escrituras."
  - "El lock se escribe AL FINAL: si la siembra falla a medias no hay lock que mienta «completa» (§3)."
  - "Aditivo puro: `arnes.l0.json` SE QUEDA en la raíz (moverlo rompe nomenclatura-arnes.md); nada del proyecto se mueve ni borra."
  - "A-D3: `.arnesia/` del proyecto = zona de escritura sancionada del PROCESO; sigue PROHIBIDO copiar kit/doctrina/know-how dentro del arnés — runtime intacto."
