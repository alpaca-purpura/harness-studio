# Tarjeta de identidad por sesión (grounding del chat)

Cada spawn del chat recibe un system-prompt POR SESIÓN (`~/.arnesia/sessions/<id>/system.md` =
doctrina ② + tarjeta): qué arnés es, qué copia edita (canónico / instalación / árbol suelto), su
`deriva` y su rol. Si la copia es una instalación, la tarjeta enseña el loop de REPARACIÓN A4
(diagnosticar → in situ vs backport → declarar la causa). Misma infra que usará el checkpoint de
rotación. Todo fuera del árbol del arnés (② ↛ ③).
