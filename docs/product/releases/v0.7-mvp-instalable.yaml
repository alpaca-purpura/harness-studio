## Notas

Los instaladores de esta release viven en `instaladores/v0.7.0/` y `instaladores/v0.7.1/`
(gitignoreados: al repo va el bump de los manifiestos, no los binarios).

**16 paquetes quedaron en `developed`**, no en esta release: tienen su `PARIDAD.md` con
evidencia y la casilla de firma vacía. Eso es exactamente lo que el checkpoint raíz llama
«faltan las firmas 🧑‍⚖️ de PARIDAD del operador» — el board ahora lo muestra como columna
en vez de como prosa.
