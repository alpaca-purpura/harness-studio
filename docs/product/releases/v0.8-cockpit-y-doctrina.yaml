## Notas

El cockpit vive en `tools/cockpit/` como copia vendored del de `vitalia-app` — los diffs
contra upstream están tabulados en `tools/cockpit/README-vendored.md` y fijados por
`tools/cockpit/go/vendored_arnesia_test.go`, para que un merge desde upstream que los
borre rompa un test en vez de romper el board.

`tools/` está EXENTO del gate R2 de capabilities (verificado en
`docs/architecture/fitness/capability_trace_test.go`), así que el cockpit no declara
capabilities propias. El cambio al `kit/` sí las declara.
