# go-arch-lint (config version 3) — el grafo de imports permitido de ArnesIA.
# Falla CI si el código viola los boundaries de docs/architecture/boundaries/.
# Correr desde la raíz del repo:
#   go run github.com/fe3dback/go-arch-lint@latest check --project-path . --arch-file docs/architecture/fitness/.go-arch-lint.yml
#
# Semántica v3 = ALLOW-LIST: todo import interno no listado en mayDependOn está prohibido.
# (No existe `cannotDependOn`; el default-deny lo cubre.)
# El shell (Tauri, web/src-tauri/) es Rust — go-arch-lint no lo ve; su frontera la enforcea
# docs/architecture/fitness/arch_test.go (TestCoreHasNoShellImport) + el boundary superficie-local-confinada.

version: 3
workdir: .

allow:
  depOnAnyVendor: false   # las deps externas se declaran; nada implícito
  deepScan: false         # el scan de inyecciones flaggea al composition root pasando adapters
                          # concretos a los usecases vía puertos — exactamente el patrón que la
                          # doctrina ORDENA («SOLO cmd cablea concretos»). El linter base de
                          # IMPORTS es el que enforcea los boundaries; deepScan lo contradice.

exclude:
  - docs/architecture/fitness          # meta-tests de arquitectura: no son componente del producto
  - docs/product/stories  # artefactos de paquetes de trabajo (sondas), no producto
  - web                   # FE + node_modules (hay .go de terceros dentro de node_modules)

excludeFiles:
  - "_test\\.go$"         # los tests cablean concretos a propósito; la regla aplica a producción

vendors:
  jsonschema:
    in: github.com/google/jsonschema-go/**
  yaml:
    in: gopkg.in/yaml.v3
  sqlite:
    in: modernc.org/sqlite   # índice desechable (indice-desechable-jsonl-es-verdad.md), pure Go sin CGO
  fsnotify:
    in: github.com/fsnotify/fsnotify   # watcher del árbol de arneses (RF-210)

components:
  # --- el core: dominio + casos de uso. No conoce nada de afuera. ---
  domain:
    in: internal/domain/**
  usecase:
    in: internal/usecase/**
  ports:
    in: internal/ports/**

  # --- transporte (adaptadores de entrega) ---
  transport-http:
    in: internal/adapters/transport/http/**
  transport-sse:
    in: internal/adapters/transport/sse/**

  # --- adaptadores de salida ---
  agent-adapters:
    in: internal/adapters/agent/**
  artifact:
    in: internal/adapters/artifact/**
  index:
    in: internal/adapters/index/**
  watch:
    in: internal/adapters/watch/**
  publish:
    in: internal/adapters/publish/**
  store:
    in: internal/adapters/store/**
  conformance:
    in: internal/adapters/conformance/**
  permission:
    in: internal/adapters/permission/**
  provision:
    in: internal/adapters/provision/**
  loader:
    in: internal/adapters/loader/**
  selfupdate:
    in: internal/adapters/selfupdate/**
  portafolio:
    in: internal/adapters/portafolio/**
  marketplace:
    in: internal/adapters/marketplace/**
  traer:
    in: internal/adapters/traer/**
  history:
    in: internal/adapters/history/**
  stt:
    in: internal/adapters/stt/**
  logfile:
    in: internal/adapters/logfile/**

  # --- telemetría embebida (paquete 2026-07-24-telemetria-embebida-otel) ---
  # Los cinco NO se importan entre sí: cada uno habla `domain`+`ports` y nada más. Lo que el
  # bloque prohíbe POR OMISIÓN es tan importante como lo que permite —
  # `transport-http` no puede importar ninguno (el receptor entra inyectado como http.Handler,
  # igual que el broker SSE), e `index` y `telemetria-store` no se conocen: son dos bases con
  # doctrinas opuestas (una desechable, la otra irrecuperable).
  telemetria-otlp:
    in: internal/adapters/telemetria/otlp/**
  telemetria-hooks:
    in: internal/adapters/telemetria/hooks/**
  telemetria-store:
    in: internal/adapters/telemetria/store/**
  telemetria-catalogo:
    in: internal/adapters/telemetria/catalogo/**
  telemetria-descubrimiento:
    in: internal/adapters/telemetria/descubrimiento/**
  telemetria-forward:
    in: internal/adapters/telemetria/forward/**

  # --- datos embebidos (go:embed) ---
  dogfood:
    in: dogfood/**
  doctrina:
    in: .               # la raíz del módulo: su único .go es el embed de docs/architecture/knowledge/+arch/ (cuerpo ①, HS-10/HS-11)

  # --- composition root ---
  cmd:
    in: cmd/**

deps:
  # El dominio no depende de NADIE interno: sin entrada aquí = default-deny total
  # (v3 no admite `mayDependOn: []`; la ausencia es la prohibición). Ídem `dogfood`.

  # Los casos de uso dependen solo del dominio y de los puertos (interfaces) — NUNCA del store
  # concreto (usan ports.SessionStore / ports.WorkdirResolver; el cmd cablea el adaptador).
  usecase:
    mayDependOn: [domain, ports]

  ports:
    mayDependOn: [domain]

  # El transporte traduce request<->caso-de-uso; no toca adaptadores de salida.
  transport-http:
    mayDependOn: [domain, usecase, ports]
  transport-sse:
    mayDependOn: [domain, usecase, ports]

  # Los adaptadores implementan puertos: dependen del dominio/ports, no entre sí.
  agent-adapters:
    mayDependOn: [domain, ports]
  artifact:
    mayDependOn: [domain, ports]   # lector de `status:` frontmatter (document-as-cache, Fase E)
  index:
    mayDependOn: [domain, ports, dogfood]   # seed de fixtures embebidos (HS-09) + el árbol vía ArnesRegistry (RF-207)
    canUse: [sqlite]                        # índice SQLite desechable (fase 5, indice-desechable-jsonl-es-verdad.md)
  watch:
    mayDependOn: [domain, ports]
    canUse: [fsnotify]                      # observa el árbol de arneses registrado (RF-210)
  publish:
    mayDependOn: [domain, ports]
  conformance:
    mayDependOn: [domain, ports]
    canUse: [jsonschema, yaml]   # valida schemas L0 + parsea frontmatter del ruleset
  permission:
    mayDependOn: [domain, ports]
  provision:
    mayDependOn: [ports]         # materializa embeds a ~/.arnesia; el FS embebido se lo inyecta cmd
  loader:
    mayDependOn: [domain, ports]
    canUse: [yaml]               # parsea el frontmatter fusionado de los SKILL.md (nomenclatura v1)
  selfupdate:
    mayDependOn: [domain, ports] # build/instalar/re-exec del binario (paquete boton-actualizar)
  portafolio:
    mayDependOn: [domain, ports] # walker + lock + deriva + store del Portafolio (Slice 0)
    canUse: [yaml]               # parsea el lock DevStudio (.devstudio/arneses.yaml, S0-D4/D8)
  marketplace:
    mayDependOn: [domain, ports] # registro + caché + detector CC + los 2 lectores de catálogo
  traer:
    mayDependOn: [domain, ports] # materializa un PlanTraer en un staging (camino A local, B por git)

  # El store (registro de sesiones + registro arnés→ruta) implementa puertos.
  store:
    mayDependOn: [domain, ports]

  # Lector de replay del JSONL de ~/.claude (historial B2) — enumera/reconstruye turnos,
  # nunca parsea su schema como contrato (conductor-no-parsea-jsonl.md).
  history:
    mayDependOn: [domain]

  # Motor de STT local (RF-223): shellea el motor que el operador tenga en $PATH. No conoce
  # el dominio — habla `audio []byte` → `string` y nada más.
  stt:
    mayDependOn: [ports]

  # `logfile` (RF-230) NO tiene entrada acá a propósito: ausencia = default-deny total, igual
  # que `domain`. Escribe bytes a un archivo y no conoce ni el dominio. Que no dependa de nada
  # es el punto — es el primero que se cablea al arrancar, antes de que exista cualquier otra
  # cosa que pueda fallar.

  # Decodifica el wire OTLP y emite el evento canónico. NO conoce el almacén ni el catálogo:
  # habla `ports.TelemetriaSink` y nada más.
  telemetria-otlp:
    mayDependOn: [domain, ports]
  # Proyecta el payload del hook a los campos declarados (allowlist). Lo usan el daemon (por el
  # endpoint) y el propio binario (por el subcomando) — por eso vive acá y no en `cmd`: dos
  # implementaciones de la misma allowlist es la forma segura de que una se olvide de un campo.
  telemetria-hooks:
    mayDependOn: [domain, ports]
  telemetria-store:
    mayDependOn: [domain, ports]
    canUse: [sqlite]        # telemetria.db — base PROPIA, jamás index.db (A2)
  telemetria-catalogo:
    mayDependOn: [domain, ports]
  # Escribe la ficha del daemon a os.UserConfigDir(). No conoce el almacén ni el receptor.
  telemetria-descubrimiento:
    mayDependOn: [domain, ports]
  # Egreso opcional del operador, apagado por default. Habla el evento YA PROYECTADO.
  telemetria-forward:
    mayDependOn: [domain, ports]

  # SOLO la composition root cablea adaptadores concretos con los puertos.
  cmd:
    mayDependOn: [domain, usecase, ports, transport-http, transport-sse, agent-adapters, artifact, index, watch, publish, store, conformance, permission, provision, loader, selfupdate, portafolio, marketplace, traer, history, stt, logfile, dogfood, doctrina, telemetria-otlp, telemetria-hooks, telemetria-store, telemetria-catalogo, telemetria-descubrimiento, telemetria-forward]
