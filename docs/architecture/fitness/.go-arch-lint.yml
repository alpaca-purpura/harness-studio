# go-arch-lint (config version 3) — el grafo de imports permitido de ArnesIA.
# Falla CI si el código viola los boundaries de docs/architecture/boundaries/.
# Correr desde la raíz del repo:
#   go run github.com/fe3dback/go-arch-lint@latest check --project-path . --arch-file docs/architecture/fitness/.go-arch-lint.yml
#
# Semántica v3 = ALLOW-LIST: todo import interno no listado en mayDependOn está prohibido.
# (No existe `cannotDependOn`; el default-deny lo cubre.)
# El shell (Tauri, web/src-tauri/) es Rust — go-arch-lint no lo ve; su frontera la enforcea
# docs/architecture/fitness/arch_test.go (TestCoreHasNoShellImport) + el boundary superficie-local-confinada.

version: 3
workdir: .

allow:
  depOnAnyVendor: false   # las deps externas se declaran; nada implícito
  deepScan: false         # el scan de inyecciones flaggea al composition root pasando adapters
                          # concretos a los usecases vía puertos — exactamente el patrón que la
                          # doctrina ORDENA («SOLO cmd cablea concretos»). El linter base de
                          # IMPORTS es el que enforcea los boundaries; deepScan lo contradice.

exclude:
  - docs/architecture/fitness          # meta-tests de arquitectura: no son componente del producto
  - docs/product/stories  # artefactos de paquetes de trabajo (sondas), no producto
  - web                   # FE + node_modules (hay .go de terceros dentro de node_modules)

excludeFiles:
  - "_test\\.go$"         # los tests cablean concretos a propósito; la regla aplica a producción

vendors:
  jsonschema:
    in: github.com/google/jsonschema-go/**
  yaml:
    in: gopkg.in/yaml.v3

components:
  # --- el core: dominio + casos de uso. No conoce nada de afuera. ---
  domain:
    in: internal/domain/**
  usecase:
    in: internal/usecase/**
  ports:
    in: internal/ports/**

  # --- transporte (adaptadores de entrega) ---
  transport-http:
    in: internal/adapters/transport/http/**
  transport-sse:
    in: internal/adapters/transport/sse/**

  # --- adaptadores de salida ---
  agent-adapters:
    in: internal/adapters/agent/**
  artifact:
    in: internal/adapters/artifact/**
  index:
    in: internal/adapters/index/**
  watch:
    in: internal/adapters/watch/**
  publish:
    in: internal/adapters/publish/**
  store:
    in: internal/adapters/store/**
  conformance:
    in: internal/adapters/conformance/**
  permission:
    in: internal/adapters/permission/**
  provision:
    in: internal/adapters/provision/**
  loader:
    in: internal/adapters/loader/**
  selfupdate:
    in: internal/adapters/selfupdate/**

  # --- datos embebidos (go:embed) ---
  dogfood:
    in: dogfood/**
  doctrina:
    in: .               # la raíz del módulo: su único .go es el embed de docs/architecture/knowledge/+arch/ (cuerpo ①, HS-10/HS-11)

  # --- composition root ---
  cmd:
    in: cmd/**

deps:
  # El dominio no depende de NADIE interno: sin entrada aquí = default-deny total
  # (v3 no admite `mayDependOn: []`; la ausencia es la prohibición). Ídem `dogfood`.

  # Los casos de uso dependen solo del dominio y de los puertos (interfaces) — NUNCA del store
  # concreto (usan ports.SessionStore / ports.WorkdirResolver; el cmd cablea el adaptador).
  usecase:
    mayDependOn: [domain, ports]

  ports:
    mayDependOn: [domain]

  # El transporte traduce request<->caso-de-uso; no toca adaptadores de salida.
  transport-http:
    mayDependOn: [domain, usecase, ports]
  transport-sse:
    mayDependOn: [domain, usecase, ports]

  # Los adaptadores implementan puertos: dependen del dominio/ports, no entre sí.
  agent-adapters:
    mayDependOn: [domain, ports]
  artifact:
    mayDependOn: [domain, ports]   # lector de `status:` frontmatter (document-as-cache, Fase E)
  index:
    mayDependOn: [domain, ports, dogfood]   # seed de fixtures embebidos (HS-09; sale con el loader real)
  watch:
    mayDependOn: [domain, ports]
  publish:
    mayDependOn: [domain, ports]
  conformance:
    mayDependOn: [domain, ports]
    canUse: [jsonschema, yaml]   # valida schemas L0 + parsea frontmatter del ruleset
  permission:
    mayDependOn: [domain, ports]
  provision:
    mayDependOn: [ports]         # materializa embeds a ~/.arnesia; el FS embebido se lo inyecta cmd
  loader:
    mayDependOn: [domain, ports]
    canUse: [yaml]               # parsea el frontmatter fusionado de los SKILL.md (nomenclatura v1)
  selfupdate:
    mayDependOn: [domain, ports] # build/instalar/re-exec del binario (paquete boton-actualizar)

  # El store (registro de sesiones + registro arnés→ruta) implementa puertos.
  store:
    mayDependOn: [domain, ports]

  # SOLO la composition root cablea adaptadores concretos con los puertos.
  cmd:
    mayDependOn: [domain, usecase, ports, transport-http, transport-sse, agent-adapters, artifact, index, watch, publish, store, conformance, permission, provision, loader, selfupdate, dogfood, doctrina]
