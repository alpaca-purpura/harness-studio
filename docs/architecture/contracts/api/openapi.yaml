openapi: 3.1.0
info:
  title: ArnesIA daemon API
  # 0.2.0-hs09: + GET /harnesses/{id}/nodes/{nodeId}/fuente (tab Contenido del
  # inspector, paquete inspector-drawer RF-93 — lectura confinada S2).
  # 0.3.0-hs11: + GET /version · POST /self-update (paquete boton-actualizar,
  # RF-104..107 — self-update sin sudo del binario instalado).
  # 0.4.0-hs22: + GET /portafolio · POST /portafolio/escaneos · POST /portafolio/proyectos
  # · DELETE /portafolio/arneses/{clave} (Portafolio de arneses, Slice 0 — S0-D9).
  # 0.5.0-fix-repo-self-update: + PUT /self-update/repo (bugfix 2026-07-13, RF-108/109
  # — configura el repo del self-update cuando el daemon arrancó sin --repo/ARNESIA_REPO;
  # ÚNICO endpoint que acepta un path, separado del disparador POST /self-update).
  # 0.6.0-portafolio-slice1: + POST /portafolio/arneses/{clave}/mapa (Slice 1, T1, S1-D1
  # — cierra GAP-1): publica una presencia YA PERSISTIDA del Portafolio al índice del Mapa,
  # read-only — NO registra cwd, NO toca /arneses.
  # 0.7.0-marketplaces: + el plano Marketplaces y el catálogo (paquete
  # 2026-07-23-portafolio-agregar-marketplace, AG-D8/AG-D17): GET/POST /marketplaces ·
  # POST /marketplaces/validaciones · DELETE /marketplaces/{nombre} ·
  # GET /marketplaces/{nombre}/catalogo · POST /marketplaces/{nombre}/lecturas ·
  # POST /marketplaces/{nombre}/traidos · GET|POST /portafolio/arneses/{clave}/origen(/candidatos).
  # DOS puntos del contrato que un implementador «prolijo» rompería sin darse cuenta:
  #   (a) `entradas` es NULLABLE a propósito — `null` = «no pude leer» y `[]` = «leí y no declara
  #       ninguno». Convertir el null en [] es el pass fabricado que BR-4 mata.
  #   (b) un 200 de …/traidos puede traer `deriva: "en-deriva"` o `"deriva-no-evaluable"`: BR-17
  #       dice que la deriva se muestra TAL CUAL salga, y un veredicto incómodo no es un fallo de
  #       la operación. Agregar una validación que exija `al-hilo` rompe BR-17.
  version: 0.7.0-marketplaces
  description: >-
    Superficie HTTP/SSE del daemon `arnesia serve` (:4200). Single source: de aquí se generan los
    tipos Go (oapi-codegen) y TS (openapi-typescript). El transporte NO contiene reglas de negocio
    (docs/architecture/boundaries/dominio-independiente-de-transporte.md).


    **Confinamiento (HS-06, docs/architecture/boundaries/superficie-local-confinada.md).** Toda ruta (salvo
    `/healthz`) pasa tres gates: (1) `Host` debe ser un loopback esperado (anti DNS-rebinding); (2)
    un `Origin` de navegador debe estar en el allowlist y se refleja exacto (nunca `*`); (3) si el
    daemon arrancó con token (`ARNESIA_AUTH_TOKEN`/`--auth-token`, minteado por el shell Tauri), toda
    request lo exige (`Authorization: Bearer` o `X-Arnesia-Token`, o `?token=` para el SSE). En dev
    sin token, los gates 1+2 siguen. Los gates Host/Origin no se expresan en OpenAPI (son de header);
    se documentan aquí.
servers:
  - url: http://127.0.0.1:4200/api
    description: daemon local (single-user). El WebView Tauri y el browser dev consumen esta misma API.
security:
  - bearerAuth: []
  # En dev (daemon sin token) la seguridad efectiva es Host+Origin; el token gate se salta.
paths:
  /harnesses:
    get:
      operationId: listHarnesses
      summary: Portafolio (S1) — arneses con salud + telemetría resumida.
      responses:
        "200":
          description: Lista de arneses (organigrama/cuadrícula).
  /harnesses/{id}/graph:
    get:
      operationId: getHarnessGraph
      summary: Mapa (S2) — el grafo agnóstico del arnés (nodos + edges).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Grafo L0.
          content:
            application/json:
              schema:
                $ref: ../schema/graph.l0.schema.json
  /harnesses/{id}/nodes/{nodeId}:
    get:
      operationId: getNode
      summary: Inspector (S3) — identidad + métricas + contrato + hallazgos del nodo.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Nodo con contrato (valida box.contract.schema.json) y métricas. }
  /harnesses/{id}/nodes/{nodeId}/fuente:
    get:
      operationId: getNodeFuente
      summary: >-
        Fuente del nodo (RF-93, tab Contenido del inspector): el artefacto REAL que el loader
        reconoció (fuente_path), servido tal cual (read-only) — autodocumentación como efecto.
        Lectura CONFINADA al directorio REGISTRADO del arnés (S2, valida traversal; un arnés sin
        directorio registrado responde 404 honesto — los fixtures embebidos no viven en disco).
        La ruta servida viaja en el header X-Arnesia-Fuente-Path.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: El archivo fuente, tal cual está en disco.
          content:
            text/plain:
              schema: { type: string }
        "403": { description: La fuente resuelta escapa del directorio del arnés (traversal). }
        "404": { description: "Arnés no indexado · nodo inexistente · nodo sin fuente_path (pendiente del reconocedor) · arnés sin directorio registrado · archivo ausente — el cuerpo dice cuál." }
  /harnesses/{id}/runs:
    get:
      operationId: listRuns
      summary: Corridas (S8) — corridas reales derivadas del JSONL (enumerar/replay, no parsear schema).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Lista de corridas. }
  /harnesses/{id}/conformance:
    get:
      operationId: getConformance
      summary: >-
        Auditoría del arnés (HS-11, puente 3): el motor corre el scope `arnes` (schema graph.l0 +
        contratos de caja + spine + escritor único + firewall CC-native) sobre el grafo indexado —
        pass/fail real con ruleset EMBEBIDO en el binario, sin repo fuente. El scope `fabrica`
        (arch-test/go-arch-lint) no pasa por aquí: vive en el CI del repo.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "ConformanceReport: target + results[] {check{id,severidad,que,mecanismo,enforced_by}, veredicto pass|fail|error|deferred|n/a, detalle}." }
        "404": { description: Arnés no indexado. }

  /harnesses/{id}/boxes/{boxId}/run:
    post:
      operationId: runBox
      summary: >-
        Conductor T3 (Fase E, D2 gate-0): arranca el loop determinista de UNA caja — recurso
        propio, separado del turno conversacional del Dock (docs/architecture/boundaries/
        orquestacion-determinista-entre-cajas.md). ASÍNCRONO (deuda BACKLOG «run async + gate
        post-run», 2026-07-23): valida SÍNCRONO (arnés indexado · nodo existe · es caja ·
        permisos del rol · workdir resoluble — barato, cero tokens) y devuelve `202`+`run_id`
        de inmediato; el loop (spawn confinado al árbol del arnés con `--max-turns` SIEMPRE +
        flags de permisos CC-native + inyección de doctrina — lee `result.subtype` + el
        `status:` del artefacto, jamás el texto del chat, y rutea por `contract.ruta`) corre en
        background. Todo `control_request` (p.ej. una escritura) se auto-resuelve contra el
        `PermissionSet` del rol — un run T3 es headless, no hay humano en el loop para el click
        de permisos-gui (Allow→allow, Deny/Ask→deny). El desenlace se consulta con `GET
        .../runs/{runId}`; el progreso vivo sigue viajando en paralelo por /events (event: run,
        sin cambio de contrato).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: boxId, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Run arrancado — el run_id para pollear el desenlace o escuchar /events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartRunResult" }
        "404": { description: Arnés no indexado, o el nodo no existe en su grafo. }
        "422": { description: El nodo no es una caja con contrato (solo una caja de proceso corre T3), o el arnés no declara rol (META de enganche incompleta — el permission-set deriva del rol). }
        "500": { description: Fallo al resolver permisos/workdir — el error REAL, nunca un 501 genérico. }
  /harnesses/{id}/boxes/{boxId}/runs/{runId}:
    get:
      operationId: getRun
      summary: >-
        Desenlace de un run arrancado por `POST .../run` (deuda BACKLOG «run async»,
        2026-07-23). El registro es in-memory (no persiste a través de un reinicio del
        daemon).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: boxId, in: path, required: true, schema: { type: string } }
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Estado del run — `corriendo` (aún sin `result`), `terminado` (`result` poblado, incl. el gate post-run en `result.conformance` si aplica) o `error` (`error` poblado).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunStatus" }
        "404": { description: "run_id inexistente — nunca arrancó, o el daemon reinició desde entonces." }

  /version:
    get:
      operationId: getVersion
      summary: >-
        Identidad honesta del binario corriendo (RF-107 + RF-231): el identificador del BUILD
        (semver + sello de compilación, `0.2.21.2607260225`) y, si en disco hay uno más nuevo, el
        aviso accionable. Además, la huella VCS del buildinfo de Go
        (vcs.revision[:7], sufijo «+sucio» si vcs.modified; sin VCS → «dev»), ruta REAL del
        ejecutable, si el proceso puede reemplazarlo (escritura en su directorio — RF-102) y el
        repo configurado al daemon (--repo / ARNESIA_REPO; vacío = RF-103). Fuente de la tarjeta
        «Versión y actualización» y del polling del reinicio (RF-105). La UI jamás inventa nada.
      responses:
        "200":
          description: Identidad del binario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
  /self-update:
    post:
      operationId: selfUpdate
      summary: >-
        Self-update sin sudo (RF-104, paquete boton-actualizar): compila el árbol local
        (scripts/bundle.sh --daemon-only, cwd = repo CONFIGURADO), inspecciona el binario
        producido SIN ejecutarlo (buildinfo), instala write-tmp→rename atómico EN el directorio
        del ejecutable y agenda el re-exec POST-respuesta (RF-105). SÍNCRONO: la respuesta ES el
        reporte con el veredicto REAL de cada paso; un paso fallido corta el flujo (posteriores
        «no-corrido») y el binario instalado queda INTACTO. Seguridad (RF-106, decisión #4): bajo
        withAuth; el request NO lleva parámetros — ni rutas ni flags, el cuerpo se IGNORA; un
        self-update a la vez; huella igual = «ya-al-dia», éxito sin reinstalar.
      responses:
        "200":
          description: Reporte terminal (actualizado · ya-al-dia · fallo) con los 5 pasos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfUpdateReport" }
        "409": { description: Ya hay un self-update en curso (o el daemon está por reiniciar — el lock se retiene tras «actualizado»). }
        "503": { description: "No puede NI empezar: binario no escribible (RF-102) o repo no configurado (RF-103) — el cuerpo dice cuál." }

  /self-update/repo:
    put:
      operationId: configurarSelfUpdateRepo
      summary: >-
        Configura el repo del self-update (RF-108/109, bugfix fix-repo-self-update
        2026-07-13) — para una instalación empaquetada (Tauri/.deb) cuyo daemon arrancó
        sin --repo/ARNESIA_REPO. ÚNICO endpoint que acepta un path del request; POST
        /self-update arriba sigue ignorando el body por completo (RF-106 intacto: se
        separa CONFIGURAR de DISPARAR). Valida con las MISMAS reglas del paso ①
        Verificar (repo existe · go.mod es el módulo esperado · scripts/bundle.sh ·
        toolchain go/pnpm/bash en PATH) ANTES de fijar/persistir; un path inválido
        responde 400 sin tocar el repo activo ni el store (~/.arnesia/self-update.json).
        Precedencia al boot: --repo/ARNESIA_REPO > persistido > vacío.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [path], properties: { path: { type: string } } }
      responses:
        "200":
          description: Repo válido — fijado en caliente y persistido.
          content:
            application/json:
              schema: { type: object, properties: { detalle: { type: string } } }
        "400": { description: "Path vacío, o candidato inválido (motivo exacto de Verificar) — no persiste, no toca el repo activo." }

  /arneses:
    get:
      operationId: listArneses
      summary: >-
        Registro arnés→ruta (S2) — cada arnés mapea a la working dir donde corre `claude`. Confina la
        sesión a su árbol (docs/architecture/boundaries/permisos-gui `sesion-aislada-por-cwd`).
      responses:
        "200":
          description: Entradas registradas.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ArnesPath" } }
  /arneses/{id}:
    put:
      operationId: registerArnes
      summary: Registra (o reemplaza) la working dir de un arnés. Valida absoluta·existe·dir·no-protegida.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [path], properties: { path: { type: string } } }
      responses:
        "200":
          description: Registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArnesPath" }
        "400": { description: "Ruta inválida o protegida (`/`, `$HOME`, `~/.claude`, `~/.ssh`, relativa…)." }

  /portafolio:
    get:
      operationId: listPortafolio
      summary: >-
        Portafolio de arneses (Slice 0, S0-D9) — el registro persistente (identidades `(home,id)`,
        separado del registro arnés→ruta de `/arneses`). Degrada honesto (BR-11): una entrada
        corrupta del store JAMÁS impide listar el resto, se reporta aparte.
      responses:
        "200":
          description: "Entradas sanas + corruptas visibles: `{entradas:[{clave,identidad,nombre,empresas,canonico,instalaciones,agregado}], corruptas:[{motivo}]}`."
  /portafolio/escaneos:
    post:
      operationId: postEscanearPortafolio
      summary: >-
        Escanea `path` (walker READ-ONLY, D-DOM-3/6) y devuelve los candidatos crudos —
        identidad/origen/deriva ya resueltos. NO persiste nada (spec §7.1: el usuario elige qué
        agregar en un segundo paso).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [path], properties: { path: { type: string } } }
      responses:
        "200":
          description: "Candidatos: `[{clave, identidad, nombre, empresas, instalacion, es_canonico}]`."
        "400": { description: "Path inválido, inexistente, protegido, o bare repo (no escaneable)." }
  /portafolio/proyectos:
    post:
      operationId: postAgregarPortafolio
      summary: >-
        Re-escanea `path` y persiste SOLO los candidatos cuya `clave` está en `elegidos[]`
        (TOCTOU-safe: nunca confía en un snapshot viejo). Idempotente por identidad+installPath —
        re-agregar es re-escanear, jamás duplica (C-P-8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, elegidos]
              properties:
                path: { type: string }
                elegidos: { type: array, items: { type: string } }
      responses:
        "200":
          description: Entradas persistidas (mismo shape que GET /portafolio, sin corruptas).
        "400": { description: "Path inválido/protegido, o conflicto de canónicos (C-N-5)." }
  /portafolio/arneses/{clave}:
    delete:
      operationId: deleteDesvincularPortafolio
      summary: >-
        Desvincula la identidad `clave` del registro. NO desinstala nada, NO borra ningún clon
        (C-UNL-3) — solo saca la entrada del Portafolio.
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "`{desvinculado: true}`." }
        "404": { description: Clave desconocida en el Portafolio. }
  /portafolio/arneses/{clave}/mapa:
    post:
      operationId: postObservarEnMapaPortafolio
      summary: >-
        Observar en Mapa (Slice 1, S1-D1, cierra GAP-1): publica una presencia YA
        PERSISTIDA del Portafolio al índice del Mapa — read-only, espejo de la ley
        anti-drift. NO registra cwd, NO toca `/arneses`/`arneses.json` (esa es otra
        frontera — confinamiento de sesión, no observación); es la única vía honesta de
        indexar una instalación `referenciada-cc` (cache CC bajo `~/.claude/…`), donde
        `PUT /arneses/{id}` rechaza el path por `checkProtected`. `install_path` debe ser
        una presencia REAL de `clave` (∈ `instalaciones[].install_path` o `== canonico.path`,
        comparación canónica EvalSymlinks+Clean — así un checkout clasificado CANÓNICO por
        RN-IDENT-4/C-N-12 también es observable). Responde el bare id EFECTIVO indexado
        (S1-D2: el índice sigue keyeando por id pelado — deuda de GAP-2 fuera de este slice).
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [install_path], properties: { install_path: { type: string } } }
      responses:
        "200":
          description: Indexado.
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string }, indexed: { type: boolean } } }
        "404": { description: Clave desconocida en el Portafolio (solo se observa lo YA persistido). }
        "400": { description: "`install_path` ajeno a la entrada, o no cargable (motivo real del loader — jamás un grafo inventado)." }
        "500": { description: PortafolioService sin el 5° puerto cableado (subcomando CLI, no el daemon). }

  /portafolio/arneses/{clave}/origen/candidatos:
    get:
      operationId: getCandidatosOrigenPortafolio
      summary: >-
        Candidatos de origen para un arnés con identidad provisional (S7). El orden lo arma el
        BACKEND por señales BLANDAS (el registry de la copia ya apunta ahí > coincidencia de autor
        > clase `propio` > nombre) y NADA viene premarcado: el orden es sugerencia, la elección es
        del operador (BR-11). `actual` es el home ya declarado ("" si sigue provisional).
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Candidatos ordenados. `candidatos` es SIEMPRE un array (nunca null).
          content:
            application/json:
              schema:
                type: object
                required: [candidatos, actual]
                properties:
                  candidatos:
                    type: array
                    items:
                      type: object
                      required: [nombre, clase]
                      properties:
                        nombre: { type: string }
                        repo: { type: string }
                        clase: { type: string, enum: [propio, referencia] }
                        senal: { type: string, description: "texto que la fila muestra debajo del nombre; se ARMA en el backend para que sea testeable." }
                  actual: { type: string }
        "404": { description: Clave desconocida en el Portafolio. }
  /portafolio/arneses/{clave}/origen:
    post:
      operationId: postAsignarOrigenPortafolio
      summary: >-
        Asigna el `home` DECLARADO de un arnés y lo re-keyea (S7, BR-11). **No clona, no instala y
        no escribe ningún archivo fuera de `~/.arnesia/`** — el home va al STORE, no a un sello,
        porque el dir de una instalación `referenciada-cc` vive bajo `~/.claude`, que
        `validarRootPortafolio` PROHÍBE escribir (C3 del design.md). `sin_origen: true` es la opción
        «ninguno — dejarlo sin origen»: NO toca la identidad, solo estampa
        `origen_sin_resolver_desde` para que la fila deje de reclamar atención — jamás se inventa
        un home. El único efecto secundario es la re-evaluación de deriva, que es una LECTURA.
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                home: { type: string, description: "referencia git; se canonicaliza a host/owner/repo (RN-IDENT-1)." }
                sin_origen: { type: boolean, description: "elección EXPLÍCITA de «ninguno»; no hay default." }
      responses:
        "200":
          description: La EntradaPortafolio re-keyed (su `identidad`/`clave` nuevas → el FE re-apunta la fila y el drawer).
          content:
            application/json:
              schema: { type: object }
        "400": { description: "`home` no canonicalizable, o el body no trae ni `home` ni `sin_origen`." }
        "404": { description: Clave desconocida en el Portafolio. }
        "409": { description: "Re-keyear daría una clave que YA existe: fusionar dos identidades es otra operación (C-ID-2), el sistema no las junta solo." }

  /marketplaces:
    get:
      operationId: listMarketplaces
      summary: >-
        Plano Marketplaces (S2): collect-all de `~/.claude/plugins/known_marketplaces.json`
        (eslabón `cc-known-marketplaces`, que da `install_location` gratis) + el registro propio
        del operador, mergeado por `nombre`. La `lectura` de cada fila se hidrata del CACHÉ, sin
        parsear ningún catálogo (uno de los reales son 273 entradas / 159 KB). Responde **200
        incluso con la metadata de CC ilegible o el registro corrupto**: van en `aviso_detector` y
        `corruptas` — nunca un 500, nunca una lista vacía muda.
      responses:
        "200":
          description: El plano. `marketplaces` es SIEMPRE un array — «no conozco ninguno» es una afirmación verdadera y verificable.
          content:
            application/json:
              schema:
                type: object
                required: [marketplaces, sin_origen_resuelto]
                properties:
                  marketplaces: { type: array, items: { $ref: "#/components/schemas/MarketplaceConocido" } }
                  corruptas: { type: array, items: { type: object, properties: { motivo: { type: string } } } }
                  aviso_detector: { type: string, description: "metadata de Claude Code ilegible: VISIBLE, jamás una lista vacía silenciosa." }
                  sin_origen_resuelto: { type: integer, description: "contador cruzado: identidades provisionales que el operador todavía no resolvió ni confirmó dejar sin origen." }
        "500": { description: El servicio de marketplaces no está cableado (fallo de I/O real al abrir el registro). }
    post:
      operationId: postRegistrarMarketplace
      summary: >-
        Registra el lado DECLARADO de un marketplace (S6 paso 4). Re-valida (TOCTOU-safe) antes de
        persistir. **Conocer no es adquirir**: escribe UNA fila en `~/.arnesia/marketplaces.json` y
        nada más — cero clone, cero instalación, cero escritura fuera de `~/.arnesia/`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, clase]
              properties:
                url: { type: string }
                clase: { type: string, enum: [propio, referencia] }
      responses:
        "200":
          description: Registrado; devuelve la fila YA MERGEADA (con el eslabón de CC si lo hay) para aterrizar en el catálogo sin un GET extra.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceConocido" }
        "400": { description: "url no canonicalizable · clase fuera del enum · el repo no expone `.claude-plugin/marketplace.json` legible." }
        "409":
          description: "BR-7 — ya registrado: **no duplica, NO PISA**. El body trae `nombre` para que la UI ofrezca «ir a él» sin parsear texto."
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, nombre: { type: string } } }
        "503": { description: "Sin vía de lectura (ni checkout local ni `gh`/PAT). **No es 400**: la url no está mal, no PODEMOS MIRAR." }
  /marketplaces/validaciones:
    post:
      operationId: postValidarMarketplace
      summary: >-
        Prueba una url SIN persistir nada (S6 paso 1). **Solo un 200 pinta ✓**: la validación exige
        un `.claude-plugin/marketplace.json` REAL leído, y el body del 200 trae lo que se LEYÓ
        (`nombre`, `owner`, nº de entradas, `fuente`) — es el criterio G3 hecho contrato de
        transporte, no hay forma de fabricar un ✓ sin archivo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string } } }
      responses:
        "200":
          description: Se leyó un marketplace.json real.
          content:
            application/json:
              schema:
                type: object
                required: [url_canonica, nombre, entradas, fuente, ya_registrado]
                properties:
                  url_canonica: { type: string }
                  nombre: { type: string }
                  owner_nombre: { type: string }
                  owner_email: { type: string }
                  owner_url: { type: string, description: "3 de los 5 marketplaces reales usan `url` en vez de `email` (AG-D15)." }
                  descripcion: { type: string }
                  entradas: { type: integer }
                  fuente: { type: string, enum: [local, remoto] }
                  ya_registrado: { type: boolean }
                  clase_actual: { type: string, enum: [propio, referencia] }
        "400": { description: "«tu url no sirve»: no canonicaliza, o el repo existe pero no expone el catálogo (motivos DISTINGUIBLES entre sí)." }
        "503": { description: "«no puedo mirar»: sin checkout local ni `gh`/PAT. Jamás insinúa que la url esté mal." }
  /marketplaces/{nombre}:
    delete:
      operationId: deleteOlvidarMarketplace
      summary: >-
        Quita el lado DECLARADO del registro. `sigue_detectado: true` es honestidad: **no podemos
        hacer que Claude Code deje de conocerlo** — la fila va a seguir apareciendo con eslabón
        `cc-known-marketplaces` y clase degradada a `referencia` (fail-safe).
      parameters:
        - { name: nombre, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Se quitó la declaración.
          content:
            application/json:
              schema: { type: object, properties: { olvidado: { type: boolean }, sigue_detectado: { type: boolean } } }
        "404": { description: El operador nunca lo declaró (CC puede conocerlo igual). }
  /marketplaces/{nombre}/catalogo:
    get:
      operationId: getCatalogoMarketplace
      summary: >-
        Catálogo de un marketplace con la SITUACIÓN ya calculada por fila (el cruce catálogo ×
        Portafolio vive en el dominio Go, nunca en el widget). Caché primero: la primera visita hace
        UNA lectura y la persiste (idempotente). **No hay 5xx por «no pude leer el catálogo»**: se
        responde 200 con `entradas: null` + `lectura.motivo` — un 500 no le da al FE nada que
        renderizar y lo empujaría a mostrar una lista vacía.
      parameters:
        - { name: nombre, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: El marketplace es conocido — incluso si NO se pudo leer su catálogo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalogo" }
        "404": { description: Nombre no conocido (ni detectado por CC ni declarado). }
        "500": { description: El servicio de marketplaces no está cableado. }
  /marketplaces/{nombre}/lecturas:
    post:
      operationId: postLeerCatalogoMarketplace
      summary: >-
        REFRESCO EXPLÍCITO del catálogo (AG-D8 decisión 3): fuerza una lectura fresca y la cachea.
        Es lo que pegan `Refrescar`, `Reintentar` y `Leer catálogo` del plano. Body vacío; misma
        respuesta que el GET. Si la lectura falla y HAY caché, se devuelve el caché con la
        degradación visible y el `cuando` VIEJO — la UI dice «leído hace 2 días · ahora sin
        acceso», nunca «al día» (BR-3).
      parameters:
        - { name: nombre, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Idem GET.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalogo" }
        "404": { description: Nombre no conocido. }
        "500": { description: El servicio de marketplaces no está cableado. }
  /marketplaces/{nombre}/traidos:
    post:
      operationId: postTraerCanonicoMarketplace
      summary: >-
        `↧ Traer canónico` (AG-D17): materializa la fila `entrada` del catálogo como **canónico
        editable** en `~/.arnesia/checkouts/<slug(marketplace)>/<slug(entrada)>/`. Se pide la FILA,
        no el `source`: el cliente NO elige el mecanismo — lo decide el dominio (camino A = copia
        del checkout que Claude Code ya mantiene, sin red; camino B = fetch shallow pineado por el
        `sha` del catálogo). **Nada se escribe fuera de `~/.arnesia/`, y jamás dentro de
        `~/.claude`** (BR-13). La materialización es ATÓMICA (staging bajo `~/.arnesia/tmp` →
        rename): un Traer interrumpido no deja canónico parcial ni entrada registrada (BR-15).
      parameters:
        - { name: nombre, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [entrada], properties: { entrada: { type: string } } }
      responses:
        "200":
          description: >-
            Traído y registrado. **`deriva` puede ser `en-deriva` o `deriva-no-evaluable` y sigue
            siendo un 200**: BR-17 dice que la deriva se evalúa de inmediato y se muestra TAL CUAL
            SALGA — un veredicto incómodo no es un fallo de la operación. No agregar una validación
            que exija `al-hilo`.
          content:
            application/json:
              schema:
                type: object
                required: [entrada, clave, destino, camino, deriva]
                properties:
                  entrada: { type: object, description: "la EntradaPortafolio registrada." }
                  clave: { type: string }
                  destino: { type: string }
                  camino: { type: string, enum: [local, externo] }
                  sha_efectivo: { type: string, description: "vacío en el camino local: no hay commit que reportar, y fabricar uno sería inventar procedencia." }
                  deriva: { type: string, enum: [al-hilo, en-deriva, deriva-no-evaluable] }
                  deriva_detalle: { type: string }
                  avisos: { type: array, items: { type: string }, description: "problemas del DATO que no impiden traer (commit≠sha, ref divergente, source \"./\", symlink que escapa): se MUESTRAN (BR-8)." }
        "400": { description: "Precondiciones del pedido, nada se intentó: clase `referencia` (BR-1, re-chequeada en el DOMINIO porque un POST puede llegar sin pasar por la UI) · `entrada` ajena al catálogo · `source` que no sé materializar (con el crudo visible) · destino que escapa de checkouts." }
        "404": { description: Nombre de marketplace no conocido. }
        "409":
          description: "BR-14 — el destino YA tiene contenido: se aborta **sin tocar nada**. El body trae `destino` para ofrecer «abrir el canónico que ya tenés»."
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, destino: { type: string } } }
        "502": { description: "«miré, y lo que vino no es lo declarado»: el remoto no tiene el repo/sha/ref, el commit no trae la subruta, o el `sha` materializado NO coincide con el declarado (BR-16). Es un tercer estado, distinto de 400 y de 503 — el estante mintió, no el cliente." }
        "503": { description: "«no puedo mirar»: sin `gh` autenticado ni PAT (BR-18 — ArnesIA no pide, guarda ni proxya credenciales), o el camino que el catálogo exige no está disponible en esta instalación." }
        "500": { description: "Fallo NUESTRO: disco, permisos, `rename`, o el `Upsert` del registro (en ese caso el dir QUEDA y el motivo lo dice: es el único estado parcial posible y es VISIBLE)." }

  /sessions:
    get:
      operationId: listSessions
      summary: Multisesión (S4) — los frentes de trabajo abiertos (rail).
      responses:
        "200":
          description: Sesiones en orden estable de creación.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
    post:
      operationId: createSession
      summary: Abre un frente. `path` opcional registra la ruta del arnés en la misma llamada (S2).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSession" }
      responses:
        "201":
          description: Sesión creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { description: Payload inválido o ruta de arnés rechazada. }
  /sessions/{id}:
    get:
      operationId: getSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: La sesión.
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "404": { description: No existe. }
    patch:
      operationId: patchSession
      summary: Renombra el frente y/o registra la vista donde quedó parqueada.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { frente: { type: string }, view: { type: string } }
      responses:
        "200":
          description: Sesión actualizada.
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "404": { description: No existe. }
    delete:
      operationId: closeSession
      summary: Cierra la sesión (detiene el conductor, la saca del registro).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cerrada. }
        "404": { description: No existe. }
  /sessions/{id}/turn:
    post:
      operationId: sendTurn
      summary: Dock (S4) — envía un turno a la sesión CC viva (streaming input al subproceso).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        "202":
          description: "Turno encolado; la respuesta llega por /events (event: dock)."
        "400": { description: Turno vacío. }
        "409":
          description: >-
            La sesión ya está streaming — un turno en vuelo (docs/architecture/boundaries/sesion-viva-consistente
            `un-turno-a-la-vez`). No se encola un segundo turno.
  /sessions/{id}/permission:
    post:
      operationId: resolvePermission
      summary: >-
        Diff-approval (human-in-the-loop, REAL desde Fase E — reemplaza el 501). Resuelve el
        control_request:can_use_tool que el adapter reenvió como tarjeta `permission` del Dock (D3):
        la decisión humana corre BAJO la autoridad del rol — `PermissionSet.Decide` con deny > ask >
        allow, así que un deny del rol gana incluso al click de aprobar (la autoridad se impone fuera
        del razonamiento Y fuera del click); un allow mintea un Grant EFÍMERO (TTL del rol; el
        operador solo puede ACOTARLO con ttl_segundos, nunca ampliarlo) y mientras esté vigente el
        mismo tool no re-pregunta en la sesión. La respuesta viaja al conductor como
        control_response por stdin. Ver docs/architecture/boundaries/permisos-gui-human-in-the-loop.md +
        permisos-derivan-del-rol.md.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, decision]
              properties:
                request_id: { type: string, description: el id del control_request pendiente (llegó en la tarjeta `permission` del Dock). }
                decision: { type: string, enum: [allow, deny] }
                role: { type: string, description: "opcional (RF-114, decisión #6): omitido ⇒ el daemon usa el rol del ARNÉS de la sesión (graph.l0 META) — el FE no elige autoridad. Deny-by-default: sin rol resoluble no hay resolución." }
                ttl_segundos: { type: integer, description: "opcional: ACOTA el TTL del grant por debajo del que el rol autoriza (jamás lo amplía)." }
      responses:
        "200":
          description: Resuelto — la decisión EFECTIVA tras aplicar la autoridad del rol.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionResolution" }
        "400": { description: Decisión inválida, rol vacío/irresoluble, o request_id ausente. }
        "404": { description: No hay control_request pendiente con ese id en esa sesión. }
        "500": { description: La respuesta no llegó al conductor (proceso muerto / stdin roto). }
  /sessions/{id}/interrupt:
    post:
      operationId: interruptSession
      summary: >-
        Stop real (RF-116, paquete chat-cc-funcional): interrumpe el turno en vuelo IN-BAND —
        los asks de permiso pendientes se deniegan con motivo «interrumpido por el operador» y el
        conductor recibe control_request subtype=interrupt por stdin (wire verificado contra el SDK
        oficial + implementaciones de referencia, investigación 2026-07-08 §Frente ①). El subproceso
        sigue vivo: emite su frame `result` y la sesión asienta idle por el flujo normal. Matar el
        proceso es solo fallback del adapter, jamás esta API.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: "Interrupt enviado; el cierre del turno llega por /events (event: dock)."
        "404": { description: Sesión inexistente. }
        "409": { description: No hay turno en vuelo que interrumpir (sesión idle o sin conductor vivo). }
        "500": { description: El interrupt no llegó al conductor (stdin roto). }

  /sessions/{id}/dictado:
    post:
      operationId: dictar
      summary: >-
        Dictado por voz (RF-222): sube la grabación de una sesión y devuelve el texto listo para
        poblar el composer. El cuerpo es el audio CRUDO (ni multipart ni base64): es un blob de una
        pieza que va derecho al motor. La respuesta SIEMPRE dice si el texto quedó `limpio` u
        `crudo` — pasar un crudo por limpio sería un pass fabricado (V-D4).
        El formato real que sube la app es `audio/wav`, armado por el FE: el `MediaRecorder` de
        WebKitGTK 2.52.3 declara soportar `audio/mp4` y entrega 0 bytes (RF-229). El endpoint acepta
        cualquier mime que el motor instalado soporte; sin Content-Type asume `audio/wav`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          audio/wav:
            schema: { type: string, format: binary }
          audio/mp4:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Texto para el composer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dictado" }
        "400": { description: "Grabación vacía o ilegible." }
        "404": { description: Sesión inexistente. }
        "413": { description: "La grabación excede el tope del endpoint (24 MB)." }
        "422":
          description: >-
            La transcripción vino vacía. NO es un 500: el pipeline anduvo, el audio no tenía voz.
            El FE avisa y no toca el composer (RF-227).
        "503":
          description: >-
            No hay motor de transcripción usable. 503 y no 500: falta una capacidad, no se rompió
            nada — un 500 mandaría al operador a buscar un bug donde falta un `apt install`.
  /dictado/disponibilidad:
    get:
      operationId: disponibilidadDictado
      summary: >-
        ¿Se puede dictar y, si no, POR QUÉ y qué instalar (RF-223/RF-227)? El composer la consulta al
        montar: sin esto, la única forma de enterarse de que falta el motor sería grabar tres minutos
        y fallar al final.
      responses:
        "200":
          description: Disponibilidad con motivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisponibilidadDictado" }

  /diagnostico:
    post:
      operationId: reportarDiagnostico
      summary: >-
        Diagnóstico de un fallo del FE (RF-230). Existe porque la app corre en un WebView SIN
        devtools: su `console.error` no va a ningún lado, y el daemon es el único proceso de la app
        que escribe a disco. Lo recibido se escribe al log local (~/.arnesia/logs/arnesia.log);
        NO sale de la máquina — la telemetría de producto (OTel, HS-27) es otro paquete y otro
        destino. Responde 204: el FE ya le mostró el fallo real al operador y este POST no puede
        convertirse en un segundo error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventoDiagnostico" }
      responses:
        "204": { description: "Anotado en el log." }
        "400": { description: "Cuerpo ilegible, sin `evento`, o por encima del tope de 64 KB." }

  /events:
    get:
      operationId: streamEvents
      summary: >-
        SSE multiplexado — UNA conexión, eventos tipados (event: map | dock | run). Reconexión por
        Last-Event-ID; un subscriber rezagado se descarta y reconecta+replaya (sesion-viva-consistente
        `sin-perdida-silenciosa`). Cada frame `dock` lleva session_id + run_id (rutear N streams +
        idempotencia).
      security:
        - bearerAuth: []
        - sseToken: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
        - name: token
          in: query
          required: false
          description: Token de capacidad para el EventSource (no puede poner headers).
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream. Taxonomía AG-UI (subset text/tool/lifecycle) + CUSTOM para eventos CC.
          content:
            text/event-stream:
              schema:
                description: "Frames `event: dock` con este payload:"
                $ref: "#/components/schemas/DockFrame"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Token de capacidad minteado por el shell Tauri (`ARNESIA_AUTH_TOKEN`). También aceptado como
        header `X-Arnesia-Token`. Ausente en dev → gate se salta (Host+Origin siguen).
    sseToken:
      type: apiKey
      in: query
      name: token
      description: Variante para el EventSource (que no puede setear headers).
  schemas:
    Session:
      type: object
      required: [id, frente, arnes, status, view]
      properties:
        id: { type: string }
        frente: { type: string }
        arnes: { type: string }
        empresa: { type: string }
        puesto: { type: string }
        salud: { type: string, enum: [ok, warn, crit, info] }
        status: { type: string, enum: [streaming, await, idle] }
        view: { type: string }
        parked: { type: string }
        claude_session_id: { type: string }
        model: { type: string }
        ctx_pct: { type: integer }
        conv:
          type: array
          items:
            type: object
            properties:
              rol: { type: string, enum: [user, assistant, sys] }
              text: { type: string }
    NewSession:
      type: object
      required: [arnes]
      properties:
        arnes: { type: string }
        frente: { type: string }
        empresa: { type: string }
        puesto: { type: string }
        salud: { type: string, enum: [ok, warn, crit, info] }
        view: { type: string }
        parked: { type: string }
        path: { type: string, description: "opcional — registra la working dir del arnés (S2)." }
    DockFrame:
      type: object
      required: [session_id, kind]
      properties:
        session_id: { type: string, description: "rutea N conversaciones en una conexión." }
        run_id: { type: string, description: "el turno al que pertenece el frame (idempotencia)." }
        kind:
          type: string
          enum: [status, init, delta, message, result, error, permission, permission_result]
          description: >-
            permission = tarjeta ask→UI de un control_request (lleva request_id + tool + input crudo
            para pintar el diff; la sesión pasa a `await`); permission_result la cierra con la
            decisión efectiva.
        text: { type: string }
        status: { type: string, enum: [streaming, await, idle] }
        ctx_pct: { type: integer }
        model: { type: string }
        claude_session_id: { type: string }
        request_id: { type: string, description: "id del control_request (kinds permission*)." }
        tool: { type: string, description: "el tool que Claude Code pide correr." }
        input: { type: object, description: "input crudo del tool (file_path/old_string/new_string…) — el GUI pinta el diff de aquí." }
        decision: { type: string, enum: [allow, deny], description: "decisión efectiva (kind=permission_result)." }
    StartRunResult:
      type: object
      required: [run_id]
      properties:
        run_id: { type: string }
    RunStatus:
      type: object
      required: [run_id, estado]
      properties:
        run_id: { type: string }
        estado: { type: string, enum: [corriendo, terminado, error] }
        result: { $ref: "#/components/schemas/RunResult" }
        error: { type: string, description: "solo si estado=error." }
    RunResult:
      type: object
      required: [run_id, box, estado, iteraciones, handoff]
      properties:
        run_id: { type: string }
        box: { type: string }
        rol: { type: string, description: "el rol cuya autoridad parametrizó la corrida." }
        estado: { type: string, enum: [draft, working, review, done, blocked], description: "estado interno terminal de la caja (FSM del conductor)." }
        iteraciones: { type: integer }
        siguiente: { type: string, description: "a dónde ruteó CÓDIGO leyendo contract.ruta (o el handoff)." }
        handoff: { type: boolean, description: "true = blocked → escalación humana." }
        advertencias: { type: array, items: { type: string }, description: "lecturas no fatales (RF-111) — p.ej. un error al leer el status del artefacto. Visibles, jamás descartadas en silencio." }
        conformance:
          description: "gate post-run (CAP-70/71, deuda BACKLOG «run async», 2026-07-23) — SOLO presente si el run auto-permitió ≥1 escritura. Mismo shape que GET .../conformance: target + results[] {check{id,severidad,que,mecanismo,enforced_by}, veredicto pass|fail|error|deferred|n/a, detalle}."
    PermissionResolution:
      type: object
      required: [request_id, tool, efectiva]
      properties:
        request_id: { type: string }
        tool: { type: string }
        efectiva: { type: string, enum: [allow, deny], description: "la decisión tras aplicar deny-del-rol > click humano." }
        motivo: { type: string }
        expira: { type: string, format: date-time, description: "fin del grant efímero (solo efectiva=allow)." }
    ArnesPath:
      type: object
      required: [arnes, path]
      properties:
        arnes: { type: string }
        path: { type: string }
    VersionInfo:
      type: object
      required: [huella, fecha, instalado_en, escribible, repo, sucio, version]
      properties:
        version:
          type: string
          description: >-
            RF-231 — identificador COMPLETO del build: semver + sello de compilación AAMMDDHHMM
            (`0.2.21.2607260225`). «dev» en un binario sin identidad inyectada. ADITIVO a `huella`,
            no su reemplazo: la huella dice QUÉ COMMIT y el sello dice QUÉ COMPILACIÓN — dos builds
            del mismo árbol comparten commit y no comparten sello. Monótono: más grande = más nuevo.
        compilado: { type: string, description: "RF-231 — el sello en formato legible (2026-07-26 02:25); ausente en un build sin sellar." }
        aviso_build:
          type: string
          description: >-
            RF-231 — hay un binario compilado DESPUÉS que el que corre (el propio ejecutable tras un
            `make dev-sync` con la app abierta, o `<repo>/bin/arnesia`), en una línea accionable.
            Ausente = el que corre es el último. Se compara mtime contra el sello, con margen: sin
            margen el binario recién instalado se denunciaría a sí mismo en cada arranque.
        huella: { type: string, description: "vcs.revision[:7] (+«+sucio» si vcs.modified); «dev» sin VCS info." }
        fecha: { type: string, description: "fecha del commit (vcs.time, solo día); vacía sin VCS." }
        instalado_en: { type: string, description: "ruta REAL del ejecutable (os.Executable, capturada al boot)." }
        escribible: { type: boolean, description: "el proceso puede escribir el DIRECTORIO del ejecutable (el rename lo exige)." }
        repo: { type: string, description: "repo configurado al daemon (--repo/ARNESIA_REPO); vacío = sin repo (RF-103)." }
        sucio: { type: boolean, description: "vcs.modified del build corriente (decisión #7, aditivo)." }
    MarketplaceConocido:
      type: object
      description: >-
        UNA fila del plano Marketplaces, ya mergeada collect-all (AG-D9). La clave de merge es
        `nombre` — el mismo con el que Claude Code keyea `installed_plugins.json` (`"<id>@<nombre>"`),
        o sea el nombre INSTALABLE, no el repo.
      required: [nombre, clase, eslabones, lectura]
      properties:
        nombre: { type: string }
        repo: { type: string, description: "canonicalizado a host/owner/repo (RN-IDENT-1); vacío si ninguna fuente lo declara — el crudo queda en `discrepancias`." }
        clase:
          type: string
          enum: [propio, referencia]
          description: >-
            `propio` = publicamos ahí (participa de traer/publicar/actualizar/reparar) ·
            `referencia` = solo resuelve procedencia, catálogo READ-ONLY y jamás operable. NO son
            simétricas, y una clase desconocida degrada a `referencia` (el lado que no habilita
            operar lo ajeno), nunca a `propio`.
        eslabones:
          type: array
          minItems: 1
          items: { type: string, enum: [cc-known-marketplaces, declarado-por-operador] }
          description: "de dónde salió el CONOCIMIENTO de que existe. Collect-all: los dos = detectado + confirmado."
        install_location: { type: string, description: "el checkout que Claude Code ya mantiene — la ruta contra la que `deriva` compara. Solo del eslabón CC." }
        cc_actualizado: { type: string, description: "el `lastUpdated` que CC declara. Dato de CC, NO nuestra lectura: nunca se muestra como «leído hace…»." }
        lectura: { $ref: "#/components/schemas/EstadoLectura" }
        discrepancias: { type: array, items: { type: string }, description: "repo o clase distintos entre eslabones: se MUESTRAN con los dos valores crudos, jamás se eligen en silencio (BR-8)." }
        registrado: { type: string, description: "RFC3339 de cuándo el operador lo declaró; vacío si solo lo detectó CC." }
    EstadoLectura:
      type: object
      description: >-
        Veredicto de la última lectura de catálogo. Invariante: `tipo == leido` ⟺ `entradas` es una
        cuenta REAL y `cuando` ≠ ""; cualquier otro tipo EXIGE `motivo` — un degradado sin motivo es
        un degradado mudo. `no-leido` es el CERO del tipo a propósito: dice «no leído aún», nunca
        «leído con 0 entradas».
      required: [tipo]
      properties:
        tipo: { type: string, enum: [no-leido, leido, sin-acceso, url-no-resuelve] }
        cuando: { type: string, description: "RFC3339 de la última lectura EXITOSA — se conserva aunque el tipo ya no sea `leido`, para poder decir «leído hace 2 días · ahora sin acceso»." }
        entradas: { type: integer }
        motivo: { type: string }
        fuente: { type: string, enum: [local, remoto, ""] }
    Catalogo:
      type: object
      description: El catálogo leído de UN marketplace, con la situación ya calculada por fila.
      required: [marketplace, clase, lectura, entradas]
      properties:
        marketplace: { type: string }
        clase: { type: string, enum: [propio, referencia] }
        repo: { type: string }
        owner_nombre: { type: string }
        owner_email: { type: string }
        owner_url: { type: string }
        descripcion: { type: string }
        lectura: { $ref: "#/components/schemas/EstadoLectura" }
        entradas:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/EntradaCatalogo" }
          description: >-
            **NULLABLE A PROPÓSITO (BR-4).** `null` = «no hubo lectura válida: no sé qué hay»;
            `[]` = «leí el archivo y no declara ningún arnés, hace N minutos». Son afirmaciones
            DISTINTAS: una lista vacía se lee como «este marketplace no tiene arneses», que es
            exactamente el pass fabricado que el criterio G3 mató en el Slice 1. Convertir el
            `null` en `[]` «para que el cliente no tenga que chequear» ROMPE el contrato.
        canales: { type: object, additionalProperties: { type: string }, description: "enriquecimiento OPCIONAL de `catalogo.json` (convención de prenter, NO del estándar): ausente ⇒ degrada sin ruido." }
        versiones:
          type: array
          items:
            type: object
            properties:
              version: { type: string }
              estado: { type: string, description: "crudo, sin enum: es formato ajeno." }
              fuente: { type: string }
              fecha: { type: string }
        truncado: { type: integer, description: "cuántas filas se descartaron por el techo de seguridad o por venir sin `name`. >0 se MUESTRA: recorte visible, jamás silencioso." }
    EntradaCatalogo:
      type: object
      description: >-
        UNA fila del catálogo = la ENTRADA DE ÍNDICE, o sea el CANAL (lo que el cliente instala con
        `/plugin install <nombre>@<marketplace>`). Dos entradas pueden compartir `source` y NO son
        dos arneses (AG-D11): son dos canales del mismo árbol físico.
      required: [nombre, source, situacion, accion]
      properties:
        nombre: { type: string }
        source:
          type: object
          description: "`plugins[].source` NORMALIZADO. El formato ajeno tiene 4 formas reales (AG-D13); el dominio solo ve esto traducido."
          required: [tipo, crudo]
          properties:
            tipo: { type: string, enum: [ruta-relativa, git-subdir, url, github, desconocido] }
            crudo: { type: string, description: "representación textual estable (clave de agrupamiento de canales). Una forma no reconocida NO se descarta: queda `desconocido` con su crudo VISIBLE." }
            ruta: { type: string }
            url: { type: string }
            repo: { type: string }
            ref: { type: string, description: "PISTA, nunca la autoridad: en el catálogo real diverge del `sha` en entradas sanas, y solo está en 77 de 220 formas objeto." }
            sha: { type: string, description: "el PIN: presente en 220/220 formas objeto. Es la autoridad de BR-16." }
            commit: { type: string, description: "2º hash que solo la forma `github` declara, con valor DISTINTO del `sha`. Gana el `sha`; la divergencia va a `avisos`." }
        version: { type: string }
        version_de: { type: string, enum: [campo-version, derivada-de-source, ""], description: "procedencia de la versión (BR-2): del campo estándar, del último segmento semver de la ruta, o AUSENTE. Jamás inventada." }
        descripcion: { type: string }
        comparte_source_con: { type: array, items: { type: string }, description: "los OTROS nombres del mismo catálogo con idéntico source: son canales del mismo arnés físico." }
        estado_canal: { type: string, description: "solo del enriquecimiento opcional `catalogo.json`." }
        nombre_anterior: { type: array, items: { type: string }, description: "de `renames` del marketplace: así un arnés keyeado con el nombre viejo sigue cruzando." }
        aviso: { type: array, items: { type: string }, description: "problemas de CALIDAD DEL DATO de la fila (nombre duplicado, ruta ausente en el checkout, source no reconocido). Se muestran COMPLETOS y jamás convierten la fila en un descarte silencioso." }
        situacion:
          type: object
          description: >-
            Veredicto del cruce catálogo × Portafolio, calculado en el DOMINIO Go y ya resuelto en
            el cable (nunca en el widget). `no-comparable` es una rama de PRIMERA CLASE: falta
            cualquier insumo ⇒ `no-comparable` **con motivo**, y gana sobre toda afirmación
            positiva. `al-hilo` es la ÚLTIMA rama de la tabla: se alcanza solo cuando ningún insumo
            falta y ninguna instalación tiene señal.
          required: [tipo]
          properties:
            tipo: { type: string, enum: [no-lo-tengo, al-hilo, mi-copia-adelantada, estante-adelantado, instalaciones-en-deriva, no-comparable] }
            mia: { type: string }
            estante: { type: string }
            cuantas: { type: integer }
            motivo: { type: string }
            clave_portafolio: { type: string }
            via: { type: string, enum: [home-declarado, faceta-registry, rename, ""], description: "CÓMO se cruzó. El cruce DÉBIL (`faceta-registry`) se muestra como tal — no se presenta como identidad resuelta." }
        accion:
          type: object
          description: >-
            El verbo que la fila ofrece + si está habilitado + POR QUÉ no. La habilitación vive en
            el DOMINIO, no en el widget: para clase `referencia` es `false` en TODA rama con el
            motivo literal «no aplica: solo arneses propios» (BR-1). En este paquete la ÚNICA celda
            habilitada es `propio` × `no-lo-tengo` ⇒ `traer-canonico` (AG-D17); Publicar/Actualizar/
            Reparar quedan `false` con el tooltip a su ítem del outcome (BR-10).
          required: [verbo, habilitada]
          properties:
            verbo: { type: string, enum: ["", traer-canonico, publicar, actualizar-mi-copia, reparar] }
            habilitada: { type: boolean }
            motivo: { type: string, description: "el tooltip LITERAL. Vive en el dominio para que exista un solo texto testeable." }
    Dictado:
      type: object
      required: [texto, estado]
      properties:
        texto: { type: string, description: "el texto que va al composer." }
        estado:
          type: string
          enum: [limpio, crudo]
          description: >-
            OBLIGATORIO en el wire: `crudo` = la limpieza falló o se cortó y esto es el transcripto
            sin ordenar. El FE lo marca visiblemente.
        motivo: { type: string, description: "por qué quedó crudo. Ausente cuando estado es limpio." }
        motor: { type: string, description: "el STT que produjo el transcripto — qué motor corrió cambia qué errores esperar." }
    DisponibilidadDictado:
      type: object
      required: [disponible]
      properties:
        disponible: { type: boolean }
        motor: { type: string }
        motivo: { type: string, description: "por qué NO se puede dictar. El FE lo pinta en la superficie, no en un tooltip." }
        instalar:
          type: array
          description: "qué binarios instalarían el motor faltante."
          items: { type: string }
    EventoDiagnostico:
      type: object
      required: [evento]
      properties:
        origen: { type: string, description: "qué parte lo emitió (\"fe\"). Ausente se anota como «desconocido»: perder un fallo por un campo cosmético sería el silencio que este endpoint vino a sacar." }
        evento: { type: string, description: "clave estable para grepear el log (\"dictado.sin-bloques\"). Recortada a 120 chars." }
        mensaje: { type: string }
        detalle:
          type: object
          additionalProperties: true
          description: >-
            Libre a propósito: cada fallo tiene sus propias variables (un dictado necesita
            muestras/pico/hz, un crash de render necesita el stack). Se loguea tal cual y NADIE
            parsea su forma como contrato (mismo criterio que conductor-no-parsea-jsonl.md).
    SelfUpdateReport:
      type: object
      required: [resultado, pasos]
      properties:
        resultado: { type: string, enum: [actualizado, ya-al-dia, fallo] }
        huella_nueva: { type: string, description: "huella del binario recién compilado (presente en actualizado y ya-al-dia)." }
        pasos:
          type: array
          description: "SIEMPRE los 5 pasos (verificar · build · verificar binario · instalar · reiniciar) con su veredicto REAL — la UI pinta la checklist de aquí, jamás inventa (RF-104)."
          items:
            type: object
            required: [paso, estado]
            properties:
              paso: { type: string, enum: [verificar, build, verificar binario, instalar, reiniciar] }
              estado: { type: string, enum: [ok, fallo, no-corrido, agendado], description: "«agendado» = solo el paso reiniciar tras «actualizado»: la respuesta sale ANTES del re-exec (RF-105)." }
              detalle: { type: string, description: "detalle humano; en un fallo lleva la cola del stderr." }
