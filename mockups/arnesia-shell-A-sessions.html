<!DOCTYPE html>
<title>ArnesIA · Shell A + Multisesión (it.14)</title>
<style>
  :root{
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#e9edf2; --line:#d5dbe3; --line2:#c3cbd6;
    --text:#212832; --muted:#5d6a79; --accent:#a8742c; --accent-soft:rgba(168,116,44,.14);
    --c-skill:#2f74b5; --c-agent:#7455c2; --c-hook:#bb4c85; --c-know:#20826f; --c-mcp:#586c80; --c-rule:#7a7a24;
    --ok:#2e8f5e; --warn:#c96a2e; --crit:#c94545;
    --ok-soft:rgba(46,143,94,.13); --warn-soft:rgba(201,106,46,.13); --crit-soft:rgba(201,69,69,.12);
    --live:#2f74b5; --live-soft:rgba(47,116,181,.14);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --surface:#1b2027; --surface2:#242b34; --line:#2d3743; --line2:#3a4655;
      --text:#e8ecf1; --muted:#94a1af; --accent:#d9a35b; --accent-soft:rgba(217,163,91,.14);
      --c-skill:#5b9dd9; --c-agent:#9b7fd4; --c-hook:#d46a9e; --c-know:#4fb3a1; --c-mcp:#8195a9; --c-rule:#b5b558;
      --ok:#57b380; --warn:#e0904f; --crit:#e25b5b;
      --ok-soft:rgba(87,179,128,.14); --warn-soft:rgba(224,144,79,.14); --crit-soft:rgba(226,91,91,.13);
      --live:#5b9dd9; --live-soft:rgba(91,157,217,.16);
    }
  }
  :root[data-theme="light"]{
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#e9edf2; --line:#d5dbe3; --line2:#c3cbd6;
    --text:#212832; --muted:#5d6a79; --accent:#a8742c; --accent-soft:rgba(168,116,44,.14);
    --c-skill:#2f74b5; --c-agent:#7455c2; --c-hook:#bb4c85; --c-know:#20826f; --c-mcp:#586c80; --c-rule:#7a7a24;
    --ok:#2e8f5e; --warn:#c96a2e; --crit:#c94545;
    --ok-soft:rgba(46,143,94,.13); --warn-soft:rgba(201,106,46,.13); --crit-soft:rgba(201,69,69,.12);
    --live:#2f74b5; --live-soft:rgba(47,116,181,.14);
  }
  :root[data-theme="dark"]{
    --bg:#14171c; --surface:#1b2027; --surface2:#242b34; --line:#2d3743; --line2:#3a4655;
    --text:#e8ecf1; --muted:#94a1af; --accent:#d9a35b; --accent-soft:rgba(217,163,91,.14);
    --c-skill:#5b9dd9; --c-agent:#9b7fd4; --c-hook:#d46a9e; --c-know:#4fb3a1; --c-mcp:#8195a9; --c-rule:#b5b558;
    --ok:#57b380; --warn:#e0904f; --crit:#e25b5b;
    --ok-soft:rgba(87,179,128,.14); --warn-soft:rgba(224,144,79,.14); --crit-soft:rgba(226,91,91,.13);
    --live:#5b9dd9; --live-soft:rgba(91,157,217,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  code,.mono{font-family:var(--mono)}

  .lab{flex:none;height:38px;display:flex;align-items:center;gap:11px;padding:0 14px;background:var(--surface2);border-bottom:1px solid var(--line2);font-size:11.5px;color:var(--muted);z-index:60}
  .lab .tag{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;border:1px solid var(--line2);border-radius:5px;padding:3px 7px;white-space:nowrap}
  .lab b{color:var(--text)}
  .lab .sp{flex:1}
  .lab button{border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11px;background:var(--surface);color:var(--muted)}
  .lab button:hover{color:var(--text);border-color:var(--line2)}

  .app{flex:1;min-height:0;display:flex}

  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.78)}}
  .pip{width:8px;height:8px;border-radius:99px;flex:none}
  .pip.streaming{background:var(--live);animation:pulse 1.1s ease-in-out infinite}
  .pip.await{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
  .pip.idle{background:var(--muted);opacity:.5}
  .hdot{width:7px;height:7px;border-radius:99px;flex:none}
  .h-ok{background:var(--ok)} .h-warn{background:var(--warn)} .h-crit{background:var(--crit)} .h-info{background:var(--accent)}

  /* ══ Session Rail (ancho) ══ */
  .srail{flex:none;width:224px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:6;transition:width .16s ease}
  .srail-hd{flex:none;display:flex;align-items:center;gap:8px;padding:10px 10px 8px}
  .srail-hd .brand{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
  .srail-hd .wm{font-weight:700;font-size:13px;letter-spacing:-.01em}
  .srail-hd .att{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn);border-radius:99px;padding:2px 6px}
  .srail-hd .col{margin-left:auto;color:var(--muted);border-radius:6px;padding:3px 6px;font-size:13px}
  .srail-hd .col:hover{background:var(--surface2);color:var(--text)}
  .srail-sec{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;padding:5px 12px 4px}
  .srail-sec .persist{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--ok);font-size:8.5px}
  .slist{flex:1;overflow-y:auto;padding:2px 8px;display:flex;flex-direction:column;gap:4px}
  .scard{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 9px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;transition:border-color .12s,background .12s;position:relative}
  .scard:hover{border-color:var(--line2);background:var(--surface2)}
  .scard[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .scard .s1{display:flex;align-items:center;gap:7px}
  .scard .frente{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .scard .s2{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .scard .s2 .arn{color:var(--accent);opacity:.9}
  .scard .s3{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;color:var(--muted)}
  .scard .sview{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .scard[aria-current="true"] .sview{background:var(--surface)}
  .scard .await-lbl{font-size:9.5px;font-weight:700;color:var(--warn)}
  .scard .xs{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:5px;color:var(--muted);font-size:11px;display:none;align-items:center;justify-content:center}
  .scard:hover .xs{display:flex} .scard .xs:hover{background:var(--line);color:var(--text)}
  .scard .ren{flex:none;width:15px;height:15px;border-radius:4px;color:var(--muted);font-size:10px;display:none;align-items:center;justify-content:center}
  .scard:hover .ren{display:flex} .scard .ren:hover{background:var(--line);color:var(--text)}
  .renin{flex:1;min-width:0;font:inherit;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--accent);border-radius:5px;padding:1px 5px;color:var(--text)}
  .srail-ft{flex:none;border-top:1px solid var(--line);padding:7px 8px;display:flex;flex-direction:column;gap:3px}
  .newses{display:flex;align-items:center;justify-content:center;gap:7px;border:1px dashed var(--line2);border-radius:8px;padding:8px;color:var(--muted);font-size:12px;font-weight:600}
  .newses:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .globrow{display:flex;gap:2px}
  .globrow button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:7px;color:var(--muted);font-size:8.5px}
  .globrow button:hover{background:var(--surface2);color:var(--text)}
  .globrow button .ico{font-size:14px}

  /* colapsado → gutter */
  .srail.col{width:52px}
  .srail.col .wm,.srail.col .att,.srail.col .srail-sec,.srail.col .frente,.srail.col .s2,.srail.col .s3,.srail.col .xs,.srail.col .ren,.srail.col .newses span,.srail.col .globrow button span:not(.ico){display:none}
  .srail.col .srail-hd{flex-direction:column;gap:6px;padding:10px 0 6px}
  .srail.col .srail-hd .col{margin:0}
  .srail.col .slist{align-items:center;padding:4px 0}
  .srail.col .scard{width:38px;padding:7px 0;align-items:center;gap:0;border-radius:10px}
  .srail.col .scard .s1{gap:0;flex-direction:column}
  .srail.col .scard[aria-current="true"]{box-shadow:none}
  .srail.col .globrow{flex-direction:column;gap:2px}
  .srail.col .globrow button .ico{font-size:15px}
  .srail.col .newses{padding:8px 0}

  /* slim view strip (por sesión) */
  .vstrip{flex:none;width:46px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:3px;z-index:5}
  .vstrip .vi{width:38px;padding:6px 0;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:7.5px;line-height:1}
  .vstrip .vi .ico{font-size:14px}
  .vstrip .vi:hover{background:var(--surface2);color:var(--text)}
  .vstrip .vi[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .topbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 15px;border-bottom:1px solid var(--line);background:var(--surface);min-height:44px}
  .crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
  .crumb .sepc{color:var(--muted)} .crumb b{font-weight:600}
  .crumb .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 9px;background:var(--surface2);font-family:var(--mono);font-size:11.5px}
  .crumb .frentetag{font-size:11px;color:var(--muted)}
  .parked{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:6px;padding:3px 8px}
  .ask{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;background:var(--accent-soft)}
  .ask kbd{font-family:var(--mono);font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.8}
  .app.chat-on .ask{background:var(--surface2);border-color:var(--line);color:var(--muted)}

  .body{flex:1;min-height:0;display:flex}
  .stage{flex:1;min-width:0;overflow:auto;background:var(--bg)}
  .dock{flex:none;width:0;overflow:hidden;border-left:1px solid var(--line);transition:width .18s;background:var(--surface)}
  .app.chat-on .dock{width:360px}

  /* Workspace */
  .ws{padding:14px 18px;display:flex;flex-direction:column;gap:12px;max-width:1000px}
  .ws-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ws-hd .big{font-family:var(--mono);font-size:16px;font-weight:700}
  .ws-hd .meta{font-size:11px;color:var(--muted)}
  .ws-hd .st{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;border-radius:99px;padding:3px 10px}
  .st-streaming{background:var(--live-soft);color:var(--live)} .st-await{background:var(--warn-soft);color:var(--warn)} .st-idle{background:var(--surface2);color:var(--muted)}
  .ws-note{font-size:11px;color:var(--muted)}
  .mm{display:flex;flex-direction:column;gap:9px}
  .mband{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 10px}
  .mband h4{margin:0 0 6px;font-size:11px;color:var(--muted);font-weight:600}
  .mrow{display:flex;gap:7px;flex-wrap:wrap}
  .mlanes{display:flex;gap:9px}
  .mlane{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px}
  .mlane .lh{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .mnode{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-left:3px solid var(--tc,var(--line));border-radius:7px;background:var(--surface2);margin-bottom:6px}
  .mnode:last-child{margin-bottom:0}
  .mnode .mg{width:11px;height:11px;border-radius:3px;background:var(--tc);flex:none}
  .mnode .mn{font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mnode.foc{outline:2px solid var(--accent);outline-offset:1px}

  /* Chat dock (invocado · colapsable) */
  .chat{display:flex;flex-direction:column;height:100%;min-height:0}
  .chat-hd{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .chat-hd .t{font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px;min-width:0}
  .chat-hd .t .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-hd .x{margin-left:auto;color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .chat-hd .x:hover{background:var(--surface2);color:var(--text)}
  .ses{flex:none;display:flex;align-items:center;gap:7px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface2);font-family:var(--mono);font-size:9.5px;color:var(--muted);flex-wrap:wrap}
  .ses .sid{color:var(--accent)}
  .ctxbar{width:44px;height:5px;border-radius:99px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
  .ctxbar i{display:block;height:100%;background:var(--accent)}
  .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
  .msg{max-width:92%;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.5}
  .msg.u{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--accent);border-bottom-right-radius:3px}
  .msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.sys{align-self:center;font-family:var(--mono);font-size:9.5px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line2);border-radius:7px;padding:3px 8px}
  .msg.a.awaiting{border-color:var(--warn);background:var(--warn-soft)}
  .typing{display:inline-flex;gap:3px;align-items:center}
  .typing i{width:5px;height:5px;border-radius:99px;background:var(--live);animation:pulse 1s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  .composer{flex:none;padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
  .composer .box{flex:1;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:8px 10px;font-size:12px;color:var(--muted);min-height:36px}
  .composer .send{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:12.5px;padding:9px 15px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:80vw}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="lab">
  <span class="tag">SHELL A · MULTISESIÓN · it.14</span>
  <span><b>P1 Session Rail</b> + colapsa a gutter · chat <b>invocado</b> colapsable · sesiones <b>persisten</b> · sesión = frente (<b>N:1</b> arnés).</span>
  <span class="sp"></span>
  <button id="fire">⚡ Simular «CC te necesita»</button>
  <button id="theme">◐ Tema</button>
</div>

<div class="app" id="app"></div>
<div id="toast"></div>

<script>
/* ═════════ modelo: sesión = frente de trabajo (N:1 con arnés) ═════════ */
const VIEWS=[["Mapa","⬡"],["Diag","⚠"],["Corridas","▤"],["Tren","⇢"],["Hist","◷"]];
const SESSIONS=[
  {id:"s1",arn:"luana-platform",frente:"timeout de contract-guard",empresa:"Luana",puesto:"Plataforma · Desarrollo",health:"crit",
   status:"streaming",view:"Mapa",parked:"nodo contract-guard",foc:"contract-guard",sid:"sess_a71c",model:"Opus 4.8",ctx:18,
   conv:[["u","Sube el timeout de <b>contract-guard</b> a 60s y registra la excepción."],
         ["sys","skill_activated · edición-de-caja · nodo=contract-guard"],
         ["a","Aplicando el cambio a <b>contract-guard.hook</b> — quedará en beta → tren…","typing"]]},
  {id:"s5",arn:"luana-platform",frente:"poda de skills frías",empresa:"Luana",puesto:"Plataforma · Desarrollo",health:"crit",
   status:"idle",view:"Diag",parked:"22 skills frías",foc:null,sid:"sess_b830",model:"Opus 4.8",ctx:31,
   conv:[["u","De 58 skills solo 13 se usaron en 30d. Propón un plan de poda / lazy-load."],
         ["a","Listo el análisis: 22 propias frías + 7 marcas dormidas + 12 Clerk. Sugiero lazy-load para Clerk y retiro de 2 UX deprecadas. ¿Reviso el detalle en Diagnóstico?"],
         ["sys","2º frente sobre luana-platform · misma geografía, otra conversación CC"]]},
  {id:"s2",arn:"ux-nordia",frente:"eval-gate de po-ux",empresa:"Nordia",puesto:"Diseño · UX",health:"warn",
   status:"await",view:"Diag",parked:"hallazgo éxito 87%",foc:"po-ux",sid:"sess_44e0",model:"Opus 4.8",ctx:42,
   conv:[["u","El hallazgo dice éxito 87%. Ajusta el eval-gate de <b>po-ux</b> al umbral correcto."],
         ["a","Para fijar el gate necesito tu decisión: ¿el umbral objetivo de éxito es <b>90%</b> (estándar F1) o <b>85%</b>? De ahí depende si po-ux queda en verde o atención.","await"]]},
  {id:"s3",arn:"backend-nordia",frente:"corrida r3 · 3 hallazgos",empresa:"Nordia",puesto:"Backend",health:"crit",
   status:"idle",view:"Corridas",parked:"corrida r3",foc:"gate-runner",sid:"sess_9b12",model:"Opus 4.8",ctx:63,
   conv:[["u","Revisa la corrida r3, tiene salto de fase."],
         ["a","Listo. 3 hallazgos en Diagnóstico: salto Specs⇢Desarrollo sin gate, gate-runner sin criterio de éxito, p95 alto en 2 endpoints."],
         ["sys","3 hallazgos → Diagnóstico · sesión en pausa"]]},
];
const HCOL={ok:"h-ok",warn:"h-warn",crit:"h-crit",info:"h-info"};
const HLBL={ok:"sano",warn:"atención",crit:"señales incompletas",info:"naciendo"};
const STLBL={streaming:"generando…",await:"te necesita",idle:"en pausa"};

const S={active:"s1",chat:false,railCol:false};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ses=id=>SESSIONS.find(s=>s.id===id), activeSes=()=>ses(S.active);
const attention=()=>SESSIONS.filter(s=>s.status==="await").length;
const vico=v=>(VIEWS.find(x=>x[0]===v)||["","•"])[1];
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2800);}

/* cuántos frentes por arnés (para mostrar N:1) */
const arnCount=arn=>SESSIONS.filter(s=>s.arn===arn).length;

function railHTML(){
  const cards=SESSIONS.map(s=>{
    const multi=arnCount(s.arn)>1;
    return `<div class="scard" role="button" tabindex="0" data-ses="${s.id}" aria-current="${S.active===s.id}" title="${s.arn} · ${s.frente}">
      <span class="xs" data-close="${s.id}" title="Cerrar sesión">✕</span>
      <div class="s1"><span class="pip ${s.status}"></span><span class="frente">${s.frente}</span><button class="ren" data-ren="${s.id}" title="Renombrar frente (auto-derivado del 1er mensaje, editable)">✎</button></div>
      <div class="s2"><span class="arn">${s.arn}</span>${multi?'<span title="este arnés tiene 2 frentes abiertos">·2 frentes</span>':''}<span class="hdot ${HCOL[s.health]}"></span></div>
      <div class="s3"><span class="sview">${vico(s.view)} ${s.view}</span>${s.status==='await'?'<span class="await-lbl">◐ te necesita</span>':`<span>${s.parked}</span>`}</div>
    </div>`;}).join("");
  return `<div class="srail ${S.railCol?'col':''}">
    <div class="srail-hd">
      <div class="brand">A</div>${S.railCol?'':'<span class="wm">ArnesIA</span>'}
      ${attention()&&!S.railCol?`<span class="att">${attention()} ◐</span>`:''}
      <button class="col" id="railcol" title="${S.railCol?'Expandir rail':'Colapsar a gutter'}">${S.railCol?'»':'«'}</button>
    </div>
    <div class="srail-sec">Sesiones<span class="persist">⭯ persisten</span></div>
    <div class="slist">${cards}</div>
    <div class="srail-ft">
      <button class="newses" data-toast="Nueva sesión: elige un arnés. El nombre del frente se auto-deriva del primer mensaje y lo puedes editar (✎). Puedes abrir 2+ frentes sobre el mismo arnés — sin límite.">＋ <span>Nueva sesión</span></button>
      <div class="globrow">
        <button data-toast="Portafolio · organigrama"><span class="ico">⌂</span><span>Portafolio</span></button>
        <button data-toast="Estándar as code"><span class="ico">⟳</span><span>Estándar</span></button>
        <button data-toast="Ajustes · Marketplaces"><span class="ico">⚙</span><span>Ajustes</span></button>
      </div>
    </div>
  </div>`;
}
function workspaceHTML(s){
  const lanes=[["Intake",[["pm-luana","skill"],["po-ux","skill"]]],
               ["Desarrollo",[["dev-team","skill"],["gate-runner","agent"]]],
               ["Calidad",[["auditor","skill"],["contract-guard","hook"]]]];
  const laneH=lanes.map(([nm,ns])=>`<div class="mlane"><div class="lh">${nm}</div>${
    ns.map(([n,ty])=>`<div class="mnode ${s.foc===n?'foc':''}" style="--tc:var(--c-${ty})"><span class="mg"></span><span class="mn">${n}</span></div>`).join("")
  }</div>`).join("");
  return `<div class="ws">
    <div class="ws-hd">
      <span class="big">${s.arn}</span>
      <span class="st st-${s.status}"><span class="pip ${s.status}"></span>${STLBL[s.status]}</span>
      <span class="meta">${s.empresa} · ${s.puesto} · <span class="hdot ${HCOL[s.health]}" style="display:inline-block;vertical-align:middle"></span> ${HLBL[s.health]}</span>
    </div>
    <div class="ws-note">Frente <b style="color:var(--text)">«${s.frente}»</b> · vista <b style="color:var(--text)">${s.view}</b> · quedaste en <code>${s.parked}</code>. Al volver a esta sesión (o reabrir la app) aterrizas aquí — arnés + vista + selección + conversación restaurados.</div>
    <div class="mm">
      <div class="mband"><h4>Guardia (hooks)</h4><div class="mrow">
        <div class="mnode ${s.foc==='contract-guard'?'foc':''}" style="--tc:var(--c-hook)"><span class="mg"></span><span class="mn">contract-guard</span></div>
        <div class="mnode" style="--tc:var(--c-hook)"><span class="mg"></span><span class="mn">telemetry-emit</span></div>
      </div></div>
      <div class="mlanes">${laneH}</div>
      <div class="mband"><h4>Base (siempre en contexto)</h4><div class="mrow">
        <div class="mnode" style="--tc:var(--c-rule)"><span class="mg"></span><span class="mn">CLAUDE.md</span></div>
        <div class="mnode" style="--tc:var(--c-know)"><span class="mg"></span><span class="mn">project.config</span></div>
      </div></div>
    </div>
  </div>`;
}
function chatHTML(s){
  const msgs=s.conv.map(([who,txt,flag])=>{
    if(who==="sys")return `<div class="msg sys">${txt}</div>`;
    if(flag==="typing")return `<div class="msg a">${txt} <span class="typing"><i></i><i></i><i></i></span></div>`;
    if(flag==="await")return `<div class="msg a awaiting">${txt}</div>`;
    return `<div class="msg ${who}">${txt}</div>`;
  }).join("");
  return `<div class="chat">
    <div class="chat-hd"><span class="t"><span class="pip ${s.status}"></span><span class="ttl">${s.frente}</span></span>
      <button class="x" data-chatclose title="Colapsar el dock (⌘K para reabrir)">⟩ colapsar</button></div>
    <div class="ses"><span class="sid">◍ ${s.sid}</span><span>· ${s.arn}</span><span>· ${s.model}</span><span>· ctx</span><span class="ctxbar"><i style="width:${s.ctx}%"></i></span><span>${s.ctx}%</span></div>
    <div class="msgs">${msgs}</div>
    <div class="composer"><div class="box">Pídele un cambio a ${s.arn}…</div><button class="send" data-toast="Claude Code headless detrás · esta conversación ES la sesión CC del frente «${s.frente}».">↑</button></div>
  </div>`;
}
function shell(){
  const s=activeSes();
  const vs=VIEWS.map(([v,ic])=>`<button class="vi" data-view="${v}" aria-pressed="${s.view===v}" title="${v}"><span class="ico">${ic}</span>${v}</button>`).join("");
  const multi=arnCount(s.arn)>1;
  return railHTML()+`<div class="vstrip">${vs}</div>
  <div class="main">
    <div class="topbar">
      <div class="crumb"><span style="color:var(--muted)">${s.empresa}</span><span class="sepc">/</span><span class="pill">${s.arn} ▾</span>${multi?`<span class="frentetag">· frente «${s.frente}»</span>`:''}<span class="sepc">/</span><b>${s.view}</b></div>
      <span class="parked">quedaste en: ${s.parked}</span>
      <button class="ask" id="ask"><span>✦</span>${S.chat?'Conversando':'Conversar'} <kbd>⌘K</kbd></button>
    </div>
    <div class="body"><div class="stage">${workspaceHTML(s)}</div>
      <aside class="dock">${S.chat?chatHTML(s):''}</aside></div>
  </div>`;
}

const app=$("#app");
function render(){
  app.className="app"+(S.chat?" chat-on":"");
  app.innerHTML=shell();
  wire();
}
function switchSession(id){S.active=id;const s=ses(id);
  toast(s.status==='await'?'Entraste a «'+s.frente+'» — CC esperaba tu respuesta.':'Sesión «'+s.frente+'» ('+s.arn+') — contexto y conversación restaurados.');
  render();}
function closeSession(id){const i=SESSIONS.findIndex(s=>s.id===id);if(i<0||SESSIONS.length<=1)return;
  const wasActive=S.active===id;SESSIONS.splice(i,1);
  if(wasActive)S.active=SESSIONS[Math.max(0,i-1)].id;
  toast('Sesión cerrada.');render();}
function setView(v){activeSes().view=v;render();}
function startRename(id){
  const card=$(`.scard[data-ses="${id}"]`,app);if(!card)return;
  const span=card.querySelector('.frente');if(!span)return;
  const inp=document.createElement('input');inp.className='renin';inp.value=ses(id).frente;
  span.replaceWith(inp);inp.focus();inp.select();
  let done=false;
  const commit=()=>{if(done)return;done=true;const v=inp.value.trim();if(v){ses(id).frente=v;render();toast('Frente renombrado a «'+v+'».');}else render();};
  inp.addEventListener('keydown',e=>{e.stopPropagation();
    if(e.key==='Enter'){e.preventDefault();commit();}
    else if(e.key==='Escape'){done=true;render();}});
  inp.addEventListener('blur',commit);
  inp.addEventListener('click',e=>e.stopPropagation());
}
function wire(){
  $$('[data-ses]',app).forEach(b=>{
    b.onclick=e=>{if(e.target.dataset.close||e.target.dataset.ren)return;switchSession(b.dataset.ses);};
    b.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===b){e.preventDefault();switchSession(b.dataset.ses);}};
  });
  $$('[data-ren]',app).forEach(b=>b.onclick=e=>{e.stopPropagation();startRename(b.dataset.ren);});
  $$('[data-close]',app).forEach(b=>b.onclick=e=>{e.stopPropagation();closeSession(b.dataset.close);});
  $$('[data-view]',app).forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $$('[data-toast]',app).forEach(b=>b.onclick=e=>{e.stopPropagation();toast(b.dataset.toast);});
  $("#railcol").onclick=()=>{S.railCol=!S.railCol;render();toast(S.railCol?'Rail colapsado a gutter — más ancho de mapa.':'Rail expandido.');};
  const ask=$("#ask");if(ask)ask.onclick=()=>{S.chat=!S.chat;render();};
  const x=$('[data-chatclose]',app);if(x)x.onclick=()=>{S.chat=false;render();};
}
$("#theme").onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);toast('Tema: '+next);};
$("#fire").onclick=()=>{
  const cand=SESSIONS.find(s=>s.status!=='await'&&s.id!==S.active);
  if(!cand){toast('Todas las sesiones ya te esperan o están activas.');return;}
  cand.status='await';cand.conv.push(["a","Terminé el borrador pero necesito tu OK antes de mandarlo a beta. ¿Confirmas?","await"]);
  toast('◐ «'+cand.frente+'» ('+cand.arn+') terminó en background y ahora te necesita.');render();};
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.chat=!S.chat;render();}});
render();
/* persistencia: al abrir la app, las sesiones se restauran donde quedaron */
setTimeout(()=>toast('⭯ '+SESSIONS.length+' sesiones restauradas — reabres donde quedaste.'),400);
</script>
