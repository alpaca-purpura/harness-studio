<!DOCTYPE html>
<title>ArnesIA · Session Lab (multisesión)</title>
<style>
  :root{
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#e9edf2; --line:#d5dbe3; --line2:#c3cbd6;
    --text:#212832; --muted:#5d6a79; --accent:#a8742c; --accent-soft:rgba(168,116,44,.14);
    --c-skill:#2f74b5; --c-agent:#7455c2; --c-hook:#bb4c85; --c-know:#20826f; --c-mcp:#586c80; --c-rule:#7a7a24;
    --ok:#2e8f5e; --warn:#c96a2e; --crit:#c94545;
    --ok-soft:rgba(46,143,94,.13); --warn-soft:rgba(201,106,46,.13); --crit-soft:rgba(201,69,69,.12);
    --heat:rgba(205,105,55,.30);
    --live:#2f74b5; --live-soft:rgba(47,116,181,.14);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --surface:#1b2027; --surface2:#242b34; --line:#2d3743; --line2:#3a4655;
      --text:#e8ecf1; --muted:#94a1af; --accent:#d9a35b; --accent-soft:rgba(217,163,91,.14);
      --c-skill:#5b9dd9; --c-agent:#9b7fd4; --c-hook:#d46a9e; --c-know:#4fb3a1; --c-mcp:#8195a9; --c-rule:#b5b558;
      --ok:#57b380; --warn:#e0904f; --crit:#e25b5b;
      --ok-soft:rgba(87,179,128,.14); --warn-soft:rgba(224,144,79,.14); --crit-soft:rgba(226,91,91,.13);
      --heat:rgba(226,110,70,.30); --live:#5b9dd9; --live-soft:rgba(91,157,217,.16);
    }
  }
  :root[data-theme="light"]{
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#e9edf2; --line:#d5dbe3; --line2:#c3cbd6;
    --text:#212832; --muted:#5d6a79; --accent:#a8742c; --accent-soft:rgba(168,116,44,.14);
    --ok:#2e8f5e; --warn:#c96a2e; --crit:#c94545;
    --ok-soft:rgba(46,143,94,.13); --warn-soft:rgba(201,106,46,.13); --crit-soft:rgba(201,69,69,.12);
    --live:#2f74b5; --live-soft:rgba(47,116,181,.14);
  }
  :root[data-theme="dark"]{
    --bg:#14171c; --surface:#1b2027; --surface2:#242b34; --line:#2d3743; --line2:#3a4655;
    --text:#e8ecf1; --muted:#94a1af; --accent:#d9a35b; --accent-soft:rgba(217,163,91,.14);
    --ok:#57b380; --warn:#e0904f; --crit:#e25b5b;
    --ok-soft:rgba(87,179,128,.14); --warn-soft:rgba(224,144,79,.14); --crit-soft:rgba(226,91,91,.13);
    --heat:rgba(226,110,70,.30); --live:#5b9dd9; --live-soft:rgba(91,157,217,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  code,.mono{font-family:var(--mono)}

  /* ══ LAB chrome (marco, NO parte del producto) ══ */
  .lab{flex:none;height:46px;display:flex;align-items:center;gap:13px;padding:0 14px;background:var(--surface2);border-bottom:1px solid var(--line2);position:relative;z-index:60}
  .lab-tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.13em;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:3px 7px;white-space:nowrap}
  .lab-tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
  .lab-tabs button{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .lab-tabs button .k{font-family:var(--mono);font-size:10px;font-weight:700;width:16px;height:16px;display:grid;place-items:center;border-radius:4px;background:var(--surface2);color:var(--muted)}
  .lab-tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text);font-weight:600}
  .lab-tabs button[aria-pressed="true"] .k{background:var(--accent);color:#fff}
  .lab-tabs button:hover:not([aria-pressed="true"]){background:var(--surface2)}
  .lab-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .lab-btn{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--muted);background:var(--surface)}
  .lab-btn:hover{color:var(--text);border-color:var(--line2)}
  .lab-desc{flex:none;padding:7px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:baseline;z-index:55}
  .lab-desc b{color:var(--text);font-weight:600}
  .lab-desc .trade{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}

  .app{flex:1;min-height:0;display:flex;position:relative}

  /* ══ estados de sesión (el corazón de multisesión) ══ */
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  @keyframes ring{0%{box-shadow:0 0 0 0 var(--live-soft)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .pip{width:8px;height:8px;border-radius:99px;flex:none;position:relative}
  .pip.streaming{background:var(--live);animation:pulse 1.1s ease-in-out infinite}
  .pip.await{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
  .pip.idle{background:var(--muted);opacity:.55}
  .hdot{width:7px;height:7px;border-radius:99px;flex:none}
  .h-ok{background:var(--ok)} .h-warn{background:var(--warn)} .h-crit{background:var(--crit)} .h-info{background:var(--accent)}

  /* Command Rail base (compartido) */
  .rail{flex:none;width:64px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;z-index:6}
  .rail .brand{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;margin-bottom:8px}
  .rail .ri{width:50px;padding:7px 0;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:8.5px;line-height:1.1}
  .rail .ri .ico{font-size:16px}
  .rail .ri:hover{background:var(--surface2);color:var(--text)}
  .rail .ri[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
  .rail .sp{flex:1}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .topbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 15px;border-bottom:1px solid var(--line);background:var(--surface);min-height:44px}
  .crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
  .crumb .sepc{color:var(--muted)} .crumb b{font-weight:600}
  .crumb .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 9px;background:var(--surface2);font-family:var(--mono);font-size:11.5px}
  .parked{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:6px;padding:3px 8px}
  .ask{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;background:var(--accent-soft)}
  .ask kbd{font-family:var(--mono);font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.8}

  .body{flex:1;min-height:0;display:flex}
  .stage{flex:1;min-width:0;overflow:auto;background:var(--bg)}

  /* view tabs horizontales (P2/P4) */
  .viewtabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px}
  .viewtabs button{padding:5px 11px;border-radius:6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .viewtabs button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .viewtabs .vico{font-size:12px}

  /* slim view strip (P1) */
  .vstrip{flex:none;width:46px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:3px;z-index:5}
  .vstrip .vi{width:38px;padding:6px 0;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:7.5px;line-height:1}
  .vstrip .vi .ico{font-size:14px}
  .vstrip .vi:hover{background:var(--surface2);color:var(--text)}
  .vstrip .vi[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

  /* ══ P1 · Session Rail (WARP fiel, ancho) ══ */
  .srail{flex:none;width:214px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:6}
  .srail-hd{flex:none;display:flex;align-items:center;gap:8px;padding:11px 12px 9px}
  .srail-hd .brand{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
  .srail-hd .wm{font-weight:700;font-size:13px;letter-spacing:-.01em}
  .srail-hd .att{margin-left:auto;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn);border-radius:99px;padding:2px 7px}
  .srail-sec{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:6px 13px 4px}
  .slist{flex:1;overflow-y:auto;padding:2px 8px;display:flex;flex-direction:column;gap:4px}
  .scard{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 9px;display:flex;flex-direction:column;gap:5px;text-align:left;cursor:pointer;transition:border-color .12s,background .12s;position:relative}
  .scard:hover{border-color:var(--line2);background:var(--surface2)}
  .scard[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .scard .s1{display:flex;align-items:center;gap:7px}
  .scard .snm{font-family:var(--mono);font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .scard .sco{font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .scard .sctx{font-family:var(--mono);font-size:9px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .scard .sview{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
  .scard[aria-current="true"] .sview{background:var(--surface)}
  .scard .await-lbl{font-size:9.5px;font-weight:700;color:var(--warn)}
  .srail-ft{flex:none;border-top:1px solid var(--line);padding:7px 8px;display:flex;flex-direction:column;gap:3px}
  .newses{display:flex;align-items:center;justify-content:center;gap:7px;border:1px dashed var(--line2);border-radius:8px;padding:8px;color:var(--muted);font-size:12px;font-weight:600}
  .newses:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .globrow{display:flex;gap:2px}
  .globrow button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:7px;color:var(--muted);font-size:8.5px}
  .globrow button:hover{background:var(--surface2);color:var(--text)}
  .globrow button .ico{font-size:14px}

  /* ══ P2 · mini-rail avatares (sesiones compactas) ══ */
  .mrail{flex:none;width:60px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:9px 0;z-index:7}
  .mrail .brand{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;margin-bottom:8px}
  .mrail-sec{font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
  .savatars{display:flex;flex-direction:column;gap:8px;align-items:center;flex:1;overflow-y:auto;width:100%;padding:2px 0}
  .savatar{position:relative;width:40px;height:40px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;transition:.12s}
  .savatar:hover{border-color:var(--line2);color:var(--text)}
  .savatar[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:13px}
  .savatar .ph{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:99px;border:2px solid var(--surface)}
  .savatar .pp{position:absolute;bottom:-3px;right:-3px;border:2px solid var(--surface);border-radius:99px}
  .savatar[aria-current="true"]::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:2px;background:var(--accent)}
  .mnew{width:40px;height:40px;border-radius:11px;border:1px dashed var(--line2);color:var(--muted);font-size:18px;display:grid;place-items:center;margin-top:2px}
  .mnew:hover{color:var(--accent);border-color:var(--accent)}
  .mrail .sp{flex:0 0 auto;height:6px}
  .mglob{display:flex;flex-direction:column;gap:3px;align-items:center;padding-top:6px;border-top:1px solid var(--line);width:44px}
  .mglob button{width:40px;padding:6px 0;border-radius:8px;color:var(--muted);font-size:15px;display:grid;place-items:center}
  .mglob button:hover{background:var(--surface2);color:var(--text)}
  /* flyout hover */
  .savatar .fly{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.22);width:180px;display:none;z-index:40;flex-direction:column;gap:4px;text-align:left;cursor:default}
  .savatar:hover .fly{display:flex}
  .fly .fnm{font-family:var(--mono);font-size:11.5px;font-weight:650}
  .fly .fco{font-size:9.5px;color:var(--muted)}
  .fly .fst{font-size:10px;display:flex;align-items:center;gap:6px;margin-top:2px}

  /* ══ P3 · Conversation Cockpit (conversación persistente) ══ */
  .convcol{flex:none;width:360px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;z-index:4}
  .app.p3 .srail{width:190px}

  /* ══ P4 · gutter colapsado ══ */
  .gutter{flex:none;width:30px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:9px;z-index:8;transition:width .14s;overflow:hidden}
  .gutter:hover{width:210px;box-shadow:6px 0 20px rgba(0,0,0,.12)}
  .gutter .brand{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center;flex:none}
  .gutter .gsec{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.08em;width:100%;padding:0 9px;opacity:0;transition:opacity .1s;white-space:nowrap}
  .gutter:hover .gsec{opacity:1}
  .grow{display:flex;align-items:center;gap:9px;width:100%;padding:0 8px;cursor:pointer;min-height:24px}
  .grow .gpips{display:flex;align-items:center;gap:3px;flex:none;width:14px;justify-content:center}
  .grow .gtext{display:flex;flex-direction:column;gap:1px;opacity:0;transition:opacity .1s;white-space:nowrap;overflow:hidden}
  .gutter:hover .grow .gtext{opacity:1}
  .grow .gnm{font-family:var(--mono);font-size:11px;font-weight:600}
  .grow .gk{font-family:var(--mono);font-size:8.5px;color:var(--muted)}
  .grow[aria-current="true"]{background:var(--accent-soft);border-radius:7px}
  .grow[aria-current="true"] .gnm{color:var(--accent)}
  .gutter .sp{flex:1}

  /* ══ Workspace (contenido de la sesión activa — igual en los 4) ══ */
  .ws{padding:14px 18px;display:flex;flex-direction:column;gap:12px;max-width:1000px}
  .ws-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ws-hd .big{font-family:var(--mono);font-size:16px;font-weight:700}
  .ws-hd .meta{font-size:11px;color:var(--muted)}
  .ws-hd .st{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;border-radius:99px;padding:3px 10px}
  .st-stream{background:var(--live-soft);color:var(--live)} .st-await{background:var(--warn-soft);color:var(--warn)} .st-idle{background:var(--surface2);color:var(--muted)}
  /* mini mapa */
  .mm{display:flex;flex-direction:column;gap:9px}
  .mband{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 10px}
  .mband h4{margin:0 0 6px;font-size:11px;color:var(--muted);font-weight:600}
  .mrow{display:flex;gap:7px;flex-wrap:wrap}
  .mlanes{display:flex;gap:9px}
  .mlane{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px}
  .mlane .lh{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .mnode{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-left:3px solid var(--tc,var(--line));border-radius:7px;background:var(--surface2);margin-bottom:6px}
  .mnode:last-child{margin-bottom:0}
  .mnode .mg{width:11px;height:11px;border-radius:3px;background:var(--tc);flex:none}
  .mnode .mn{font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mnode.foc{outline:2px solid var(--accent);outline-offset:1px}

  /* ══ Chat (dock invocado P1/P2/P4 · columna P3) ══ */
  .dock{flex:none;width:0;overflow:hidden;border-left:1px solid var(--line);transition:width .18s;background:var(--surface)}
  .app.chat-on .dock{width:360px}
  .chat{display:flex;flex-direction:column;height:100%;min-height:0}
  .chat-hd{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .chat-hd .t{font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px}
  .chat-hd .x{margin-left:auto;color:var(--muted);border-radius:6px;padding:3px 7px}
  .chat-hd .x:hover{background:var(--surface2);color:var(--text)}
  .ses{flex:none;display:flex;align-items:center;gap:7px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface2);font-family:var(--mono);font-size:9.5px;color:var(--muted);flex-wrap:wrap}
  .ses .sid{color:var(--accent)}
  .ctxbar{width:44px;height:5px;border-radius:99px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
  .ctxbar i{display:block;height:100%;background:var(--accent)}
  .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
  .msg{max-width:92%;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.5}
  .msg.u{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--accent);border-bottom-right-radius:3px}
  .msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.sys{align-self:center;font-family:var(--mono);font-size:9.5px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line2);border-radius:7px;padding:3px 8px}
  .msg.a.awaiting{border-color:var(--warn);background:var(--warn-soft)}
  .typing{display:inline-flex;gap:3px;align-items:center}
  .typing i{width:5px;height:5px;border-radius:99px;background:var(--live);animation:pulse 1s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  .composer{flex:none;padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
  .composer .box{flex:1;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:8px 10px;font-size:12px;color:var(--muted);min-height:36px}
  .composer .send{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}

  /* command palette (P4 ⌘K quick-switch) */
  .palette{position:fixed;inset:0;background:rgba(0,0,0,.34);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:120}
  .palette.on{display:flex}
  .pal{width:min(520px,92vw);background:var(--surface);border:1px solid var(--line2);border-radius:13px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}
  .pal .pin{padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .pal .plist{max-height:52vh;overflow:auto;padding:6px}
  .pal .pitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer}
  .pal .pitem:hover,.pal .pitem.sel{background:var(--accent-soft)}
  .pal .pk{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .pal .pnm{font-family:var(--mono);font-size:12px;font-weight:600}
  .pal .pco{font-size:10px;color:var(--muted)}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);font-size:12.5px;padding:9px 15px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:80vw}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="lab">
  <span class="lab-tag">SESSION LAB · MULTISESIÓN</span>
  <div class="lab-tabs" id="labtabs"></div>
  <div class="lab-right">
    <button class="lab-btn" id="fire">⚡ Simular «CC te necesita»</button>

  </div>
</div>
<div class="lab-desc" id="labdesc"></div>

<div class="app" id="app">
  <!-- render dinámico por paradigma -->
</div>

<div class="palette" id="palette"><div class="pal">
  <div class="pin">Cambiar de sesión… <span style="float:right;font-family:var(--mono);font-size:11px">↑↓ · ⏎ · esc</span></div>
  <div class="plist" id="pallist"></div>
</div></div>

<div id="toast"></div>

<script>
/* ═════════ paradigmas ═════════ */
const PARADIGMS=[
  {k:"P1",name:"Session Rail",tag:"WARP fiel",
   desc:"Rail izquierdo <b>ancho</b> = pila de sesiones (nombre·empresa·salud·estado CC vivo·dónde quedó). Vistas del arnés activo = tira slim de iconos. Chat = dock invocado ⌘K, atado a la sesión activa.",
   trade:"cuesta ~214px · máx contexto por sesión"},
  {k:"P2",name:"Dual-Zone Rail",tag:"síntesis · 1 rail",
   desc:"Un solo rail 60px: <b>arriba</b> = sesiones como avatares (inicial + anillo salud + pip vivo, flyout al hover); <b>abajo</b> = global (⌂ ⟳ ⚙). Las <b>vistas</b> bajan a pestañas horizontales en la topbar. El rail deja de ser «vistas» y pasa a ser «sesiones».",
   trade:"solo 60px · nombres ocultos hasta hover"},
  {k:"P3",name:"Conversation Cockpit",tag:"WARP en espíritu",
   desc:"Rail de sesiones izq + <b>conversación persistente derecha</b> atada a la sesión activa (no invocada) + visual al centro. Cambiar de pestaña conmuta centro y conversación juntos — trabajas como en WARP: pestaña izq, hablas der, mapa de referencia.",
   trade:"la conversación siempre visible · menos ancho de mapa"},
  {k:"P4",name:"Spaces + Quick-Switch",tag:"mínimo · power-user",
   desc:"Gutter <b>colapsado</b> (solo pips de salud/estado) que se expande al hover; <b>⌘1–9</b> y <b>⌘K</b> saltan de sesión. Máxima superficie para el visual. Chat = dock invocado.",
   trade:"máx mapa · menos descubrible (teclado)"},
];

/* ═════════ datos: sesiones abiertas (arnés + conversación + vista + estado CC) ═════════
   status: streaming (CC trabajando) · await (CC te necesita — la joya del paralelo) · idle */
const VIEWS=[["Mapa","⬡"],["Diag","⚠"],["Corridas","▤"],["Tren","⇢"],["Hist","◷"]];
const SESSIONS=[
  {id:"s1",arn:"luana-platform",empresa:"Luana",puesto:"Plataforma · Desarrollo",health:"crit",
   status:"streaming",view:"Mapa",parked:"nodo contract-guard",foc:"contract-guard",
   sid:"sess_a71c",model:"Opus 4.8",ctx:18,
   conv:[["u","Sube el timeout de <b>contract-guard</b> a 60s y registra la excepción."],
         ["sys","skill_activated · edición-de-caja · nodo=contract-guard"],
         ["a","Aplicando el cambio a <b>contract-guard.hook</b> — quedará en beta → tren…","typing"]]},
  {id:"s2",arn:"ux-nordia",empresa:"Nordia",puesto:"Diseño · UX",health:"warn",
   status:"await",view:"Diag",parked:"hallazgo éxito 87%",foc:"po-ux",
   sid:"sess_44e0",model:"Opus 4.8",ctx:42,
   conv:[["u","El hallazgo dice éxito 87%. Ajusta el eval-gate de <b>po-ux</b> al umbral correcto."],
         ["a","Para fijar el gate necesito tu decisión: ¿el umbral objetivo de éxito es <b>90%</b> (estándar F1) o <b>85%</b>? De ahí depende si po-ux queda en verde o atención.","await"]]},
  {id:"s3",arn:"backend-nordia",empresa:"Nordia",puesto:"Backend",health:"crit",
   status:"idle",view:"Corridas",parked:"corrida r3 · 3 hallazgos",foc:"gate-runner",
   sid:"sess_9b12",model:"Opus 4.8",ctx:63,
   conv:[["u","Revisa la corrida r3, tiene salto de fase."],
         ["a","Listo. Encontré 3 hallazgos, los dejé en Diagnóstico: salto Specs⇢Desarrollo sin gate, gate-runner sin criterio de éxito, y p95 alto en 2 endpoints."],
         ["sys","3 hallazgos → Diagnóstico · sesión en pausa"]]},
  {id:"s4",arn:"pm-nordia",empresa:"Nordia",puesto:"Gestión de Proyecto",health:"ok",
   status:"idle",view:"Mapa",parked:"—",foc:null,
   sid:"sess_10ff",model:"Opus 4.8",ctx:9,
   conv:[["a","¿En qué te ayudo con <b>pm-nordia</b>? Puedo revisar su intake, ajustar el ruteo condicional o crear una caja nueva."]]},
];
const HCOL={ok:"h-ok",warn:"h-warn",crit:"h-crit",info:"h-info"};
const HLBL={ok:"sano",warn:"atención",crit:"señales incompletas",info:"naciendo"};
const STLBL={streaming:"generando…",await:"te necesita",idle:"en pausa"};

/* ═════════ estado ═════════ */
const S={para:"P1",active:"s1",chat:false,palette:false,palSel:0};

/* ═════════ helpers ═════════ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ses=id=>SESSIONS.find(s=>s.id===id);
const activeSes=()=>ses(S.active);
const attention=()=>SESSIONS.filter(s=>s.status==="await").length;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600);}
const vico=v=>(VIEWS.find(x=>x[0]===v)||["","•"])[1];

/* ═════════ componentes compartidos ═════════ */
function workspaceHTML(s){
  const lanes=[["Intake",[["pm-luana","skill"],["po-ux","skill"]]],
               ["Desarrollo",[["dev-team","skill"],["gate-runner","agent"]]],
               ["Calidad",[["auditor","skill"],["contract-guard","hook"]]]];
  const laneH=lanes.map(([nm,ns])=>`<div class="mlane"><div class="lh">${nm}</div>${
    ns.map(([n,ty])=>`<div class="mnode ${s.foc===n?'foc':''}" style="--tc:var(--c-${ty})"><span class="mg"></span><span class="mn">${n}</span></div>`).join("")
  }</div>`).join("");
  return `<div class="ws">
    <div class="ws-hd">
      <span class="big">${s.arn}</span>
      <span class="st st-${s.status==='streaming'?'stream':s.status}"><span class="pip ${s.status}"></span>${STLBL[s.status]}</span>
      <span class="meta">${s.empresa} · ${s.puesto} · <span class="hdot ${HCOL[s.health]}" style="display:inline-block;vertical-align:middle"></span> ${HLBL[s.health]}</span>
    </div>
    <div style="font-size:11px;color:var(--muted)">Vista <b style="color:var(--text)">${s.view}</b> · quedaste en <code>${s.parked}</code> — al volver a esta sesión, aterrizas aquí (arnés + vista + selección + conversación restaurados).</div>
    <div class="mm">
      <div class="mband"><h4>Guardia (hooks)</h4><div class="mrow">
        <div class="mnode ${s.foc==='contract-guard'?'foc':''}" style="--tc:var(--c-hook)"><span class="mg"></span><span class="mn">contract-guard</span></div>
        <div class="mnode" style="--tc:var(--c-hook)"><span class="mg"></span><span class="mn">telemetry-emit</span></div>
      </div></div>
      <div class="mlanes">${laneH}</div>
      <div class="mband"><h4>Base (siempre en contexto)</h4><div class="mrow">
        <div class="mnode" style="--tc:var(--c-rule)"><span class="mg"></span><span class="mn">CLAUDE.md</span></div>
        <div class="mnode" style="--tc:var(--c-know)"><span class="mg"></span><span class="mn">project.config</span></div>
      </div></div>
    </div>
  </div>`;
}
function chatHTML(s,persistent){
  const msgs=s.conv.map(([who,txt,flag])=>{
    if(who==="sys")return `<div class="msg sys">${txt}</div>`;
    if(flag==="typing")return `<div class="msg a">${txt} <span class="typing"><i></i><i></i><i></i></span></div>`;
    if(flag==="await")return `<div class="msg a awaiting">${txt}</div>`;
    return `<div class="msg ${who}">${txt}</div>`;
  }).join("");
  return `<div class="chat">
    <div class="chat-hd"><span class="t"><span class="pip ${s.status}"></span>${s.arn}</span>
      ${persistent?'':'<button class="x" data-chatclose>✕</button>'}</div>
    <div class="ses"><span class="sid">◍ ${s.sid}</span><span>· ${s.model}</span><span>· ctx</span><span class="ctxbar"><i style="width:${s.ctx}%"></i></span><span>${s.ctx}%</span></div>
    <div class="msgs">${msgs}</div>
    <div class="composer"><div class="box">Pídele un cambio a ${s.arn}…</div><button class="send" data-toast="Claude Code headless detrás · patrón conductor. Esta conversación ES la sesión CC de ${s.arn}.">↑</button></div>
  </div>`;
}

/* ═════════ P1 · Session Rail ═════════ */
function railP1(){
  const cards=SESSIONS.map(s=>`<button class="scard" data-ses="${s.id}" aria-current="${S.active===s.id}">
    <div class="s1"><span class="pip ${s.status}" title="${STLBL[s.status]}"></span><span class="snm">${s.arn}</span><span class="hdot ${HCOL[s.health]}"></span></div>
    <div class="sco">${s.empresa} · ${s.puesto}</div>
    <div class="sctx"><span class="sview">${vico(s.view)} ${s.view}</span>${s.status==='await'?'<span class="await-lbl">◐ te necesita</span>':`<span>${s.parked==='—'?'nueva':s.parked}</span>`}</div>
  </button>`).join("");
  return `<div class="srail">
    <div class="srail-hd"><div class="brand">A</div><span class="wm">ArnesIA</span>${attention()?`<span class="att">${attention()} ◐</span>`:''}</div>
    <div class="srail-sec">Sesiones abiertas</div>
    <div class="slist">${cards}</div>
    <div class="srail-ft">
      <button class="newses" data-toast="Nueva sesión: elige un arnés del portafolio (o crea uno nuevo). Abre su propia conversación CC.">＋ Nueva sesión</button>
      <div class="globrow">
        <button data-toast="Portafolio · organigrama de todos los arneses"><span class="ico">⌂</span>Portafolio</button>
        <button data-toast="Estándar as code (cross-arnés)"><span class="ico">⟳</span>Estándar</button>
        <button data-toast="Ajustes · Marketplaces"><span class="ico">⚙</span>Ajustes</button>
      </div>
    </div>
  </div>`;
}
function shellP1(){
  const s=activeSes();
  const vs=VIEWS.map(([v,ic])=>`<button class="vi" data-view="${v}" aria-pressed="${s.view===v}" title="${v}"><span class="ico">${ic}</span>${v}</button>`).join("");
  return railP1()+`<div class="vstrip">${vs}</div>
  <div class="main">
    <div class="topbar">
      <div class="crumb"><span style="color:var(--muted)">${s.empresa}</span><span class="sepc">/</span><span class="pill">${s.arn} ▾</span><span class="sepc">/</span><b>${s.view}</b></div>
      <span class="parked">quedaste en: ${s.parked}</span>
      <button class="ask" id="ask"><span>✦</span>Conversar <kbd>⌘K</kbd></button>
    </div>
    <div class="body"><div class="stage">${workspaceHTML(s)}</div>
      <aside class="dock">${S.chat?chatHTML(s,false):''}</aside></div>
  </div>`;
}

/* ═════════ P2 · Dual-Zone Rail ═════════ */
function shellP2(){
  const s=activeSes();
  const avatars=SESSIONS.map(s=>`<div class="savatar" data-ses="${s.id}" aria-current="${S.active===s.id}" tabindex="0" role="button" aria-label="${s.arn}">
    ${s.empresa[0]}
    <span class="hdot ${HCOL[s.health]} ph"></span>
    <span class="pip ${s.status} pp"></span>
    <div class="fly"><div class="fnm">${s.arn}</div><div class="fco">${s.empresa} · ${s.puesto}</div>
      <div class="fst"><span class="pip ${s.status}"></span>${STLBL[s.status]} · ${vico(s.view)} ${s.view}</div></div>
  </div>`).join("");
  const vtabs=VIEWS.map(([v,ic])=>`<button data-view="${v}" aria-pressed="${s.view===v}"><span class="vico">${ic}</span>${v}</button>`).join("");
  return `<div class="mrail">
    <div class="brand">A</div>
    <div class="mrail-sec">SES</div>
    <div class="savatars">${avatars}<button class="mnew" data-toast="Nueva sesión">＋</button></div>
    <div class="mglob">
      <button data-toast="Portafolio">⌂</button>
      <button data-toast="Estándar">⟳</button>
      <button data-toast="Ajustes">⚙</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="crumb"><span class="pill"><span class="pip ${s.status}"></span>${s.arn}</span></div>
      <div class="viewtabs" style="margin-left:4px">${vtabs}</div>
      ${attention()?`<span class="parked" style="color:var(--warn);border-color:var(--warn)">◐ ${attention()} sesión(es) te necesitan</span>`:''}
      <button class="ask" id="ask"><span>✦</span>Conversar <kbd>⌘K</kbd></button>
    </div>
    <div class="body"><div class="stage">${workspaceHTML(s)}</div>
      <aside class="dock">${S.chat?chatHTML(s,false):''}</aside></div>
  </div>`;
}

/* ═════════ P3 · Conversation Cockpit ═════════ */
function shellP3(){
  const s=activeSes();
  const cards=SESSIONS.map(s=>`<button class="scard" data-ses="${s.id}" aria-current="${S.active===s.id}">
    <div class="s1"><span class="pip ${s.status}"></span><span class="snm">${s.arn}</span><span class="hdot ${HCOL[s.health]}"></span></div>
    <div class="sctx"><span class="sview">${vico(s.view)} ${s.view}</span>${s.status==='await'?'<span class="await-lbl">◐ te necesita</span>':`<span>${s.parked==='—'?'nueva':s.parked}</span>`}</div>
  </button>`).join("");
  const vtabs=VIEWS.map(([v,ic])=>`<button data-view="${v}" aria-pressed="${s.view===v}"><span class="vico">${ic}</span>${v}</button>`).join("");
  return `<div class="srail">
    <div class="srail-hd"><div class="brand">A</div><span class="wm">ArnesIA</span>${attention()?`<span class="att">${attention()} ◐</span>`:''}</div>
    <div class="srail-sec">Sesiones</div>
    <div class="slist">${cards}</div>
    <div class="srail-ft"><button class="newses" data-toast="Nueva sesión">＋ Nueva sesión</button>
      <div class="globrow"><button data-toast="Portafolio"><span class="ico">⌂</span>Home</button><button data-toast="Estándar"><span class="ico">⟳</span>Están.</button><button data-toast="Ajustes"><span class="ico">⚙</span>Ajus.</button></div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="crumb"><span class="pill">${s.arn}</span></div>
      <div class="viewtabs" style="margin-left:4px">${vtabs}</div>
      <span class="parked" style="margin-left:auto">conversación siempre a la derecha →</span>
    </div>
    <div class="body"><div class="stage">${workspaceHTML(s)}</div></div>
  </div>
  <aside class="convcol">${chatHTML(s,true)}</aside>`;
}

/* ═════════ P4 · Spaces + Quick-Switch ═════════ */
function shellP4(){
  const s=activeSes();
  const rows=SESSIONS.map((s,i)=>`<div class="grow" data-ses="${s.id}" aria-current="${S.active===s.id}">
    <span class="gpips"><span class="pip ${s.status}"></span></span>
    <span class="gtext"><span class="gnm">${s.arn}</span><span class="gk"><span class="hdot ${HCOL[s.health]}" style="display:inline-block"></span> ${STLBL[s.status]} · ⌘${i+1}</span></span>
  </div>`).join("");
  const vtabs=VIEWS.map(([v,ic])=>`<button data-view="${v}" aria-pressed="${s.view===v}"><span class="vico">${ic}</span>${v}</button>`).join("");
  return `<div class="gutter">
    <div class="brand">A</div>
    <div class="gsec">SESIONES</div>
    ${rows}
    <div class="grow" data-toast="Nueva sesión (⌘T)"><span class="gpips" style="color:var(--muted)">＋</span><span class="gtext"><span class="gnm" style="color:var(--muted)">Nueva sesión</span><span class="gk">⌘T</span></span></div>
    <div class="sp"></div>
    <div class="gsec">GLOBAL</div>
    <div class="grow" data-toast="Portafolio"><span class="gpips">⌂</span><span class="gtext"><span class="gnm">Portafolio</span></span></div>
    <div class="grow" data-toast="Estándar"><span class="gpips">⟳</span><span class="gtext"><span class="gnm">Estándar</span></span></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="crumb"><span class="pill">${s.arn}</span></div>
      <div class="viewtabs" style="margin-left:4px">${vtabs}</div>
      ${attention()?`<span class="parked" style="color:var(--warn);border-color:var(--warn)">◐ ${attention()} te necesitan</span>`:''}
      <button class="ask" id="palbtn"><span>⌘K</span>Saltar sesión</button>
      <button class="ask" id="ask" style="margin-left:0"><span>✦</span>Conversar</button>
    </div>
    <div class="body"><div class="stage">${workspaceHTML(s)}</div>
      <aside class="dock">${S.chat?chatHTML(s,false):''}</aside></div>
  </div>`;
}

/* ═════════ render ═════════ */
const app=$("#app");
function labTabs(){
  $("#labtabs").innerHTML=PARADIGMS.map((p,i)=>`<button data-para="${p.k}" aria-pressed="${S.para===p.k}"><span class="k">${i+1}</span>${p.name}</button>`).join("");
  const p=PARADIGMS.find(x=>x.k===S.para);
  $("#labdesc").innerHTML=`<b>${p.name}</b> · ${p.tag} <span>${p.desc}</span><span class="trade">trade-off: ${p.trade}</span>`;
}
function render(){
  labTabs();
  const shell={P1:shellP1,P2:shellP2,P3:shellP3,P4:shellP4}[S.para];
  app.className="app "+S.para.toLowerCase()+(S.chat?" chat-on":"");
  app.innerHTML=shell();
  $("#palette").classList.toggle('on',S.palette);
  if(S.palette)renderPalette();
  wire();
}
function renderPalette(){
  $("#pallist").innerHTML=SESSIONS.map((s,i)=>`<div class="pitem ${i===S.palSel?'sel':''}" data-ses="${s.id}">
    <span class="pip ${s.status}"></span>
    <div><div class="pnm">${s.arn}</div><div class="pco">${s.empresa} · ${STLBL[s.status]} · ${s.view}</div></div>
    <span class="pk">⌘${i+1}</span>
  </div>`).join("");
}

/* ═════════ acciones ═════════ */
function switchSession(id){S.active=id;S.palette=false;
  const s=ses(id);
  if(s.status==='await'){toast('Entraste a «'+s.arn+'» — CC esperaba tu respuesta.');}
  else toast('Sesión «'+s.arn+'» — contexto y conversación restaurados.');
  render();}
function setView(v){activeSes().view=v;render();}
function openPalette(){S.palette=true;S.palSel=SESSIONS.findIndex(s=>s.id===S.active);render();}

function wire(){
  $$('[data-para]').forEach(b=>b.onclick=()=>{S.para=b.dataset.para;S.chat=(S.para==='P3');render();});
  $$('[data-ses]',app).forEach(b=>b.onclick=()=>switchSession(b.dataset.ses));
  $$('[data-ses]',app).forEach(b=>b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();switchSession(b.dataset.ses);}});
  $$('[data-view]',app).forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $$('[data-toast]',app).forEach(b=>b.onclick=e=>{e.stopPropagation();toast(b.dataset.toast);});
  const ask=$("#ask");if(ask)ask.onclick=()=>{S.chat=!S.chat;render();};
  const palbtn=$("#palbtn");if(palbtn)palbtn.onclick=openPalette;
  $$('.dock [data-chatclose]',app).forEach(b=>b.onclick=()=>{S.chat=false;render();});
  $$('.dock [data-toast]',app).forEach(b=>b.onclick=e=>{e.stopPropagation();toast(b.dataset.toast);});
  // palette
  $$('#pallist [data-ses]').forEach(b=>b.onclick=()=>switchSession(b.dataset.ses));
}

/* ═════════ globales ═════════ */
$("#labtabs").addEventListener('click',()=>{});
$("#theme").onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);toast('Tema: '+next);};
$("#fire").onclick=()=>{ // simula que un arnés en background termina y te necesita
  const cand=SESSIONS.find(s=>s.status==='streaming'&&s.id!==S.active)||SESSIONS.find(s=>s.status==='idle'&&s.id!==S.active);
  if(!cand){toast('Todas las sesiones ya te esperan o están activas.');return;}
  cand.status='await';
  cand.conv.push(["a","Terminé el borrador pero necesito tu OK antes de mandarlo a beta. ¿Confirmas el cambio?","await"]);
  toast('◐ «'+cand.arn+'» terminó en background y ahora te necesita — míralo en el rail.');render();};
$("#palette").onclick=e=>{if(e.target.id==='palette'){S.palette=false;render();}};

addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();
    if(S.para==='P4'){S.palette?switchSession(SESSIONS[S.palSel].id):openPalette();}
    else{S.chat=!S.chat;render();}return;}
  if((e.metaKey||e.ctrlKey)&&/^[1-4]$/.test(e.key)){e.preventDefault();
    // ⌘1-4 = cambiar paradigma en la lab; con palette abierta = elegir sesión
    if(S.palette){switchSession(SESSIONS[+e.key-1].id);}else{S.para='P'+e.key;S.chat=(S.para==='P3');render();}return;}
  if(S.palette){
    if(e.key==='Escape'){S.palette=false;render();}
    if(e.key==='ArrowDown'){e.preventDefault();S.palSel=(S.palSel+1)%SESSIONS.length;renderPalette();}
    if(e.key==='ArrowUp'){e.preventDefault();S.palSel=(S.palSel-1+SESSIONS.length)%SESSIONS.length;renderPalette();}
    if(e.key==='Enter'){e.preventDefault();switchSession(SESSIONS[S.palSel].id);}
  }
});
render();
</script>
