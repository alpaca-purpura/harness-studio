<style>

    --c-skill:#5b9dd9;--c-agent:#9b7fd4;--c-hook:#d46a9e;--c-knowledge:#4fb3a1;--c-mcp:#8195a9;--c-rule:#b5b558;--c-command:#49aec7;--c-plugin:#cdae54;--c-settings:#a4917c;--c-output-style:#cc7d9c;--c-statusline:#8aa87d;
    --ok:#57b380;--warn:#e0904f;--crit:#e25b5b;
  }}
  :root[data-theme="dark"]{
    --background:#14171c;--card:#1b2027;--secondary:#242b34;
    --foreground:#e8ecf1;--muted-foreground:#94a1af;
    --border:#2d3743;--input:#3a4655;--primary:#d9a35b;
    --c-skill:#5b9dd9;--c-agent:#9b7fd4;--c-hook:#d46a9e;--c-knowledge:#4fb3a1;--c-mcp:#8195a9;--c-rule:#b5b558;--c-command:#49aec7;--c-plugin:#cdae54;--c-settings:#a4917c;--c-output-style:#cc7d9c;--c-statusline:#8aa87d;
    --ok:#57b380;--warn:#e0904f;--crit:#e25b5b;
  }
  :root[data-theme="light"]{
    --background:#f2f4f7;--card:#ffffff;--secondary:#e9edf2;
    --foreground:#212832;--muted-foreground:#5d6a79;
    --border:#d5dbe3;--input:#c3cbd6;--primary:#a8742c;
    --c-skill:#2f74b5;--c-agent:#7455c2;--c-hook:#bb4c85;--c-knowledge:#20826f;--c-mcp:#586c80;--c-rule:#7a7a24;--c-command:#0f7f96;--c-plugin:#9c7b1a;--c-settings:#766753;--c-output-style:#a85274;--c-statusline:#5f7a52;

  /* ══ MapBar (map-bar.tsx) ══ */

  .procrow{display:flex;align-items:stretch;gap:0}

  .lane-body{display:flex;flex-direction:column;gap:10px;padding:12px}
  /* franja de artefactos (handoff-gutter.tsx): vive ENTRE carriles, a la altura del spine */

  .artchip{display:flex;flex-direction:column;gap:1px;cursor:pointer;border:1px solid color-mix(in srgb,var(--c-knowledge) 40%,var(--border));border-left:3px solid var(--c-knowledge);background:color-mix(in srgb,var(--c-knowledge) 8%,var(--card));border-radius:var(--radius-md);padding:5px 8px;font:inherit;text-align:left}
  .artchip .a-nm{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--foreground);line-height:1.2}

  /* nodo (arnes-node.tsx / glyph) */
  .node{position:relative;display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;cursor:pointer;border:1px solid var(--border);border-left:3px solid var(--tc,var(--border));border-radius:var(--radius-md);background:var(--secondary);padding:10px 12px;font:inherit;color:var(--foreground);transition:border-color .12s,box-shadow .12s}

  .node.dim{opacity:.4}
  .node.support{margin-left:14px;background:color-mix(in srgb,var(--secondary) 55%,transparent)}

  .node-trans::before{content:"\25C7";font-size:8px;opacity:.8}
  .glyph{flex:none;display:grid;place-items:center;width:17px;height:17px;background:var(--tc);color:var(--card);font-family:var(--font-mono);font-weight:700;font-size:10px;line-height:1}
  .glyph.square{border-radius:3px}.glyph.circle{border-radius:50%}.glyph.rounded{border-radius:4px}
  .glyph.diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .glyph.hexagon{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .glyph.shield{clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}

  /* controles */
  .zoomctl{position:absolute;left:16px;bottom:16px;z-index:20;display:flex;flex-direction:column;gap:6px}
  .zoomctl button{font:inherit;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:var(--radius-md);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* ══ Inspector (inspector.tsx) ══ */
  .drawer{position:absolute;top:0;right:0;bottom:0;width:360px;max-width:88vw;background:var(--card);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.14);transform:translateX(100%);transition:transform .18s ease;z-index:40;display:flex;flex-direction:column;overflow:hidden}
  .drawer.open{transform:none}
  .dw-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .dw-head .glyph{width:22px;height:22px;font-size:12px}
  .dw-id{flex:1;min-width:0}
  .dw-nombre{font-family:var(--font-mono);font-size:var(--text-base);font-weight:700;line-height:1.25}
  .dw-handle{font-size:var(--text-xs);color:var(--muted-foreground)}
  .dw-handle .mono{font-family:var(--font-mono)}
  .dw-expand,.dw-close{flex:none;font:inherit;font-size:15px;line-height:1;cursor:pointer;border:0;background:transparent;color:var(--muted-foreground);padding:2px 5px}
  .dw-tabs{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--border)}
  .dw-tab{font:inherit;font-size:var(--text-sm);cursor:pointer;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted-foreground);padding:6px 10px}
  .dw-tab[aria-selected="true"]{color:var(--foreground);font-weight:600;border-bottom-color:var(--primary)}
  .dw-body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
  .sec>h4{margin:0 0 6px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
  .sec .info{width:14px;height:14px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--muted-foreground);font-size:9px;line-height:1;cursor:help;padding:0}
  .field{display:flex;gap:8px;font-size:var(--text-sm);padding:1px 0}
  .field .k{color:var(--muted-foreground);min-width:88px}
  .field .k.tip{border-bottom:1px dotted var(--muted-foreground)}
  .field .v{color:var(--foreground)}
  .fg{font-size:var(--text-sm);color:var(--foreground);margin:0;line-height:1.45}
  .mut{font-size:var(--text-sm);color:var(--muted-foreground);margin:0}
  .src-note{font-size:var(--text-xs);color:var(--muted-foreground);margin:4px 0 0}
  .caps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .caps li{font-size:var(--text-sm)}
  .caps .mono{font-family:var(--font-mono)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{cursor:pointer;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);border-radius:var(--radius-full);padding:2px 9px;font:inherit;font-size:var(--text-xs);display:inline-flex;gap:5px;align-items:center}
  .chip:disabled{opacity:.6;cursor:default}
  .chip .org{color:var(--muted-foreground);font-family:var(--font-mono);font-size:9px}
  .hallazgo{font-size:var(--text-sm);border-radius:var(--radius-md);padding:7px 10px;margin:0}
  .hallazgo.crit{color:var(--crit);border:1px solid color-mix(in srgb,var(--crit) 40%,transparent);background:color-mix(in srgb,var(--crit) 9%,transparent)}
  .hallazgo.warn{color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
  .dw-actions{display:flex;flex-direction:column;gap:7px;padding-top:6px;border-top:1px solid var(--border)}
  .act{font:inherit;font-size:var(--text-sm);cursor:not-allowed;border:1px solid var(--border);background:transparent;color:var(--muted-foreground);border-radius:var(--radius-md);padding:7px 11px;text-align:left;opacity:.75}
  .act.primary{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent);opacity:1}
  .act-note{font-size:var(--text-xs);color:var(--muted-foreground);margin:2px 0 0}
  .chip-versiona{align-self:flex-start;font-size:9px;font-family:var(--font-mono);color:var(--c-knowledge);border:1px solid color-mix(in srgb,var(--c-knowledge) 40%,transparent);border-radius:var(--radius-full);padding:1px 7px}
  .src{border:1px solid var(--border);border-radius:var(--radius-md);background:color-mix(in srgb,var(--secondary) 40%,transparent);font-family:var(--font-mono);font-size:11px;overflow:auto;max-height:200px}
  .src .ln{display:flex;gap:10px;padding:0 8px}
  .src .ln span{color:var(--muted-foreground);user-select:none;text-align:right;min-width:20px}

  .badge-derivado{position:absolute;left:16px;top:64px;z-index:15;font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-full);padding:2px 9px;opacity:.9}
  @media (max-width:640px){.drawer{width:100%}}
  @media (prefers-reduced-motion:reduce){.drawer,.node{transition:none}}
</style>

<div class="app" id="app">

<script>
const KIND={
  skill:{color:"var(--c-skill)",shape:"square",char:"S",label:"Skill"},
  subagent:{color:"var(--c-agent)",shape:"circle",char:"A",label:"Subagente"},
  hook:{color:"var(--c-hook)",shape:"diamond",char:"H",label:"Hook"},
  rule:{color:"var(--c-rule)",shape:"shield",char:"R",label:"Regla"},
  mcp:{color:"var(--c-mcp)",shape:"hexagon",char:"M",label:"MCP"},
  command:{color:"var(--c-command)",shape:"rounded",char:"/",label:"Comando"},
  plugin:{color:"var(--c-plugin)",shape:"rounded",char:"P",label:"Plugin"},
  settings:{color:"var(--c-settings)",shape:"rounded",char:"⚙",label:"Ajustes"},

function drawEdges(g,focusId){
  const content=document.getElementById("content"),svg=document.getElementById("edges");
  [...svg.querySelectorAll("path.edge")].forEach(p=>p.remove());
  const base=content.getBoundingClientRect();
  for(const e of(g.edges||[])){
    const spine=e.tipo==="invoca",touches=focusId&&(e.de===focusId||e.a===focusId);
    if(!spine&&!touches)continue;
    const from=content.querySelector(`[data-node-id="${e.de}"]`),to=content.querySelector(`[data-node-id="${e.a}"]`);
    if(!from||!to)continue;const f=from.getBoundingClientRect(),t=to.getBoundingClientRect();if(!f.width||!t.width)continue;
    const x1=(f.right-base.left)/z,y1=(f.top+f.height/2-base.top)/z,x2=(t.left-base.left)/z,y2=(t.top+t.height/2-base.top)/z,dx=Math.max(30,Math.abs(x2-x1)/2);
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("class","edge");
    p.setAttribute("d",`M ${x1},${y1} C ${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);p.setAttribute("fill","none");
    const s=STROKE[e.tipo]||STROKE.invoca;p.setAttribute("stroke",s.color);if(s.dash)p.setAttribute("stroke-dasharray",s.dash);
    let op=s.opacity,w=1.6;if(focusId){if(touches){op=.95;w=2.2;}else if(spine)op=.2;}
    p.setAttribute("opacity",op);p.setAttribute("stroke-width",String(w));if(e.tipo!=="lee")p.setAttribute("marker-end","url(#arr)");
    svg.appendChild(p);
  }
  const nodes=content.querySelectorAll(".node");
  if(!focusId)nodes.forEach(n=>n.classList.remove("dim"));
  else{const rel=new Set([focusId]);for(const e of(g.edges||[])){if(e.de===focusId)rel.add(e.a);if(e.a===focusId)rel.add(e.de);}nodes.forEach(n=>n.classList.toggle("dim",!rel.has(n.dataset.nodeId)));}
}

let insTab="resumen";

function field(k,v){return v?`<div class="field"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`:"";}

function paintInspector(n){
  const d=document.getElementById("drawer"),k=KIND[n.clase]||KIND.skill,c=n.contract;
  const tabs=["resumen","contenido","corridas"].map(t=>`<button class="dw-tab" role="tab" aria-selected="${insTab===t}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("");

    let s=section("Clasificación",field("banda",n.banda)+field("fase",n.fase)+field("procedencia",n.procedencia)+(c?field("arquetipo",c.arquetipo)+field("perfil",c.perfil_harness)+field("caja",c.caja===false?"no":(n.caja?"sí":"no")):""));

      if(c.necesita&&c.necesita.length)s+=section("Necesita",`<div class="chips">${c.necesita.map(inp=>`<button class="chip" ${inp.de.includes(":")?"":"disabled"}>${esc(inp.art)}<span class="org">← ${esc(inp.de)}</span></button>`).join("")}</div>`);
      if(c.entrega&&c.entrega.length)s+=section("Entrega",`<ul class="caps">${c.entrega.map(o=>`<li>${esc(o.art)}${o.escritor_unico?`<span class="mut"> · escritor único</span>`:""}</li>`).join("")}</ul>`);

      if(c.gate)s+=section("Gate",field("tipo",c.gate.tipo)+(c.gate.detalle?`<p class="fg">${esc(c.gate.detalle)}</p>`:""));
      if(c.handoff)s+=section("Handoff",`<p class="fg">${esc(c.handoff.cuando)} <span class="mut">→ ${esc(c.handoff.a)}</span></p>`);
    }
    // Hallazgos (siempre presente)
    const gateNone=c&&c.gate&&c.gate.tipo==="none";
    s+=section("Hallazgos",(gateNone?`<p class="hallazgo crit"><b>gate:none</b> — caja sin eval formal (A4): hueco visible, no blanco.</p>`:`<p class="mut">Sin hallazgos abiertos.</p>`));
    s+=`<div class="dw-actions"><button class="act primary" disabled title="Se cablea en Fase 3/4 del Hito 2">Editar conversando</button><button class="act" disabled title="Release train — fuera de este paquete">Evaluar A/B contra v anterior</button><button class="act" disabled>Promover a estable</button><button class="act" disabled>Ver en Historia</button><p class="act-note">staged — «Editar conversando» se cablea en Fase 3/4; el resto espera tren/Historia.</p></div>`;

  d.querySelectorAll(".dw-tab").forEach(b=>b.onclick=()=>{insTab=b.dataset.tab;paintInspector(n);});
}

/* ── barra: picker · meta · artefactos · capas ── */
function renderMeta(g){document.getElementById("meta").innerHTML=[["empresa",g.arnes.empresa],["rol",g.arnes.rol],["reporta a",g.arnes.reporta_a||"—"],["⬡",g.arnes.marketplace]].map(([kk,v])=>`<span class="mchip">${esc(kk)} <b>${esc(v)}</b></span>`).join("");}
document.getElementById("picker").onchange=e=>{current=e.target.value;selected=null;render(GRAPHS[current]);renderMeta(GRAPHS[current]);requestAnimationFrame(fit);document.getElementById("drawer").classList.remove("open");};
document.getElementById("seg-art").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;artMode=b.dataset.a;[...document.querySelectorAll("#seg-art button")].forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.a===artMode)));render(GRAPHS[current]);requestAnimationFrame(()=>drawEdges(GRAPHS[current],focus));});
document.getElementById("seg-capa").addEventListener("click",e=>{const b=e.target.closest("button[data-c]:not([disabled])");if(!b)return;[...document.querySelectorAll("#seg-capa button")].forEach(x=>x.setAttribute("aria-selected",String(x===b)));});

/* ── zoom/pan/hover ── */
let z=1,ox=24,oy=24;
function applyT(){document.getElementById("stage").style.transform=`translate(${ox}px,${oy}px) scale(${z})`;drawEdges(GRAPHS[current],focus);}
function fit(){const c=document.getElementById("content"),vp=document.getElementById("viewport");const cw=c.scrollWidth,ch=c.scrollHeight,vw=vp.clientWidth,vh=vp.clientHeight;z=+Math.min((vw-48)/cw,(vh-48)/ch,1).toFixed(3);ox=Math.max(24,(vw-cw*z)/2);oy=24;applyT();}
document.getElementById("zin").onclick=()=>{z=Math.min(2,+(z+0.1).toFixed(2));applyT();};
document.getElementById("zout").onclick=()=>{z=Math.max(0.4,+(z-0.1).toFixed(2));applyT();};
document.getElementById("zfit").onclick=fit;
const vp=document.getElementById("viewport");let drag=null;
vp.addEventListener("mousedown",e=>{if(e.target.closest(".node,.artchip,.zoomctl,.drawer,.ref,.gutter-more"))return;drag={x:e.clientX,y:e.clientY,ox,oy};vp.classList.add("grabbing");});
window.addEventListener("mousemove",e=>{if(!drag)return;ox=drag.ox+(e.clientX-drag.x);oy=drag.oy+(e.clientY-drag.y);applyT();});
window.addEventListener("mouseup",()=>{drag=null;vp.classList.remove("grabbing");});
vp.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();z=Math.min(2,Math.max(0.4,+(z-Math.sign(e.deltaY)*0.1).toFixed(2)));applyT();},{passive:false});
const contentEl=document.getElementById("content");
contentEl.addEventListener("mouseover",e=>{const n=e.target.closest(".node");if(!n||n.dataset.nodeId===focus)return;focus=n.dataset.nodeId;drawEdges(GRAPHS[current],focus);});
contentEl.addEventListener("mouseout",e=>{const n=e.target.closest(".node");if(!n)return;const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest(".node"):null;if(to&&to.dataset.nodeId===focus)return;focus=null;drawEdges(GRAPHS[current],focus);});

render(GRAPHS[current]);renderMeta(GRAPHS[current]);requestAnimationFrame(fit);
new ResizeObserver(()=>drawEdges(GRAPHS[current],focus)).observe(document.getElementById("content"));
</script>
