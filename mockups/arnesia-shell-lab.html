<title>ArnesIA · Shell Lab</title>
<style>
  :root{
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#e9edf2; --line:#d5dbe3; --line2:#c3cbd6;
    --text:#212832; --muted:#5d6a79; --accent:#a8742c; --accent-soft:rgba(168,116,44,.14);
    --c-skill:#2f74b5; --c-agent:#7455c2; --c-hook:#bb4c85; --c-know:#20826f; --c-mcp:#586c80; --c-rule:#7a7a24;
    --ok:#2e8f5e; --warn:#c96a2e; --crit:#c94545;
    --ok-soft:rgba(46,143,94,.13); --warn-soft:rgba(201,106,46,.13); --crit-soft:rgba(201,69,69,.12);
    --heat:rgba(205,105,55,.30);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --surface:#1b2027; --surface2:#242b34; --line:#2d3743; --line2:#3a4655;
      --text:#e8ecf1; --muted:#94a1af; --accent:#d9a35b; --accent-soft:rgba(217,163,91,.14);
      --c-skill:#5b9dd9; --c-agent:#9b7fd4; --c-hook:#d46a9e; --c-know:#4fb3a1; --c-mcp:#8195a9; --c-rule:#b5b558;
      --ok:#57b380; --warn:#e0904f; --crit:#e25b5b;
      --ok-soft:rgba(87,179,128,.14); --warn-soft:rgba(224,144,79,.14); --crit-soft:rgba(226,91,91,.13);
      --heat:rgba(226,110,70,.30);
    }
  }
  :root[data-theme="light"]{
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#e9edf2; --line:#d5dbe3; --line2:#c3cbd6;
    --text:#212832; --muted:#5d6a79; --accent:#a8742c; --accent-soft:rgba(168,116,44,.14);
    --c-skill:#2f74b5; --c-agent:#7455c2; --c-hook:#bb4c85; --c-know:#20826f; --c-mcp:#586c80; --c-rule:#7a7a24;
    --ok:#2e8f5e; --warn:#c96a2e; --crit:#c94545;
    --ok-soft:rgba(46,143,94,.13); --warn-soft:rgba(201,106,46,.13); --crit-soft:rgba(201,69,69,.12);
    --heat:rgba(205,105,55,.30);
  }
  :root[data-theme="dark"]{
    --bg:#14171c; --surface:#1b2027; --surface2:#242b34; --line:#2d3743; --line2:#3a4655;
    --text:#e8ecf1; --muted:#94a1af; --accent:#d9a35b; --accent-soft:rgba(217,163,91,.14);
    --c-skill:#5b9dd9; --c-agent:#9b7fd4; --c-hook:#d46a9e; --c-know:#4fb3a1; --c-mcp:#8195a9; --c-rule:#b5b558;
    --ok:#57b380; --warn:#e0904f; --crit:#e25b5b;
    --ok-soft:rgba(87,179,128,.14); --warn-soft:rgba(224,144,79,.14); --crit-soft:rgba(226,91,91,.13);
    --heat:rgba(226,110,70,.30);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  code,.mono{font-family:var(--mono)}

  /* ══ LAB chrome (marco, NO parte del producto) ══ */
  .lab{flex:none;height:46px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface2);border-bottom:1px solid var(--line2);position:relative;z-index:60}
  .lab-tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:3px 7px}
  .lab-title{font-size:12.5px;color:var(--muted)}
  .lab-title b{color:var(--text);font-weight:650}
  .lab-tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
  .lab-tabs button{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .lab-tabs button .k{font-family:var(--mono);font-size:10px;font-weight:700;width:16px;height:16px;display:grid;place-items:center;border-radius:4px;background:var(--surface2);color:var(--muted)}
  .lab-tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text);font-weight:600}
  .lab-tabs button[aria-pressed="true"] .k{background:var(--accent);color:#fff}
  .lab-tabs button:hover:not([aria-pressed="true"]){background:var(--surface2)}
  .lab-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .lab-btn{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--muted);background:var(--surface)}
  .lab-btn:hover{color:var(--text);border-color:var(--line2)}

  .stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex}
  .stage>.frame,.stage>.frameC{flex:1;min-width:0}

  /* annotation strip under lab: explains the active concept */
  .concept-note{flex:none;display:flex;align-items:flex-start;gap:10px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;line-height:1.5}
  .concept-note .cn-dot{flex:none;width:9px;height:9px;border-radius:99px;background:var(--accent);margin-top:4px}
  .concept-note b{color:var(--text)}
  .concept-note span{color:var(--muted)}
  .concept-note .cn-tag{flex:none;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:2px 6px;background:var(--accent-soft);white-space:nowrap}

  .frame{flex:1;min-height:0;display:flex;flex-direction:column}
  .shell{flex:1;min-height:0;display:flex;background:var(--bg)}

  /* ══ shared: nav item glyphs ══ */
  .ico{width:18px;height:18px;flex:none;display:inline-grid;place-items:center;font-size:14px;line-height:1}

  /* ══ shared: portfolio ══ */
  .canvas-scroll{flex:1;min-width:0;overflow:auto}
  .pf{padding:22px 26px;max-width:1100px;margin:0 auto}
  .pf h1{font-size:19px;margin:0 0 3px;letter-spacing:-.01em}
  .pf .sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}
  .pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}
  .pf-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 15px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:border-color .15s,transform .12s}
  .pf-card:hover{border-color:var(--line2);transform:translateY(-1px)}
  .pf-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pf-nm{font-family:var(--mono);font-size:13px;font-weight:650}
  .estado{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;border-radius:99px;padding:3px 9px}
  .estado.ok{background:var(--ok-soft);color:var(--ok)}
  .estado.warn{background:var(--warn-soft);color:var(--warn)}
  .estado.crit{background:var(--crit-soft);color:var(--crit)}
  .estado.gris{background:var(--surface2);color:var(--muted)}
  .estado.info{background:var(--accent-soft);color:var(--accent)}
  .pf-meta{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:var(--surface2)}
  .pf-sens{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .sen{border:1px solid var(--line);border-radius:8px;padding:6px 7px;background:var(--surface2)}
  .sen .lb{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .sen .vl{font-family:var(--mono);font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
  .spark{display:block;margin-top:3px}
  .demo-tag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line2);border-radius:4px;padding:1px 5px}

  /* ══ shared: map (ilustrativo) ══ */
  .mapwrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .mapbar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12px}
  .layers{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:2px;margin-left:auto}
  .layers button{padding:4px 11px;border-radius:5px;font-size:12px;color:var(--muted)}
  .layers button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .map{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .band{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 12px}
  .band-hd{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
  .band-hd h3{margin:0;font-size:12.5px}
  .band-hd span{font-size:11px;color:var(--muted)}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .lanes{display:flex;gap:11px;align-items:flex-start;overflow-x:auto;padding-bottom:2px}
  .lane{flex:1;min-width:172px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column}
  .lane-hd{padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:650;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
  .lane-hd .n{font-family:var(--mono);font-size:10px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:1px 6px}
  .lane-body{padding:9px;display:flex;flex-direction:column;gap:8px}
  .node{position:relative;display:flex;flex-direction:column;gap:3px;padding:7px 9px 7px 11px;border:1px solid var(--line);border-left:3px solid var(--tc,var(--line));border-radius:8px;background:var(--surface2);cursor:pointer;text-align:left;transition:border-color .12s,transform .12s}
  .node:hover{border-color:var(--line2);transform:translateX(1px)}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .node.hot{background:linear-gradient(0deg,var(--heat),transparent)}
  .node.beta{border-left-style:dashed}
  .node-top{display:flex;align-items:center;gap:6px}
  .glyph{width:14px;height:14px;flex:none;background:var(--tc)}
  .g-skill{border-radius:2px}
  .g-agent{border-radius:99px}
  .g-hook{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .g-know{border-radius:1px}
  .g-mcp{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .g-rule{clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
  .node-nm{font-family:var(--mono);font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node-ty{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .node-mt{font-family:var(--mono);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .node-badge{position:absolute;top:-6px;right:-6px;font-family:var(--mono);font-size:9px;font-weight:700;background:var(--warn);color:#fff;border-radius:99px;padding:1px 5px}
  .maplegend{flex:none;display:flex;gap:13px;align-items:center;padding:7px 16px;border-top:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted);overflow-x:auto}
  .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .lg .glyph{width:11px;height:11px}

  /* ══ shared: chat / conductor ══ */
  .chat{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
  .chat-hd{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .chat-hd .t{font-size:12.5px;font-weight:650}
  .chat-hd .x{margin-left:auto;color:var(--muted);border-radius:6px;padding:3px 7px}
  .chat-hd .x:hover{background:var(--surface2);color:var(--text)}
  .ses{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--surface2);font-family:var(--mono);font-size:10px;color:var(--muted);flex-wrap:wrap}
  .ses .sid{color:var(--accent)}
  .ctxbar{width:52px;height:6px;border-radius:99px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
  .ctxbar i{display:block;height:100%;background:var(--accent);width:18%}
  .msgs{flex:1;overflow:auto;padding:13px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:9px 11px;border-radius:11px;font-size:12.5px;line-height:1.5}
  .msg.u{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--accent);border-bottom-right-radius:3px}
  .msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.sys{align-self:center;font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line2);border-radius:7px;padding:4px 9px}
  .msg .diff{font-family:var(--mono);font-size:10.5px;line-height:1.55;margin-top:7px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .msg .diff div{padding:1px 8px}
  .msg .diff .add{background:var(--ok-soft);color:var(--ok)}
  .msg .diff .del{background:var(--crit-soft);color:var(--crit)}
  .msg .cta{display:flex;gap:6px;margin-top:8px}
  .msg .cta button{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;background:var(--surface)}
  .msg .cta button.pri{border-color:var(--accent);color:var(--accent)}
  .composer{flex:none;padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
  .composer .box{flex:1;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:9px 11px;font-size:12.5px;color:var(--muted);min-height:38px}
  .composer .send{flex:none;width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}

  /* ══════════ CONCEPT A · Command Rail ══════════ */
  .railL{flex:none;width:60px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:3px;z-index:5}
  .railL .brand{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;margin-bottom:9px}
  .railL .ri{width:44px;padding:8px 0;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:9px}
  .railL .ri .ico{font-size:16px}
  .railL .ri:hover{background:var(--surface2);color:var(--text)}
  .railL .ri[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
  .railL .sp{flex:1}
  .mainA{flex:1;min-width:0;display:flex;flex-direction:column}
  .topA{flex:none;display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
  .crumb{display:flex;align-items:center;gap:7px;font-size:12.5px}
  .crumb .sepc{color:var(--muted)}
  .crumb .pick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:var(--surface2);font-family:var(--mono);font-size:11.5px}
  .ask{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;background:var(--accent-soft)}
  .ask kbd{font-family:var(--mono);font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.8}
  .bodyA{flex:1;min-height:0;display:flex}
  .dockR{flex:none;width:0;overflow:hidden;border-left:1px solid var(--line);transition:width .2s ease}
  .shell.chat-on .dockR{width:372px}

  /* ══════════ CONCEPT B · Copilot Home ══════════ */
  .sideB{flex:none;width:246px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:11px 9px;gap:4px}
  .sideB .newc{display:flex;align-items:center;gap:8px;border:1px solid var(--accent);color:var(--accent);border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;background:var(--accent-soft);margin-bottom:6px}
  .sideB .grp{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 8px 4px}
  .sideB .item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:12.5px;color:var(--text)}
  .sideB .item.thread{color:var(--muted);font-size:12px}
  .sideB .item:hover{background:var(--surface2)}
  .sideB .item[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .sideB .dotm{width:7px;height:7px;border-radius:99px;flex:none}
  .chatB{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;background:var(--bg)}
  .chatB-inner{width:100%;max-width:720px;flex:1;display:flex;flex-direction:column;min-height:0}
  .chatB .msgs{padding:22px 8px}
  .canvasB{flex:none;width:0;overflow:hidden;border-left:1px solid var(--line);background:var(--surface);transition:width .2s ease;display:flex;flex-direction:column}
  .shell.canvas-on .canvasB{width:46%;min-width:420px}
  .canvasB-hd{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px}
  .canvasB-hd .artf{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px}

  /* ══════════ CONCEPT C · Split Studio ══════════ */
  .frameC{display:flex;flex-direction:column;min-height:0;flex:1}
  .topC{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
  .brandC{font-weight:750;font-size:15px;letter-spacing:-.02em}
  .brandC em{font-style:normal;color:var(--accent)}
  .tabsC{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px}
  .tabsC button{padding:5px 12px;border-radius:6px;font-size:12.5px;color:var(--muted)}
  .tabsC button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .pickC{margin-left:2px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:var(--surface2);font-family:var(--mono);font-size:11.5px}
  .splitC{flex:1;min-height:0;display:flex}
  .canvasC{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .conductorC{flex:none;width:388px;display:flex;flex-direction:column;background:var(--surface);min-height:0}
  .cnd-tabs{flex:none;display:flex;gap:2px;padding:8px 10px 0}
  .cnd-tabs button{flex:1;padding:6px;border-radius:7px 7px 0 0;font-size:11.5px;color:var(--muted);border:1px solid transparent;border-bottom:none}
  .cnd-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;border-color:var(--line)}
  .cnd-body{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:-1px}

  /* ══════════ CONCEPT D · Canvas-native ══════════ */
  .canvasD{position:absolute;inset:0;overflow:hidden;background:
    radial-gradient(circle at 30% 20%, var(--accent-soft), transparent 42%),
    radial-gradient(circle at 78% 74%, var(--accent-soft), transparent 40%),
    var(--bg)}
  .zoomtag{position:absolute;top:14px;left:16px;z-index:8;display:inline-flex;align-items:center;gap:8px;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 11px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
  .zoomtag b{font-weight:650}
  .zoomtag .zback{color:var(--accent);font-weight:600;border-left:1px solid var(--line);padding-left:8px}
  .galaxy{position:absolute;inset:0;display:grid;place-items:center}
  .galaxy-inner{position:relative;width:min(760px,86%);height:min(430px,72%)}
  .pod{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:transform .15s}
  .pod:hover{transform:translate(-50%,-50%) scale(1.05)}
  .pod .disc{width:var(--sz,92px);height:var(--sz,92px);border-radius:99px;border:2px solid var(--pc,var(--line2));background:var(--surface);display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.12);position:relative}

function spark(d){
  if(!d) return '<span class="mono" style="font-size:10px;color:var(--muted)">— sin datos</span>';

  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="${(w).toFixed(1)}" cy="${(h-((d[d.length-1]-mn)/rg)*h).toFixed(1)}" r="1.7" fill="var(--accent)"/></svg>`;
}

      ${content}
      <div class="cmdbar">
        <div class="cq"><span class="ico">⌕</span>Ir a… crear… preguntar<kbd>⌘K</kbd></div>
        <button class="cbtn" data-zoomout aria-pressed="${S.zoom==='galaxy'}"><span class="ico">◫</span>Galaxia</button>
        <button class="cbtn" data-toast="Zoom semántico: acerca a un arnés para ver su mapa."><span class="ico">⬡</span>Mapa</button>
        <button class="cbtn talk" data-hudtoggle><span class="ico">✦</span>Conversar</button>
      </div>
      <div class="hud">${chat('hud')}</div>
    </div>
  </div></div>`;
}

/* ═════════ render + wiring ═════════ */
const SHELLS={A:shellA,B:shellB,C:shellC,D:shellD};
const stage=document.getElementById('stage');
const cnote=document.getElementById('cnote');
function renderNote(){
  const c=CONCEPTS[S.concept];
  cnote.innerHTML=`<span class="cn-dot"></span><span class="cn-tag">${S.concept} · ${c.tag}</span><span><b>${c.title}.</b> ${c.desc}</span>`;
}
function render(){
  document.querySelectorAll('#lab-tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===S.concept));
  renderNote();
  stage.innerHTML=SHELLS[S.concept]();
  wire();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600);}

function wire(){
  stage.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    S.screen='map'; S._sel=null;
    if(S.concept==='B') S.canvasB=true;
    if(S.concept==='D') S.zoom='harness';
    render();
  });
  stage.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.nav;
    if(k==='pf'){S.screen='pf';S.zoom='galaxy';}
    else if(k==='map'){S.screen='map';}
    else{toast('Vista «'+k+'» — fuera de foco de este lab (shell). Vive en el mockup v3.');return;}
    render();
  });
  stage.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{
    S._sel=b.dataset.node;
    if(S.concept==='A'){S.chat=true;}
    if(S.concept==='D'){S.hud=true;}
    if(S.concept==='C'){S.cndTab='chat';}
    render();
    toast('Nodo «'+b.dataset.node+'» seleccionado → editar hablando');
  });
  stage.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{S.layer=b.dataset.layer;render();});
  stage.querySelectorAll('[data-cnd]').forEach(b=>b.onclick=()=>{S.cndTab=b.dataset.cnd;render();});
  stage.querySelectorAll('[data-chattoggle]').forEach(b=>b.onclick=()=>{S.chat=!S.chat;render();});
  stage.querySelectorAll('[data-chatclose]').forEach(b=>b.onclick=()=>{S.chat=false;render();});
  stage.querySelectorAll('[data-canvasclose]').forEach(b=>b.onclick=()=>{S.canvasB=false;render();});
  stage.querySelectorAll('[data-hudtoggle]').forEach(b=>b.onclick=()=>{S.hud=!S.hud;render();});
  stage.querySelectorAll('[data-zoomout]').forEach(b=>b.onclick=()=>{S.zoom='galaxy';S.screen='pf';render();});
  stage.querySelectorAll('[data-toast]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();toast(b.dataset.toast);});
}

/* lab tabs */
document.querySelectorAll('#lab-tabs button').forEach(b=>b.onclick=()=>{
  S.concept=b.dataset.c;
  // reset transient state so each concept opens in its natural home
  S.chat=false;S.canvasB=false;S.hud=false;S._sel=null;
  S.screen=(S.concept==='B')?'pf':'pf';
  S.zoom='galaxy';S.cndTab='chat';
  render();
});
document.getElementById('theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  toast('Tema: '+next);
};
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();
    if(S.concept==='A'){S.chat=!S.chat;render();}
    else if(S.concept==='D'){S.hud=!S.hud;render();}
    else toast('⌘K — en '+S.concept+' el chat ya está siempre visible.');
  }
  if(['1','2','3','4'].includes(e.key)&&!e.metaKey&&!e.ctrlKey){
    const map={'1':'A','2':'B','3':'C','4':'D'};S.concept=map[e.key];
    S.chat=false;S.canvasB=false;S.hud=false;S.screen='pf';S.zoom='galaxy';render();
  }
});

render();
</script>
