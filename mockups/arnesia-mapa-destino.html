<!doctype html>
<!--
  ArnesIA — Mapa DESTINO (PROPUESTA · co-diseño 2026-07-10). SUPERSET ESTRICTO del baseline fiel
  `arnesia-mapa-baseline.html` (@a01d845). NO reemplaza el baseline hasta firmarse (ver mockups/INDEX.md).
  Conserva TODO lo vigente (barra picker·META·artefactos · Guardia/Proceso/Base+bandas · edges · franja
  artefactos · inspector 3-tabs contrato fusionado + botonera staged) y SUMA (nada removido):
   · Barra: chip SELLO (manifiesto firmado + baseline hashes → estado + contador deriva) · INIT/DOCTOR
   · Capas ahora MULTI-TOGGLE apilable (decisión 4): + Llenado + Deriva (Tokens/Perf/Proceso = Fase 2).
   · Región nueva TERRENO (decisión 2) = conocimiento-del-proyecto (arquitectura·capabilities·carpetas·slots),
     propiedad del PROYECTO, el arnés lo exige/depende (inversión de propiedad). Árbol COLAPSABLE de hojas
     escuetas con PESO EN TOKENS + activación (siempre/condicional/demanda) → mapea "lo que pedimos" al
     contexto sin explotar el graph. Slots-a-llenar viven acá con estado de LLENADO (vacío/parcial/lleno).
   · Capa DERIVA (decisión 1): colorea CADA nodo/hoja por clase de autoría (original·modificado·a-pedido·
     no-reconocido) = la señal del loop forward. Distinta de `procedencia` L0 (honestidad del dato) — no la pisa.
   · Inspector: + tab RECETA (plantilla · lógica de llenado/scraping · preguntas de decisión) en slots/hojas.
   · Puente arnés↔código: hojas de Terreno = archivos REALES del proyecto (fuente_path real); los elementos
     del arnés que dependen dibujan edge `lee` a la rama de Terreno.
  SSoT del UI vigente = Storybook (web/src/widgets/map-canvas/**). Tokens = web/tokens/base.tokens.json.
-->
<style>
  :root{
    --background:#f2f4f7;--card:#ffffff;--secondary:#e9edf2;
    --foreground:#212832;--muted-foreground:#5d6a79;
    --border:#d5dbe3;--input:#c3cbd6;--primary:#a8742c;
    --c-skill:#2f74b5;--c-agent:#7455c2;--c-hook:#bb4c85;--c-knowledge:#20826f;--c-mcp:#586c80;--c-rule:#7a7a24;--c-command:#0f7f96;--c-plugin:#9c7b1a;--c-settings:#766753;--c-output-style:#a85274;--c-statusline:#5f7a52;
    --c-terreno:#7d5a3c; /* PROPUESTA — clase Terreno (proyecto) */
    --ok:#2e8f5e;--warn:#c96a2e;--crit:#c94545;
    /* deriva (PROPUESTA) — clases de autoría por-archivo */
    --d-original:#8b98a6;--d-mod:#c96a2e;--d-ped:#20826f;--d-desc:#c94545;
    --radius-md:8px;--radius-lg:9px;--radius-full:9999px;
    --text-xs:11px;--text-sm:12.5px;--text-base:14px;
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --background:#14171c;--card:#1b2027;--secondary:#242b34;
    --foreground:#e8ecf1;--muted-foreground:#94a1af;
    --border:#2d3743;--input:#3a4655;--primary:#d9a35b;
    --c-skill:#5b9dd9;--c-agent:#9b7fd4;--c-hook:#d46a9e;--c-knowledge:#4fb3a1;--c-mcp:#8195a9;--c-rule:#b5b558;--c-command:#49aec7;--c-plugin:#cdae54;--c-settings:#a4917c;--c-output-style:#cc7d9c;--c-statusline:#8aa87d;
    --c-terreno:#b98a5e;
    --ok:#57b380;--warn:#e0904f;--crit:#e25b5b;
    --d-original:#7c899a;--d-mod:#e0904f;--d-ped:#4fb3a1;--d-desc:#e25b5b;
  }}
  :root[data-theme="dark"]{
    --background:#14171c;--card:#1b2027;--secondary:#242b34;
    --foreground:#e8ecf1;--muted-foreground:#94a1af;
    --border:#2d3743;--input:#3a4655;--primary:#d9a35b;
    --c-skill:#5b9dd9;--c-agent:#9b7fd4;--c-hook:#d46a9e;--c-knowledge:#4fb3a1;--c-mcp:#8195a9;--c-rule:#b5b558;--c-command:#49aec7;--c-plugin:#cdae54;--c-settings:#a4917c;--c-output-style:#cc7d9c;--c-statusline:#8aa87d;
    --c-terreno:#b98a5e;
    --ok:#57b380;--warn:#e0904f;--crit:#e25b5b;
    --d-original:#7c899a;--d-mod:#e0904f;--d-ped:#4fb3a1;--d-desc:#e25b5b;
  }
  :root[data-theme="light"]{
    --background:#f2f4f7;--card:#ffffff;--secondary:#e9edf2;
    --foreground:#212832;--muted-foreground:#5d6a79;
    --border:#d5dbe3;--input:#c3cbd6;--primary:#a8742c;
    --c-skill:#2f74b5;--c-agent:#7455c2;--c-hook:#bb4c85;--c-knowledge:#20826f;--c-mcp:#586c80;--c-rule:#7a7a24;--c-command:#0f7f96;--c-plugin:#9c7b1a;--c-settings:#766753;--c-output-style:#a85274;--c-statusline:#5f7a52;
    --c-terreno:#7d5a3c;
    --ok:#2e8f5e;--warn:#c96a2e;--crit:#c94545;
    --d-original:#8b98a6;--d-mod:#c96a2e;--d-ped:#20826f;--d-desc:#c94545;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-base);-webkit-font-smoothing:antialiased}
  .app{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column}

  /* ══ MapBar ══ */
  .mapbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--card);padding:10px 16px;z-index:30}
  .picker{border:1px solid var(--border);background:var(--secondary);color:var(--foreground);border-radius:var(--radius-md);padding:4px 8px;font-family:var(--font-mono);font-size:var(--text-xs)}
  .meta{display:flex;flex-wrap:wrap;gap:6px}
  .mchip{border:1px solid var(--border);background:var(--secondary);color:var(--muted-foreground);border-radius:6px;padding:2px 6px;font-family:var(--font-mono);font-size:var(--text-xs)}
  .mchip b{color:var(--foreground);font-weight:600}
  .mchip.ctx{border-color:color-mix(in srgb,var(--primary) 30%,var(--border))}
  .mchip.ctx b{color:var(--primary)}
  .seg{display:flex;align-items:center;gap:2px;border:1px solid var(--border);background:var(--secondary);border-radius:var(--radius-lg);padding:2px}
  .seg .lbl{padding:0 6px;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground)}
  .seg button{font:inherit;font-size:var(--text-xs);cursor:pointer;border:0;background:transparent;color:var(--muted-foreground);border-radius:6px;padding:4px 10px}
  .seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--foreground);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .seg button:disabled{opacity:.4;cursor:not-allowed}
  .seg.capas button[aria-pressed="true"]::before{content:"◼ ";font-size:9px}
  .seg.capas button:not([disabled]):not([aria-pressed="true"])::before{content:"◻ ";font-size:9px}
  .seg.artefactos{margin-left:auto}

  /* Sello (manifiesto firmado + baseline de hashes) */
  .sello{display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid color-mix(in srgb,var(--ok) 45%,var(--border));background:color-mix(in srgb,var(--ok) 9%,var(--card));color:var(--foreground);border-radius:var(--radius-full);padding:3px 10px;font-family:var(--font-mono);font-size:var(--text-xs)}
  .sello .lock{color:var(--ok)}
  .sello .drift{color:var(--warn);border-left:1px solid var(--border);padding-left:7px}
  .sello.adoptado{border-color:color-mix(in srgb,var(--warn) 45%,var(--border));background:color-mix(in srgb,var(--warn) 9%,var(--card))}
  .sello.adoptado .lock{color:var(--warn)}
  /* Init / Doctor */
  .initctl{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);background:var(--secondary);border-radius:var(--radius-lg);padding:2px}
  .initctl .lbl{padding:0 6px;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground)}
  .initctl button{font:inherit;font-size:var(--text-xs);cursor:pointer;border:0;background:transparent;color:var(--muted-foreground);border-radius:6px;padding:4px 9px;display:inline-flex;align-items:center;gap:5px}
  .initctl button .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .initctl button.doctor .dot{background:var(--warn)}

  /* ══ Leyendas de overlay (aparecen con Deriva / Llenado) ══ */
  .legends{flex:none;display:flex;flex-wrap:wrap;gap:14px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border);overflow:hidden;max-height:0;transition:max-height .16s,padding .16s}
  .legends.on{max-height:80px;padding:8px 16px}
  .legend{display:flex;align-items:center;gap:10px}
  .legend .lg-ttl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground)}
  .legend .lg-item{display:inline-flex;align-items:center;gap:5px;font-size:var(--text-xs);color:var(--foreground)}
  .legend .sw{width:10px;height:10px;border-radius:3px}
  .legend .sw.ring{background:transparent;border:1.5px solid currentColor;border-radius:50%}

  /* ══ Canvas ══ */
  .viewport{position:relative;flex:1;overflow:hidden;cursor:grab;background:var(--background)}
  .viewport.grabbing{cursor:grabbing}
  .stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .content{position:relative;display:flex;flex-direction:column;gap:18px;padding:24px}
  svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
  .region{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;border:1px solid transparent}
  .region.r-guardia{background:color-mix(in srgb,var(--c-hook) 6%,var(--card));border-color:color-mix(in srgb,var(--c-hook) 16%,var(--border))}
  .region.r-proceso{background:color-mix(in srgb,var(--primary) 5%,var(--card));border-color:color-mix(in srgb,var(--primary) 14%,var(--border))}
  .region.r-soporte{background:color-mix(in srgb,var(--c-knowledge) 6%,var(--card));border-color:color-mix(in srgb,var(--c-knowledge) 16%,var(--border))}
  .region.r-terreno{background:color-mix(in srgb,var(--c-terreno) 6%,var(--card));border-color:color-mix(in srgb,var(--c-terreno) 18%,var(--border))}
  .region-hd{display:flex;align-items:center;gap:10px}
  .region-hd h2{margin:0;font-size:var(--text-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
  .region-hd .rule{flex:1;height:1px;background:var(--border)}
  .region-hd .owner{font-family:var(--font-mono);font-size:9px;color:var(--c-terreno);border:1px solid color-mix(in srgb,var(--c-terreno) 40%,transparent);border-radius:var(--radius-full);padding:1px 7px}
  .region-hd .ctxroll{font-family:var(--font-mono);font-size:9px;color:var(--muted-foreground);border:1px solid var(--border);background:var(--secondary);border-radius:var(--radius-full);padding:1px 7px}
  .band{display:flex;flex-direction:column;gap:8px}
  .band.dormida{opacity:.55}
  .band-hd{display:flex;align-items:center;gap:8px}
  .band-hd h3{margin:0;font-size:var(--text-sm);font-weight:600}
  .act-chip{font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);background:color-mix(in srgb,var(--ac) 11%,transparent);border-radius:var(--radius-full);padding:1px 7px;white-space:nowrap}
  .subband{border:1px solid var(--border);border-radius:var(--radius-md);background:color-mix(in srgb,var(--secondary) 38%,transparent)}
  .subband-hd{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;background:none;border:0;color:var(--foreground);font:inherit;cursor:pointer;text-align:left}
  .subband-hd.static{cursor:default}
  .subband-hd h4{margin:0;font-size:var(--text-sm);font-weight:600}
  .subband-hd .tw{font-size:11px;color:var(--muted-foreground);width:10px;flex:none}
  .subband-body{display:flex;flex-direction:column;gap:10px;padding:2px 12px 12px}
  .subband.collapsed .subband-body{display:none}
  .rule-grp-hd{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ac);opacity:.85;margin-bottom:4px}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .row .nw{width:224px}
  .count{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--muted-foreground);border:1px solid var(--border);background:var(--secondary);border-radius:var(--radius-full);padding:1px 7px}
  .empty{font-size:var(--text-xs);font-style:italic;color:var(--muted-foreground)}

  .procrow{display:flex;align-items:stretch;gap:0}
  .lane{flex:none;width:224px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card)}
  .lane-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:9px 12px}
  .lane-hd h3{margin:0;font-size:var(--text-sm);font-weight:600}
  .lane-body{display:flex;flex-direction:column;gap:10px;padding:12px}
  .gutter{flex:none;width:132px;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:44px 8px 0}
  .gutter.hidden{display:none}
  .artchip{display:flex;flex-direction:column;gap:1px;cursor:pointer;border:1px solid color-mix(in srgb,var(--c-knowledge) 40%,var(--border));border-left:3px solid var(--c-knowledge);background:color-mix(in srgb,var(--c-knowledge) 8%,var(--card));border-radius:var(--radius-md);padding:5px 8px;font:inherit;text-align:left}
  .artchip .a-nm{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--foreground);line-height:1.2}
  .artchip .a-meta{font-size:9px;color:var(--muted-foreground)}
  .artchip.externo{border-left-color:var(--c-mcp);background:color-mix(in srgb,var(--c-mcp) 8%,var(--card))}

  /* nodo */
  .node{position:relative;display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;cursor:pointer;border:1px solid var(--border);border-left:3px solid var(--tc,var(--border));border-radius:var(--radius-md);background:var(--secondary);padding:10px 12px;font:inherit;color:var(--foreground);transition:border-color .12s,box-shadow .12s}
  .node:hover{border-color:var(--tc,var(--input));box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 22%,transparent)}
  .node.sel{box-shadow:0 0 0 2px var(--tc)}
  .node.dim{opacity:.4}
  .node.support{margin-left:14px;background:color-mix(in srgb,var(--secondary) 55%,transparent)}
  .node.caja{border-left-width:5px;background:color-mix(in srgb,var(--tc) 9%,var(--secondary));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 22%,transparent)}
  .node.puesto{border-left-style:dashed}
  .node.compact{width:auto;flex-direction:row;align-items:center;gap:8px;padding:7px 12px}
  .node.compact .node-cmd,.node.compact .node-trans,.node.compact .caja-badge{display:none}
  .caja-badge{position:absolute;top:8px;right:8px;font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;color:var(--tc);border:1px solid var(--tc);border-radius:var(--radius-full);padding:0 6px;opacity:.9}
  .node-top{display:flex;align-items:flex-start;gap:7px;padding-right:40px}
  .node.compact .node-top{padding-right:0}
  .node-nm{font-family:var(--font-mono);font-size:var(--text-sm);font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .node-cmd{align-self:flex-start;font-family:var(--font-mono);font-size:var(--text-xs);color:var(--foreground);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:1px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node-trans{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9px;color:var(--tc);background:color-mix(in srgb,var(--tc) 8%,transparent);border:1px solid color-mix(in srgb,var(--tc) 30%,var(--border));border-radius:var(--radius-full);padding:0 7px}
  .node-trans::before{content:"\25C7";font-size:8px;opacity:.8}
  .glyph{flex:none;display:grid;place-items:center;width:17px;height:17px;background:var(--tc);color:var(--card);font-family:var(--font-mono);font-weight:700;font-size:10px;line-height:1}
  .glyph.square{border-radius:3px}.glyph.circle{border-radius:50%}.glyph.rounded{border-radius:4px}
  .glyph.diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .glyph.hexagon{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .glyph.shield{clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
  .glyph.doc{border-radius:2px;clip-path:polygon(0 0,72% 0,100% 24%,100% 100%,0 100%)}

  /* deriva overlay: punto de autoría en la esquina del nodo */
  .node .der-dot,.leaf .der-dot{width:8px;height:8px;border-radius:50%;background:var(--dd,var(--d-original));flex:none;box-shadow:0 0 0 2px var(--card)}
  .node .der-dot{position:absolute;top:8px;right:8px}
  .node.caja .der-dot{right:34px}
  .app:not(.lay-deriva) .der-dot{display:none}
  /* llenado overlay: aro de estado en hojas/slots */
  .app:not(.lay-llenado) .fillring{display:none}

  /* controles */
  .zoomctl{position:absolute;left:16px;bottom:16px;z-index:20;display:flex;flex-direction:column;gap:6px}
  .zoomctl button{font:inherit;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:var(--radius-md);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* ══ Terreno · árbol colapsable de hojas escuetas (mapea "lo que pedimos") ══ */
  .tree{display:flex;flex-direction:column;gap:3px}
  .tnode{display:flex;flex-direction:column}
  .trow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;border:1px solid transparent;border-radius:var(--radius-md);background:none;font:inherit;color:var(--foreground);padding:5px 8px;position:relative}
  .trow:hover{background:color-mix(in srgb,var(--c-terreno) 7%,transparent);border-color:color-mix(in srgb,var(--c-terreno) 20%,var(--border))}
  .trow.sel{border-color:var(--c-terreno);box-shadow:0 0 0 1px var(--c-terreno)}
  .trow .tw{width:12px;flex:none;font-size:10px;color:var(--muted-foreground)}
  .trow.leaf .tw{visibility:hidden}
  .tglyph{flex:none;display:grid;place-items:center;width:15px;height:15px;font-size:9px;font-family:var(--font-mono);font-weight:700;color:var(--card);background:var(--c-terreno)}
  .tglyph.rama{background:transparent;color:var(--c-terreno);font-size:12px}
  .tglyph.doc{border-radius:2px;clip-path:polygon(0 0,72% 0,100% 24%,100% 100%,0 100%)}
  .tglyph.slot{background:transparent;color:var(--muted-foreground);border:1.4px dashed var(--muted-foreground);border-radius:3px}
  .tname{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow.slot .tname{font-weight:500;color:var(--muted-foreground)}
  .fillring{width:11px;height:11px;border-radius:50%;flex:none;border:1.6px solid var(--muted-foreground)}
  .fillring.lleno{border-color:var(--ok);background:var(--ok)}
  .fillring.parcial{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
  .fillring.vacio{border-color:var(--muted-foreground);border-style:dashed;background:transparent}
  .tok{font-family:var(--font-mono);font-size:9px;color:var(--muted-foreground);border:1px solid var(--border);background:var(--secondary);border-radius:var(--radius-full);padding:0 6px;flex:none;white-space:nowrap}
  .tok.hot{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--border))}
  .tacc{font-family:var(--font-mono);font-size:9px;flex:none;white-space:nowrap;color:var(--ac);opacity:.9}
  .tkids{margin-left:16px;border-left:1px solid color-mix(in srgb,var(--c-terreno) 22%,var(--border));padding-left:6px;display:flex;flex-direction:column;gap:3px}
  .tnode.collapsed>.tkids{display:none}
  .rollup{font-family:var(--font-mono);font-size:9px;color:var(--muted-foreground);flex:none}
  .rollup b{color:var(--foreground);font-weight:600}

  /* ══ Inspector ══ */
  .drawer{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:88vw;background:var(--card);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.14);transform:translateX(100%);transition:transform .18s ease;z-index:40;display:flex;flex-direction:column;overflow:hidden}
  .drawer.open{transform:none}
  .dw-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}

     receta:{plantilla:"capability.yaml.hbs",llenado:"cosecha del código Luana → una hoja YAML por capacidad detectada",preguntas:[{q:"¿módulos a mapear?",a:"— pendiente"}]}},

 },
};
const SUPPORT_BANDS=[{id:"base",label:"Base · reglas y knowledge"},{id:"libreria-expertos",label:"Librería de expertos",act:"demanda"},{id:"meta-harness",label:"Meta-harness · config del arnés",act:"demanda"},{id:"terceros",label:"Terceros",act:"demanda"},{id:"marcas-dormidas",label:"Marcas dormidas",act:"dormida"}];
const DEL_PUESTO=new Set(["react-expert","std-prod","api-mcp","luana-plugin"]);

let current="dev-full-cycle",selected=null,artMode="auto",focus=null;
const layers={estructura:true,llenado:false,deriva:false};
const collapsed=new Set(); // ramas de terreno colapsadas
function fmtTok(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n);}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}
function handle(n){if(n.clase==="command")return n.id;if(n.clase==="skill")return"/"+n.id;if(n.clase==="subagent")return"@"+n.id;if(n.clase==="hook")return"evento";if(n.clase==="rule")return n.alw===false?"condicional":"always-on";return n.id;}

function nodeEl(n,opt){
  opt=opt||{};const k=KIND[n.clase]||KIND.skill;

    (opt.compact?"":`<span class="node-cmd">${esc(handle(n))}</span>`)+
    (n.trans?`<span class="node-trans">${esc(n.trans)}</span>`:"");

function regionHd(t,extra){const h=document.createElement("div");h.className="region-hd";h.innerHTML=`<h2>${esc(t)}</h2>`+(extra||"")+`<span class="rule"></span>`;return h;}
function nw(n){const w=document.createElement("div");w.className="nw";w.appendChild(nodeEl(n));return w;}
function selFases(g){const declared=g.arnes.fases||[];const fn=g.nodos.filter(n=>n.banda==="fase");const order=[...declared];fn.forEach(n=>{if(n.fase&&!order.includes(n.fase))order.push(n.fase);});return order.map(f=>({fase:f,nodos:fn.filter(n=>n.fase===f)}));}

// ── rollup de tokens del terreno (mapea "lo que pedimos" al contexto) ──
function walkTerreno(arr,cb){(arr||[]).forEach(t=>{cb(t);if(t.children)walkTerreno(t.children,cb);});}
function ctxBudget(g){let siempre=0,demanda=0,hojas=0;
  walkTerreno(g.terreno,t=>{
    if(t.clase==="rama")return;
    const n=t.rollupN||1,tok=t.rollupTok||t.tok||0;hojas+=n;
    if(t.act==="siempre")siempre+=tok;else demanda+=tok;
  });
  // reglas always-on del arnés también pesan siempre (aprox)
  return {siempre,demanda,hojas};
}

function render(g){
  const content=document.getElementById("content"),svg=document.getElementById("edges");
  [...content.querySelectorAll(".region")].forEach(n=>n.remove());
  // Guardia
  const rG=document.createElement("div");rG.className="region r-guardia";rG.appendChild(regionHd("Guardia · hooks transversales"));
  const rowG=document.createElement("div");rowG.className="row";

  if(!gu.length)rowG.innerHTML=`<span class="empty">— sin hooks —</span>`;else gu.forEach(n=>rowG.appendChild(nodeEl(n,{compact:true})));
  rG.appendChild(rowG);content.appendChild(rG);
  // Proceso + franja de artefactos
  const rP=document.createElement("div");rP.className="region r-proceso";rP.appendChild(regionHd("Proceso · carriles por fase"));
  const procrow=document.createElement("div");procrow.className="procrow";
  const fases=selFases(g);
  fases.forEach((l,i)=>{
    const sec=document.createElement("section");sec.className="lane";
    sec.innerHTML=`<div class="lane-hd"><h3>${esc(l.fase)}</h3><span class="count">${l.nodos.length}</span></div>`;
    const body=document.createElement("div");body.className="lane-body";
    [...l.nodos].sort((a,b)=>(b.caja?1:0)-(a.caja?1:0)).forEach(n=>{const el=nodeEl(n);if(!n.caja&&l.nodos.some(x=>x.caja))el.classList.add("support");body.appendChild(el);});
    sec.appendChild(body);procrow.appendChild(sec);
    if(i<fases.length-1){procrow.appendChild(gutterFor(g,fases[i].fase));}
  });
  rP.appendChild(procrow);content.appendChild(rP);
  // Base
  const rS=document.createElement("div");rS.className="region r-soporte";rS.appendChild(regionHd("Base · conocimiento, reglas y soporte del arnés"));
  SUPPORT_BANDS.forEach(bd=>{const ns=g.nodos.filter(n=>n.banda===bd.id);if(!ns.length)return;rS.appendChild(bd.id==="base"?baseBand(ns):bandBlock(bd,ns));});
  content.appendChild(rS);
  // Terreno (NUEVA región · proyecto)
  if(g.terreno&&g.terreno.length){
    const b=ctxBudget(g);
    const rT=document.createElement("div");rT.className="region r-terreno";
    rT.appendChild(regionHd("Terreno · lo que el arnés exige del proyecto",
      `<span class="owner" title="Inversión de propiedad: estos activos son del PROYECTO; el arnés los exige, gestiona y depende de ellos.">propiedad: proyecto</span>`+
      `<span class="ctxroll" title="Presupuesto de contexto — mapea 'lo que pedimos'. El árbol carga solo la rama justa: nunca todo, nunca menos de lo necesario.">contexto · siempre ~${fmtTok(b.siempre)} · a-demanda ~${fmtTok(b.demanda)} · ${b.hojas} hojas</span>`));
    const tree=document.createElement("div");tree.className="tree";
    g.terreno.forEach(t=>tree.appendChild(treeNode(t,0)));
    rT.appendChild(tree);content.appendChild(rT);
  }
  content.appendChild(svg);
  requestAnimationFrame(()=>drawEdges(g,focus));
}

// ── Terreno: árbol colapsable ──
function treeNode(t,depth){
  const wrap=document.createElement("div");wrap.className="tnode";
  const isBranch=(t.clase==="rama"||t.children);
  const isRollup=t.clase==="rollup";
  if(isBranch&&depth>=1&&!collapsed.has(t.id))collapsed.add(t.id); // ramas internas colapsadas por defecto
  if(isBranch&&collapsed.has(t.id))wrap.classList.add("collapsed");
  const row=document.createElement("button");
  row.className="trow"+(isBranch?" branch":" leaf")+(t.clase==="slot"?" slot":"");
  row.dataset.nodeId=t.id;
  const gcls=t.clase==="slot"?"slot":(isBranch?"rama":"doc");
  const gchar=isRollup?"…":(t.clase==="slot"?"◌":(isBranch?(collapsed.has(t.id)?"▸":"▾"):"▤"));
  const tw=isBranch?`<span class="tw">${collapsed.has(t.id)?"▸":"▾"}</span>`:`<span class="tw"></span>`;
  const fill=t.llenado?`<span class="fillring ${t.llenado}" title="llenado: ${esc(LLENADO[t.llenado].label)}"></span>`:"";
  const tokN=t.rollupTok||t.tok;
  const tok=tokN?`<span class="tok ${tokN>=8000?"hot":""}" title="peso estimado al cargar en contexto">~${fmtTok(tokN)} tok</span>`:"";
  const acc=t.act?`<span class="tacc" style="--ac:${ACT[t.act].tone}" title="${esc(ACT[t.act].label)}">${esc(t.act)}</span>`:"";
  const roll=isRollup?`<span class="rollup"><b>${t.rollupN}</b> hojas · ~${fmtTok(t.rollupTok)} tok</span>`:"";
  row.innerHTML=`${tw}<span class="tglyph ${gcls}">${esc(gchar)}</span><span class="tname">${esc(t.nombre)}</span>${fill}${roll}${acc}${tok}`;
  if(isBranch){row.addEventListener("click",e=>{e.stopPropagation();const c=wrap.classList.toggle("collapsed");if(c)collapsed.add(t.id);else collapsed.delete(t.id);row.querySelector(".tw").textContent=c?"▸":"▾";requestAnimationFrame(()=>drawEdges(GRAPHS[current],focus));});}
  else if(!isRollup){row.addEventListener("click",()=>openTerreno(t));}
  wrap.appendChild(row);
  if(isBranch&&t.children){const kids=document.createElement("div");kids.className="tkids";t.children.forEach(c=>kids.appendChild(treeNode(c,depth+1)));wrap.appendChild(kids);}
  return wrap;
}

function gutterFor(g,laneFase){
  const gut=document.createElement("div");gut.className="gutter"+(artMode==="off"?" hidden":"");
  if(artMode==="off")return gut;
  const chips=(g.artefactos||[]).filter(a=>a.lane===laneFase);
  const show=artMode==="todos"||(artMode==="auto"&&selected&&chips.some(a=>a.productor===selected));
  if(!show){gut.classList.add("hidden");return gut;}
  chips.forEach(a=>{
    const b=document.createElement("button");b.className="artchip"+(a.externo?" externo":"");
    b.innerHTML=`<span class="a-nm">${esc(a.art)}</span><span class="a-meta">${a.externo?"externo · usuario":"↳ "+esc(a.productor)}</span>`;
    b.addEventListener("click",()=>{const p=g.nodos.find(n=>n.id===a.productor);if(p)openInspector(p);});
    gut.appendChild(b);
  });
  return gut;
}
function actChip(kind){const a=ACT[kind];return a&&a.label?`<span class="act-chip" style="--ac:${a.tone}">${esc(a.label)}</span>`:"";}
function bandBlock(bd,ns){const band=document.createElement("div");band.className="band"+(bd.act==="dormida"?" dormida":"");band.innerHTML=`<div class="band-hd"><h3>${esc(bd.label)}</h3>${actChip(bd.act)}<span class="count">${ns.length}</span></div>`;const row=document.createElement("div");row.className="row";ns.forEach(n=>row.appendChild(nw(n)));band.appendChild(row);return band;}
function baseBand(ns){
  const rules=ns.filter(n=>n.clase==="rule"),alw=rules.filter(r=>r.alw),cond=rules.filter(r=>!r.alw),rest=ns.filter(n=>n.clase!=="rule");
  const wrap=document.createElement("div");wrap.className="band";
  const g=document.createElement("div");g.className="subband collapsed";
  g.innerHTML=`<button class="subband-hd" aria-expanded="false"><span class="tw">▸</span><h4>Reglas</h4><span class="count">${rules.length}</span><span class="act-chip" style="--ac:var(--crit)">${alw.length} siempre</span><span class="act-chip" style="--ac:var(--warn)">${cond.length} condicional</span></button>`;
  const body=document.createElement("div");body.className="subband-body";
  const grp=(arr,tag,tone)=>{if(!arr.length)return;const d=document.createElement("div");d.innerHTML=`<div class="rule-grp-hd" style="--ac:${tone}">${esc(tag)}</div>`;const row=document.createElement("div");row.className="row";arr.forEach(n=>row.appendChild(nw(n)));d.appendChild(row);body.appendChild(d);};
  grp(alw,"siempre en contexto (CLAUDE.md)","var(--crit)");grp(cond,"carga condicional (paths:)","var(--warn)");
  g.appendChild(body);
  g.querySelector(".subband-hd").addEventListener("click",()=>{const c=g.classList.toggle("collapsed");g.querySelector(".tw").textContent=c?"▸":"▾";requestAnimationFrame(()=>drawEdges(GRAPHS[current],focus));});
  wrap.appendChild(g);
  if(rest.length){const k=document.createElement("div");k.className="subband";k.innerHTML=`<div class="subband-hd static"><h4>Knowledge &amp; servicios</h4><span class="count">${rest.length}</span><span class="act-chip" style="--ac:var(--c-knowledge)">leído por skills</span></div>`;const row=document.createElement("div");row.className="row";row.style.padding="2px 12px 12px";rest.forEach(n=>row.appendChild(nw(n)));k.appendChild(row);wrap.appendChild(k);}
  return wrap;

function drawEdges(g,focusId){
  const content=document.getElementById("content"),svg=document.getElementById("edges");
  [...svg.querySelectorAll("path.edge")].forEach(p=>p.remove());
  if(!layers.estructura)return; // Estructura off → sin edges (los overlays quedan solos)
  const base=content.getBoundingClientRect();
  for(const e of(g.edges||[])){
    const spine=e.tipo==="invoca",touches=focusId&&(e.de===focusId||e.a===focusId);
    if(!spine&&!touches)continue;
    const from=content.querySelector(`[data-node-id="${e.de}"]`),to=content.querySelector(`[data-node-id="${e.a}"]`);
    if(!from||!to)continue;const f=from.getBoundingClientRect(),t=to.getBoundingClientRect();if(!f.width||!t.width)continue;
    const x1=(f.right-base.left)/z,y1=(f.top+f.height/2-base.top)/z,x2=(t.left-base.left)/z,y2=(t.top+t.height/2-base.top)/z,dx=Math.max(30,Math.abs(x2-x1)/2);
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("class","edge");
    p.setAttribute("d",`M ${x1},${y1} C ${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);p.setAttribute("fill","none");
    const s=STROKE[e.tipo]||STROKE.invoca;p.setAttribute("stroke",s.color);if(s.dash)p.setAttribute("stroke-dasharray",s.dash);
    let op=s.opacity,w=1.6;if(focusId){if(touches){op=.95;w=2.2;}else if(spine)op=.2;}
    p.setAttribute("opacity",op);p.setAttribute("stroke-width",String(w));if(e.tipo!=="lee")p.setAttribute("marker-end","url(#arr)");
    svg.appendChild(p);
  }
  const nodes=content.querySelectorAll(".node");
  if(!focusId)nodes.forEach(n=>n.classList.remove("dim"));
  else{const rel=new Set([focusId]);for(const e of(g.edges||[])){if(e.de===focusId)rel.add(e.a);if(e.a===focusId)rel.add(e.de);}nodes.forEach(n=>n.classList.toggle("dim",!rel.has(n.dataset.nodeId)));}
}

/* ── Inspector: harness (Resumen·Contenido·Corridas) o terreno (Resumen·Receta·Contenido) ── */
let insTab="resumen";

function openDrawer(){const d=document.getElementById("drawer");d.classList.add("open");d.setAttribute("aria-hidden","false");}
function field(k,v){return v?`<div class="field"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`:"";}
function section(t,inner,tip){return `<section class="sec"><h4>${esc(t)}<span class="info" title="${esc(tip||"eje del contrato fusionado")}">i</span></h4>${inner}</section>`;}
function derivaPill(d){const x=DERIVA[d||"original"];return `<span class="pill" style="color:${x.tone};border-color:color-mix(in srgb,${x.tone} 45%,var(--border))">deriva: ${esc(x.label)}</span>`;}
function llenadoPill(l){const x=LLENADO[l];return `<span class="pill" style="color:${x.tone};border-color:color-mix(in srgb,${x.tone} 45%,var(--border))">${esc(x.label)}</span>`;}

function paintInspector(n){
  const d=document.getElementById("drawer"),k=KIND[n.clase]||KIND.skill,c=n.contract;
  const tabsList=["resumen","contenido","corridas"];
  const tabs=tabsList.map(t=>`<button class="dw-tab" role="tab" aria-selected="${insTab===t}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("");
  let pane="";
  if(insTab==="resumen"){
    let s=section("Clasificación",field("banda",esc(n.banda))+field("fase",esc(n.fase))+field("procedencia",esc(n.procedencia))+field("deriva",derivaPill(n.deriva))+(c?field("arquetipo",esc(c.arquetipo))+field("perfil",esc(c.perfil_harness))+field("caja",c.caja===false?"no":(n.caja?"sí":"no")):""),"procedencia = honestidad del dato (L0). deriva = autoría por-archivo (loop forward).");
    s+=section("Fuente",field("fuente",esc(n.fuente_path||"— pendiente del reconocedor"))+field("origen",DEL_PUESTO.has(n.id)?"del-puesto · PROPUESTA":"estándar"));
    if(n.clase==="rule")s+=section("Activación",field("carga",n.alw?"siempre en contexto · PROPUESTA":"condicional (paths:) · PROPUESTA"));
    if(!c){s+=section("Rol",`<p class="mut">${esc(k.label)} — sin contrato de caja.</p>`);}
    else{
      if(c.why)s+=section("Intención",`<p class="fg">${esc(c.why)}</p>`);
      if(c.capabilities)s+=section("Capabilities",`<ul class="caps">${c.capabilities.map(cap=>`<li><span class="mono mut">${esc(cap.id)}</span> ${esc(cap.what)}<div class="mut">✓ ${esc(cap.success)}</div></li>`).join("")}</ul>`);
      if(c.necesita&&c.necesita.length)s+=section("Necesita",`<div class="chips">${c.necesita.map(inp=>`<button class="chip" data-goto="${esc(inp.de)}" ${inp.de.includes(":")?"":"disabled"}>${esc(inp.art)}<span class="org">← ${esc(inp.de)}</span></button>`).join("")}</div>`,"insumos = inputs del contrato Necesita (L0). Un insumo de terreno:… salta al Terreno.");
      if(c.entrega&&c.entrega.length)s+=section("Entrega",`<ul class="caps">${c.entrega.map(o=>`<li>${esc(o.art)}${o.escritor_unico?`<span class="mut"> · escritor único</span>`:""}</li>`).join("")}</ul>`);
      if(c.ruta&&c.ruta.length)s+=section("Ruta",`<div class="chips">${c.ruta.map(r=>`<span>→ <button class="chip">${esc(r.a)}</button>${r.si?`<span class="mut"> si ${esc(r.si)}</span>`:""}</span>`).join("")}</div>`);
      if(c.gate)s+=section("Gate",field("tipo",esc(c.gate.tipo))+(c.gate.detalle?`<p class="fg">${esc(c.gate.detalle)}</p>`:""));
      if(c.handoff)s+=section("Handoff",`<p class="fg">${esc(c.handoff.cuando)} <span class="mut">→ ${esc(c.handoff.a)}</span></p>`);
    }
    const gateNone=c&&c.gate&&c.gate.tipo==="none";
    let hall="";
    if(gateNone)hall+=`<p class="hallazgo crit"><b>gate:none</b> — caja sin eval formal (A4): hueco visible, no blanco.</p>`;
    if(n.deriva==="no-reconocido")hall+=`<p class="hallazgo warn"><b>deriva: no-reconocido</b> — pieza ajena/sin sello. Cosechar o descartar (loop forward).</p>`;
    if(n.deriva==="modificado")hall+=`<p class="hallazgo warn"><b>deriva: modificado</b> — divergiste del canónico. Candidato a cosechar → publicar upstream.</p>`;
    if(!hall)hall=`<p class="mut">Sin hallazgos abiertos.</p>`;
    s+=section("Hallazgos",hall);
    s+=`<div class="dw-actions"><button class="act primary" disabled title="Se cablea en Fase de edición">Editar conversando</button><button class="act" disabled title="loop forward">Cosechar deriva → canónico</button><button class="act" disabled>Promover a estable</button><button class="act" disabled>Ver en Historia</button><p class="act-note">staged — «Editar conversando» + «Cosechar» se cablean en la Fase de edición/publish (Fase 1 core).</p></div>`;
    pane=s;
  }else if(insTab==="contenido"){
    pane=`<span class="chip-versiona">versiona con el arnés</span>`+section("Fuente del componente",
      (n.fuente_path?`<div class="src">${["# "+n.nombre,"(fuente real la sirve el daemon, confinada al dir del arnés)"].map((l,i)=>`<div class="ln"><span>${i+1}</span><code>${esc(l)}</code></div>`).join("")}</div>`:`<p class="mut">Sin <span class="mono">fuente_path</span> — pendiente del reconocedor (nomenclatura §3).</p>`))+
      `<div class="dw-actions"><button class="act primary" disabled title="Fase edición — diff antes de confirmar">Editar fuente</button><button class="act" disabled>Editar conversando (dock)</button><p class="act-note">staged — guardar = diff + nota → nace beta → tren; versiones inmutables.</p></div>`;
  }else{
    pane=section("Corridas donde actuó",`<p class="mut">Sin corridas indexadas — llegan con el indexer JSONL (Fase 2).</p>`+((n.caja)?`<p class="src-note">al implementar listan primero las corridas de <span class="mono">POST …/boxes/${esc(n.id)}/run</span> y la sesión CC viva.</p>`:""))+
      `<div class="dw-actions"><button class="act" disabled>Ver todas las corridas del arnés</button></div>`;
  }
  d.innerHTML=head(k,n.nombre,k.label+" · "+handle(n),k.color)+`<div class="dw-tabs" role="tablist">${tabs}</div><div class="dw-body">${pane}</div>`;
  wireDrawer(()=>paintInspector(n));
}

function paintTerreno(t){
  const d=document.getElementById("drawer"),k=KIND.terreno,c=t.receta;
  const tabsList=c?["resumen","receta","contenido"]:["resumen","contenido"];
  if(!tabsList.includes(insTab))insTab="resumen";

      field("región","Terreno · proyecto")+
      field("tipo",t.clase==="slot"?"slot a-llenar":(t.children?"rama (árbol)":"hoja escueta"))+

      field("deriva",derivaPill(t.deriva))+
      field("activación",t.act?`<span class="pill" style="color:${ACT[t.act].tone}">${esc(t.act)}</span> <span class="mut">${esc(ACT[t.act].label)}</span>`:"—")+
      field("peso ctx",(t.rollupTok||t.tok)?`~${fmtTok(t.rollupTok||t.tok)} tok`+(t.rollupN?` · ${t.rollupN} hojas`:""):"—"),
      "Terreno = conocimiento-del-proyecto. Propiedad del PROYECTO; el arnés lo exige/depende (inversión de propiedad). El peso ctx mapea 'lo que pedimos'.");
    if(t.nota)s+=section("Qué es",`<p class="fg">${esc(t.nota)}</p>`);
    s+=section("Fuente (puente arnés↔código)",field("path",`<span class="mono">${esc(t.fuente||"—")}</span>`),"El puente: la hoja ES un archivo real del proyecto. El arnés lo referencia por path; no lo posee.");
    // dependido-por: quién del arnés lee esta rama/hoja
    const g=GRAPHS[current];const deps=(g.edges||[]).filter(e=>e.a===t.id&&e.tipo==="lee").map(e=>e.de);
    if(deps.length)s+=section("Dependido por",`<div class="chips">${deps.map(id=>{const nn=g.nodos.find(x=>x.id===id);return `<button class="chip" data-node="${esc(id)}">${esc(nn?nn.nombre:id)}</button>`;}).join("")}</div>`,"Elementos del arnés que LEEN este terreno. Si cambia, ellos se ven afectados.");
    // hallazgos
    let hall="";
    if(t.llenado==="vacio")hall+=`<p class="hallazgo warn"><b>slot vacío</b> — el arnés lo exige y el proyecto no lo tiene. Llenar con la receta.</p>`;
    if(t.llenado==="parcial")hall+=`<p class="hallazgo warn"><b>parcial</b> — faltan respuestas de decisión (ver Receta).</p>`;
    if(t.deriva==="no-reconocido")hall+=`<p class="hallazgo warn"><b>no-reconocido</b> — fuera del sello. Adoptar o descartar.</p>`;
    if(!hall)hall=`<p class="hallazgo ok">En regla — sellado, lleno, sin deriva pendiente.</p>`;
    s+=section("Hallazgos",hall);
    s+=`<div class="dw-actions">`+
      (t.clase==="slot"?`<button class="act primary" disabled title="Fase edición — corre la receta">Llenar slot (correr receta)</button>`:`<button class="act primary" disabled title="Fase edición">Editar hoja</button>`)+
      `<button class="act" disabled>Abrir en el árbol</button><p class="act-note">staged — la autoría/edición del terreno se cablea en la Fase de edición (mutación L0 + serialización a archivos).</p></div>`;
    pane=s;
  }else if(insTab==="receta"){
    pane=section("Plantilla",`<p class="fg mono">${esc(c.plantilla)}</p>`,"La forma destino de la hoja: el molde que se instancia.")+
      section("Lógica de llenado (scraping)",`<p class="fg">${esc(c.llenado)}</p>`,"Cómo la fábrica intenta llenar sola desde el proyecto (scraping/detección) antes de preguntarte.")+
      section("Preguntas de decisión",`<ul class="qa">${c.preguntas.map(p=>`<li><span class="q">${esc(p.q)}</span><span class="a ${/pendiente|—/.test(p.a)?"pend":""}">${esc(p.a)}</span></li>`).join("")}</ul>`,"Lo que la receta no puede scrapear: te lo pregunta. Respuestas pendientes = llenado parcial.")+
      `<div class="dw-actions"><button class="act primary" disabled title="Fase edición">Correr receta → llenar</button><button class="act" disabled>Editar receta</button><p class="act-note">staged — receta = plantilla + scraping + preguntas. Ver también capa Llenado.</p></div>`;
  }else{
    pane=`<span class="chip-versiona">archivo del proyecto</span>`+section("Contenido de la hoja",
      (t.llenado==="vacio")?`<p class="mut">Vacío — el slot aún no se llenó. Corré la receta (tab Receta).</p>`:
      `<div class="src">${["# "+t.nombre,"(hoja escueta — contenido servido confinado al proyecto)"].map((l,i)=>`<div class="ln"><span>${i+1}</span><code>${esc(l)}</code></div>`).join("")}</div>`)+
      `<div class="dw-actions"><button class="act primary" disabled title="Fase edición — diff antes de confirmar">Editar fuente</button><p class="act-note">staged — es archivo del PROYECTO; el arnés lo edita bajo su doctrina, no lo posee.</p></div>`;
  }
  d.innerHTML=head(k,t.nombre,"Terreno · "+(t.clase==="slot"?"slot a-llenar":"hoja"),k.color)+`<div class="dw-tabs" role="tablist">${tabs}</div><div class="dw-body">${pane}</div>`;
  wireDrawer(()=>paintTerreno(t));
}

function head(k,nombre,sub,color){
  return `<header class="dw-head"><span class="glyph ${k.shape}" style="--tc:${color}">${esc(k.char)}</span><div class="dw-id"><div class="dw-nombre">${esc(nombre)}</div><div class="dw-handle">${esc(sub)}</div></div><button class="dw-expand" title="Ampliar">⤢</button><button class="dw-close" id="dw-close" title="Cerrar">✕</button></header>`;
}
function wireDrawer(repaint){
  const d=document.getElementById("drawer");
  d.querySelector("#dw-close").onclick=()=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");selected=null;document.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel"));if(artMode==="auto")render(GRAPHS[current]);};
  d.querySelectorAll(".dw-tab").forEach(b=>b.onclick=()=>{insTab=b.dataset.tab;repaint();});
  d.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{const ref=b.dataset.goto;if(ref&&ref.startsWith("terreno:")){const id="t-"+ref.split(":")[1];const t=findTerreno(GRAPHS[current].terreno,id);if(t)openTerreno(t);}});
  d.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{const nn=GRAPHS[current].nodos.find(x=>x.id===b.dataset.node);if(nn)openInspector(nn);});
}
function findTerreno(arr,id){for(const t of(arr||[])){if(t.id===id)return t;if(t.children){const r=findTerreno(t.children,id);if(r)return r;}}return null;}

/* ── Sello: clic → manifiesto + deriva ── */
function paintSello(g){
  const d=document.getElementById("drawer"),s=g.arnes.sello,adopt=s.estado==="adoptado";
  const der=Object.keys(DERIVA).map(kk=>{const x=DERIVA[kk];return `<div class="field"><span class="k">${esc(x.label)}</span><span class="v"><span class="pill" style="color:${x.tone};border-color:color-mix(in srgb,${x.tone} 45%,var(--border))">${esc(x.sub)}</span></span></div>`;}).join("");
  let pane=section("Manifiesto firmado",
    field("estado",`<span class="pill" style="color:${adopt?"var(--warn)":"var(--ok)"}">${esc(s.estado)}</span>`)+
    field("id",`<span class="mono">${esc(s.id)}</span>`)+field("versión",`<span class="mono">${esc(s.version)}</span>`)+
    field("marketplace",`<span class="mono">${esc(g.arnes.marketplace)}</span>`)+field("firma",esc(s.firma)),
    "Sello = manifiesto de procedencia FIRMADO dentro del arnés. Identidad + origen + firma de fábrica + clases de paths.")+
  section("Baseline de hashes",
    field("archivos",`${s.baseline} · hash por-archivo`)+field("deriva viva",`<span class="pill" style="color:var(--warn)">${s.deriva_n} archivos</span>`),
    "Al conectar arnesia: verifica la firma y diffea cada archivo contra el baseline → clase de deriva. Multi-usuario: baseline por versión de marketplace.")+
  section("Clases de deriva",der,"Las 4 clases que el diff produce (capa Deriva).")+
  (adopt?`<p class="hallazgo warn"><b>arnés sin firma → adopción</b> — la fábrica generará manifiesto + baseline la 1ª vez (semilla). Caso Vitalia/bootstrap.</p>`:`<p class="hallazgo ok">Sello verificado — firma válida, baseline íntegro.</p>`)+
  `<div class="dw-actions"><button class="act primary" disabled>Ver capa Deriva en el mapa</button><button class="act" disabled>Re-sellar / adoptar</button><p class="act-note">staged — el motor de sello+diff es del core de Fase 1.</p></div>`;
  d.innerHTML=head({shape:"rounded",char:"⬡",label:"Sello"},"Sello del arnés",g.arnes.rol,"var(--ok)")+`<div class="dw-body">${pane}</div>`;
  d.querySelector("#dw-close").onclick=()=>{d.classList.remove("open");d.setAttribute("aria-hidden","true");};
  d.querySelector(".act.primary").onclick=null;
  openDrawer();
}

/* ── barra ── */
function renderSello(g){const s=g.arnes.sello,el=document.getElementById("sello");el.className="sello"+(s.estado==="adoptado"?" adoptado":"");el.innerHTML=`<span class="lock">${s.estado==="adoptado"?"⬡":"⬡"}</span> sello · ${esc(s.estado)}<span class="drift" title="${s.deriva_n} archivos con deriva viva">deriva ${s.deriva_n}</span>`;}
function renderInit(g){const i=g.arnes.init,dc=g.arnes.doctor,ib=document.getElementById("init"),db=document.getElementById("doctor");
  ib.querySelector(".dot").style.background=i.estado==="ok"?"var(--ok)":"var(--warn)";ib.childNodes[1].textContent=i.estado==="ok"?" init ✓":" init ⚠";
  db.querySelector(".dot").style.background=dc.estado&&/desvío|recomendado/.test(dc.estado)?"var(--warn)":"var(--ok)";}
function renderMeta(g){document.getElementById("meta").innerHTML=[["empresa",g.arnes.empresa],["rol",g.arnes.rol],["reporta a",g.arnes.reporta_a||"—"]].map(([kk,v])=>`<span class="mchip">${esc(kk)} <b>${esc(v)}</b></span>`).join("");}
function renderLegends(){
  const box=document.getElementById("legends");let h="";
  if(layers.deriva)h+=`<div class="legend"><span class="lg-ttl">Deriva (autoría)</span>${Object.keys(DERIVA).map(kk=>{const x=DERIVA[kk];return `<span class="lg-item"><span class="sw ring" style="color:${x.tone}"></span>${esc(x.label)}</span>`;}).join("")}</div>`;
  if(layers.llenado)h+=`<div class="legend"><span class="lg-ttl">Llenado</span>${Object.keys(LLENADO).map(kk=>{const x=LLENADO[kk];return `<span class="lg-item"><span class="sw" style="background:${x.tone}"></span>${esc(x.label)}</span>`;}).join("")}<span class="lg-item mut" style="color:var(--muted-foreground)">· los slots vacíos traen receta</span></div>`;
  box.innerHTML=h;box.classList.toggle("on",!!h);
}
function applyLayers(){const app=document.getElementById("app");app.classList.toggle("lay-estructura",layers.estructura);app.classList.toggle("lay-deriva",layers.deriva);app.classList.toggle("lay-llenado",layers.llenado);renderLegends();requestAnimationFrame(()=>drawEdges(GRAPHS[current],focus));}

document.getElementById("picker").onchange=e=>{current=e.target.value;selected=null;collapsed.clear();render(GRAPHS[current]);renderMeta(GRAPHS[current]);renderSello(GRAPHS[current]);renderInit(GRAPHS[current]);requestAnimationFrame(fit);document.getElementById("drawer").classList.remove("open");};
document.getElementById("seg-art").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;artMode=b.dataset.a;[...document.querySelectorAll("#seg-art button")].forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.a===artMode)));render(GRAPHS[current]);requestAnimationFrame(()=>drawEdges(GRAPHS[current],focus));});
document.getElementById("seg-capa").addEventListener("click",e=>{const b=e.target.closest("button[data-lay]:not([disabled])");if(!b)return;const key=b.dataset.lay;layers[key]=!layers[key];b.setAttribute("aria-pressed",String(layers[key]));applyLayers();});
document.getElementById("sello").onclick=()=>paintSello(GRAPHS[current]);
document.getElementById("init").onclick=()=>paintSello(GRAPHS[current]);
document.getElementById("doctor").onclick=()=>paintSello(GRAPHS[current]);

/* ── zoom/pan/hover ── */
let z=1,ox=24,oy=24;
function applyT(){document.getElementById("stage").style.transform=`translate(${ox}px,${oy}px) scale(${z})`;drawEdges(GRAPHS[current],focus);}
function fit(){const c=document.getElementById("content"),vp=document.getElementById("viewport");const cw=c.scrollWidth,ch=c.scrollHeight,vw=vp.clientWidth,vh=vp.clientHeight;z=+Math.min((vw-48)/cw,(vh-48)/ch,1).toFixed(3);ox=Math.max(24,(vw-cw*z)/2);oy=24;applyT();}
document.getElementById("zin").onclick=()=>{z=Math.min(2,+(z+0.1).toFixed(2));applyT();};
document.getElementById("zout").onclick=()=>{z=Math.max(0.4,+(z-0.1).toFixed(2));applyT();};
document.getElementById("zfit").onclick=fit;
const vp=document.getElementById("viewport");let drag=null;
vp.addEventListener("mousedown",e=>{if(e.target.closest(".node,.artchip,.zoomctl,.drawer,.trow"))return;drag={x:e.clientX,y:e.clientY,ox,oy};vp.classList.add("grabbing");});
window.addEventListener("mousemove",e=>{if(!drag)return;ox=drag.ox+(e.clientX-drag.x);oy=drag.oy+(e.clientY-drag.y);applyT();});
window.addEventListener("mouseup",()=>{drag=null;vp.classList.remove("grabbing");});
vp.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();z=Math.min(2,Math.max(0.4,+(z-Math.sign(e.deltaY)*0.1).toFixed(2)));applyT();},{passive:false});
const contentEl=document.getElementById("content");
contentEl.addEventListener("mouseover",e=>{const n=e.target.closest(".node");if(!n||n.dataset.nodeId===focus)return;focus=n.dataset.nodeId;drawEdges(GRAPHS[current],focus);});
contentEl.addEventListener("mouseout",e=>{const n=e.target.closest(".node");if(!n)return;const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest(".node"):null;if(to&&to.dataset.nodeId===focus)return;focus=null;drawEdges(GRAPHS[current],focus);});

render(GRAPHS[current]);renderMeta(GRAPHS[current]);renderSello(GRAPHS[current]);renderInit(GRAPHS[current]);applyLayers();requestAnimationFrame(fit);
new ResizeObserver(()=>drawEdges(GRAPHS[current],focus)).observe(document.getElementById("content"));
</script>
