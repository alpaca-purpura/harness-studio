# GoReleaser — releases del binario `arnesia` standalone (daemon + CLI: serve/index/
# conformance/publish). Los INSTALADORES de escritorio (app Tauri con la UI) NO salen de
# aquí: los produce `scripts/bundle.sh` (tauri build). Este pipeline cubre el caso
# "solo el daemon/CLI" (headless, servidores, CI de arneses) y los artefactos sidecar.
# Correr: `goreleaser release --snapshot --clean` (local) · en CI al taggear semver.
version: 2

project_name: arnesia

builds:
  - main: ./cmd/arnesia
    binary: arnesia
    env: [CGO_ENABLED=0]      # puro Go (modernc/sqlite cuando llegue el índice real).
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude: ["^docs", "^chore"]
