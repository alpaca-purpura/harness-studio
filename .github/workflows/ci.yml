# CI — todo check rompe el merge (enforced_by de arch/conventions/ci.md).
# Jobs paralelos = required status checks en main. Este workflow vuelve «enforced» los `status:
# proposed` de arch/ cuando el código aterrice.
#
# NOTA (honestidad): declarado; hoy no hay código (fase 5). Los `if: hashFiles(...)` evitan que los
# jobs fallen en un repo sin fuentes todavía. Module path y `web/` son provisionales.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "stable" }
      - name: golangci-lint
        if: ${{ hashFiles('go.mod') != '' }}
        uses: golangci/golangci-lint-action@v7    # v7 = golangci-lint v2
      - name: format check
        if: ${{ hashFiles('go.mod') != '' }}
        run: golangci-lint fmt --diff
      - name: go-arch-lint (grafo de imports, arch/fitness)
        if: ${{ hashFiles('go.mod') != '' }}
        run: go run github.com/fe3dback/go-arch-lint@latest check --project-path arch/fitness
      - name: test
        if: ${{ hashFiles('go.mod') != '' }}
        run: go test ./... -race
      - name: build
        if: ${{ hashFiles('go.mod') != '' }}
        run: go build ./...

  ts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.19" }           # Storybook 10 = ESM-only, Node ≥ 20.16/22.19/24
      - run: ${{ hashFiles('web/package.json') != '' && 'npm ci' || 'echo no-web-yet' }}
      - name: biome
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npx biome ci .
      - name: types
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npx tsc --noEmit
      - name: boundaries (dependency-cruiser, FSD)
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npx depcruise src --config .dependency-cruiser.js
      - name: fsd-estructural (steiger)
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npx steiger src
      - name: tokens (stylelint anti-magic-value)
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npx stylelint "src/**/*.css"
      - name: fitness visual (Storybook 10 = tests)
        id: visual-fitness
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npx vitest --project=storybook run
      - name: tokens-sync (.tokens.json ⟷ @theme)
        if: ${{ hashFiles('web/package.json') != '' }}
        run: npm run tokens:build && git diff --exit-code src/app/styles/theme.css
      - name: openapi-gen-check (tipos generados ⟷ contrato)
        id: openapi-gen-check
        # se activa al haber contracts/gen: regenera src/shared/api/generated del OpenAPI y verifica
        # diff-cero (quicktype para TS · oapi-codegen para Go); patrón espejo de tokens-sync.
        if: ${{ hashFiles('web/package.json') != '' && hashFiles('arch/contracts/api/openapi.yaml') != '' }}
        run: npm run openapi:gen && git diff --exit-code src/shared/api/generated

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clippy + fmt (shell Tauri)
        if: ${{ hashFiles('shell/Cargo.toml') != '' }}
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
