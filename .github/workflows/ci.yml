# CI — todo check rompe el merge (enforced_by de docs/architecture/conventions/ci.md).
# Jobs paralelos = required status checks en main. Es la garantía dura de los boundaries
# `enforced` de arch/: lo que aquí corre es lo mismo que corre local (lefthook / pnpm / go test).
#
# Historial: hasta 2026-07-07 este workflow estuvo ROTO (npm ci vs pnpm-lock, go-arch-lint mal
# invocado, step openapi:gen fantasma) — main acumuló ≥5 pushes rojos sin que nada bloqueara.
# Reparado en HS-10; si un job vuelve a fallar, se arregla ANTES de seguir empujando features.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "stable" }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7    # v7 = golangci-lint v2
      - name: format check
        run: golangci-lint fmt --diff
      - name: go-arch-lint (grafo de imports permitido)
        run: go run github.com/fe3dback/go-arch-lint@latest check --project-path . --arch-file docs/architecture/fitness/.go-arch-lint.yml
      - name: test
        run: go test ./... -race
      - name: build
        run: go build ./...
      - name: estado-drift (cifras vivas de checkpoint.md ⟷ estado real; RF-178/HS-21)
        # honestidad automática: si el bloque <!--stats--> de docs/product/checkpoint.md quedó stale
        # respecto al estado real (conformance/árbol), rompe el merge. Ignora la fecha de medición
        # (procedencia, no cifra). Es GENERATE-ONLY en modo --check: no escribe el árbol.
        run: bash scripts/estado.sh --check

  ts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4                # lee `packageManager` de web/package.json
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"                   # Storybook 10 = ESM-only, Node ≥ 20.16/22.19/24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: biome
        run: pnpm exec biome ci .
      - name: types
        run: pnpm exec tsc --noEmit
      - name: boundaries (dependency-cruiser, FSD)
        run: pnpm exec depcruise src --config .dependency-cruiser.js
      - name: fsd-estructural (steiger)
        run: pnpm exec steiger src
      - name: tokens (stylelint anti-magic-value)
        run: pnpm exec stylelint "src/**/*.css"
      - name: unit (selectores puros — S1-D7, Node, sin Chromium)
        run: pnpm exec vitest --project=unit run
      - name: fitness visual (Storybook 10 = tests)
        id: visual-fitness
        run: pnpm exec playwright install --with-deps chromium && pnpm exec vitest --project=storybook run
      - name: tokens-sync (.tokens.json ⟷ @theme)
        run: pnpm run tokens:build && git diff --exit-code src/app/styles/theme.css
      - name: openapi-gen-check (tipos generados ⟷ contrato)
        id: openapi-gen-check
        # Se activa cuando el codegen exista de verdad (docs/architecture/contracts/gen/ → src/shared/api/generated).
        # Hoy los tipos son a mano (checks `tipos-generados` = warn, deuda registrada); guard honesto
        # sobre el DIRECTORIO GENERADO, no sobre el yaml — el yaml existe desde HS-04.
        if: ${{ hashFiles('web/src/shared/api/generated/**') != '' }}
        run: pnpm run openapi:gen && git diff --exit-code src/shared/api/generated

  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web/src-tauri } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "stable" }
      - name: sidecar (tauri-build valida externalBin; el binario real está gitignoreado)
        working-directory: .
        run: go build -o web/src-tauri/binaries/arnesia-daemon-x86_64-unknown-linux-gnu ./cmd/arnesia
      - name: deps de sistema (webkit2gtk 4.1 — Tauri 2 en Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: web/src-tauri }
      - name: clippy + fmt (shell Tauri)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check
