# lefthook — gate local pre-commit (enforced_by de arch/conventions/git-hooks.md + commits.md).
# Binario Go, políglota, paralelo, Node-free. Instalar: `go install github.com/evilmartians/lefthook@latest`.
#
# NOTA (honestidad): declarado; se activa cuando el código aterrice (fase 5). lefthook = feedback
# rápido (saltable con --no-verify); el gate DURO es CI (arch/conventions/ci.md).

pre-commit:
  parallel: true
  commands:
    go-lint:
      glob: "*.go"
      # ./... y no {staged_files}: golangci exige archivos de UN solo paquete por invocación;
      # --new-from-rev=HEAD limita el costo a lo nuevo del commit.
      run: golangci-lint run --new-from-rev=HEAD ./...
    go-fmt:
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
    ts:
      root: "web/"
      glob: "*.{ts,tsx}"
      # pnpm exec: biome vive en node_modules/.bin, no en el PATH del hook.
      # --no-errors-on-unmatched: un staged que biome ignora (vite.config, etc.) no rompe el commit.
      run: pnpm exec biome check --write --staged --no-errors-on-unmatched {staged_files}
    rust:
      root: "web/src-tauri/"
      glob: "*.rs"
      run: cargo fmt
    capabilities:
      # R1 integridad + R2 cobertura de CAPABILITIES.md (arch/boundaries/codigo-traza-a-capability.md).
      # Corre al tocar código fuente: si agregás un archivo sin reclamarlo en el SSoT funcional, R2
      # falla acá (feedback local; el gate DURO es CI vía `arnesia conformance`). ~4ms.
      glob: "*.{go,ts,tsx,rs}"
      run: go test ./arch/fitness/ -run 'TestCapability(PointersResolve|Coverage)'

commit-msg:
  commands:
    conventional:
      # Conventional Commits + scope HS-NN (regex Node-free — ver arch/conventions/commits.md)
      run: 'grep -qE "^(feat|fix|docs|refactor|chore|test|perf|build|ci)(\(.+\))?: " {1} || { echo "commit no-Conventional (feat|fix|…: descripción)"; exit 1; }'
