# lefthook — gate local pre-commit (enforced_by de docs/architecture/conventions/git-hooks.md + commits.md).
# Binario Go, políglota, paralelo, Node-free. Instalar: `go install github.com/evilmartians/lefthook@latest`.
#
# NOTA (honestidad): declarado; se activa cuando el código aterrice (fase 5). lefthook = feedback
# rápido (saltable con --no-verify); el gate DURO es CI (docs/architecture/conventions/ci.md).

pre-commit:
  parallel: true
  commands:
    go-lint:
      glob: "*.go"
      # ./... y no {staged_files}: golangci exige archivos de UN solo paquete por invocación;
      # --new-from-rev=HEAD limita el costo a lo nuevo del commit.
      run: golangci-lint run --new-from-rev=HEAD ./...
    go-fmt:
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
    ts:
      root: "web/"
      glob: "*.{ts,tsx}"
      # pnpm exec: biome vive en node_modules/.bin, no en el PATH del hook.
      # --no-errors-on-unmatched: un staged que biome ignora (vite.config, etc.) no rompe el commit.
      run: pnpm exec biome check --write --staged --no-errors-on-unmatched {staged_files}
    rust:
      root: "web/src-tauri/"
      glob: "*.rs"
      run: cargo fmt
    capabilities:
      # R1 integridad + R2 cobertura de docs/product/capabilities/ (docs/architecture/boundaries/codigo-traza-a-capability.md).
      # Corre al tocar código fuente: si agregás un archivo sin reclamarlo en el SSoT funcional, R2
      # falla acá (feedback local; el gate DURO es CI vía `arnesia conformance`). ~4ms.
      glob: "*.{go,ts,tsx,rs}"
      run: go test ./docs/architecture/fitness/ -run 'TestCapability(PointersResolve|Coverage)'
    changelog:
      # El bump de versión exige changelog (VC-D2, paquete versionado-y-changelog-metodologicos).
      # `scripts/bump.sh` ya lo bloquea, pero solo a quien pasa por `make bump-*`: este job agarra
      # el bump A MANO (editor, sed, merge) que dejaría una versión publicada sin decir qué trajo.
      # Corre SOLO al tocar los 3 manifiestos de versión — en cualquier otro commit no molesta. ~30ms.
      glob: "{web/src-tauri/Cargo.toml,web/src-tauri/tauri.conf.json,web/package.json}"
      run: go test ./docs/architecture/fitness/ -run 'TestChangelog(ExisteYTieneForma|CubreLaVersionDeLosManifiestos)'
    estado-cifras:
      # AUTO-CURA las cifras vivas del checkpoint EN EL COMMIT (resuelve Δ1 de HS-21: «que se
      # regeneren solas»). Decide con `--check` (date-insensitive): si driftaron, REGENERA y
      # `git add` del checkpoint → el commit sale con cifras frescas. Corre al tocar archivos que
      # afectan las cifras. ~20-50s (3× go run) — el precio de «solas»; saltable con --no-verify;
      # el gate DURO sigue siendo CI (`estado.sh --check`).
      # NOTA (verificado E2E en HS-21): `stage_fixed` NO sirve acá (solo re-stagea archivos ya
      # staged que matchean el glob; checkpoint.md casi nunca lo está) → `git add` explícito. Y el
      # pre-push tampoco (lefthook lo saltea con «no matching push files»). El único mecanismo que
      # dispara+stagea confiable es pre-commit + `git add`. (Sin race: es el único que toca el index.)
      glob: "*.{go,ts,tsx,rs,yaml,md}"
      run: bash scripts/estado.sh --check >/dev/null 2>&1 || { bash scripts/estado.sh && git add docs/product/checkpoint.md; }

commit-msg:
  commands:
    conventional:
      # Conventional Commits + scope HS-NN (regex Node-free — ver docs/architecture/conventions/commits.md)
      run: 'grep -qE "^(feat|fix|docs|refactor|chore|test|perf|build|ci)(\(.+\))?: " {1} || { echo "commit no-Conventional (feat|fix|…: descripción)"; exit 1; }'
